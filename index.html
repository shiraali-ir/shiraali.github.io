  <style>

      .logo {
        margin-bottom: 24px;
      }

      .search-box {
        min-height: 52px;
      }

      .result {
        padding: 14px 14px 14px 48px;
      }

      .result-site-icon {
        top: 13px;
        left: 12px;
      }

      .result h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <button
    class="theme"
    id="theme"
    type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک"
  >🌙</button>

  <main>
    <img
      class="logo"
      src="https://shiraali.ir/logo.png"
      alt="شیر با دست روی کره زمین"
    >

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input
          id="query"
          type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >
        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="جست‌وجو"
        >➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div
      id="wikiImageWrap"
      class="wiki-image-wrap"
      aria-label="تصویر مرتبط از ویکی‌پدیا"
    >
      <img
        id="wikiImage"
        class="wiki-image"
        alt=""
        loading="lazy"
        referrerpolicy="no-referrer"
      >
    </div>

    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

  <script>
    const API = "https://shiraali-search.onrender.com/search";

    const INITIAL_LIMIT = 5;
    const MAX_RESULTS = 9;

    const ENGINES = ["duckduckgo", "bing", "yandex"];

    const WEIGHTS = {
      duckduckgo: [5, 5, 4, 4, 4],
      bing: [5, 3, 3, 2, 1],
      yandex: [1, 1, 1, 1, 1]
    };

    const themeButton = document.getElementById("theme");
    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const showMoreButton = document.getElementById("showMore");
    const wikiImageWrap = document.getElementById("wikiImageWrap");
    const wikiImage = document.getElementById("wikiImage");

    let preparedResults = [];
    let visibleCount = 0;
    let currentWarnings = [];

    /* تغییر حالت روشن و تاریک */
    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const dark = document.body.classList.contains("dark");

      themeButton.textContent = dark ? "☀️" : "🌙";

      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
    });

    /* دریافت تصویر مرتبط از ویکی‌پدیا */
    async function loadWikipediaImage(query) {
      wikiImage.removeAttribute("src");
      wikiImage.alt = "";
      wikiImageWrap.classList.remove("visible");

      const languages = ["fa", "en"];

      for (const lang of languages) {
        try {
          const api = new URL(
            `https://${lang}.wikipedia.org/w/api.php`
          );

          api.searchParams.set("action", "query");
          api.searchParams.set("generator", "search");
          api.searchParams.set("gsrsearch", query);
          api.searchParams.set("gsrnamespace", "0");
          api.searchParams.set("gsrlimit", "1");
          api.searchParams.set("prop", "pageimages");
          api.searchParams.set("piprop", "thumbnail");
          api.searchParams.set("pithumbsize", "900");
          api.searchParams.set("format", "json");
          api.searchParams.set("origin", "*");

          const response = await fetch(api.toString());

          if (!response.ok) continue;

          const data = await response.json();
          const pages = Object.values(data.query?.pages || {});

          const image = pages.find(
            page => page.thumbnail?.source
          )?.thumbnail?.source;

          if (image) {
            wikiImage.src = image;
            wikiImageWrap.classList.add("visible");
            return;
          }
        } catch (error) {
          console.warn(
            `Wikipedia image lookup (${lang}) failed:`,
            error
          );
        }
      }
    }

    function addText(parent, tag, text, className) {
      const el = document.createElement(tag);

      el.textContent = text || "";

      if (className) {
        el.className = className;
      }

      parent.appendChild(el);

      return el;
    }

    /* یکسان‌سازی نشانی نتایج */
    function normalizedUrl(raw) {
      try {
        const u = new URL(raw);

        if (!["http:", "https:"].includes(u.protocol)) {
          return null;
        }

        u.hash = "";

        u.hostname = u.hostname
          .toLowerCase()
          .replace(/^www\./, "");

        if (u.pathname.length > 1) {
          u.pathname = u.pathname.replace(/\/+$/, "");
        }

        [...u.searchParams.keys()].forEach(k => {
          if (
            /^utm_/i.test(k) ||
            ["gclid", "fbclid"].includes(k.toLowerCase())
          ) {
            u.searchParams.delete(k);
          }
        });

        u.searchParams.sort();

        return u.href;
      } catch {
        return null;
      }
    }

    function hostOf(raw) {
      try {
        return new URL(raw).hostname
          .toLowerCase()
          .replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    /* ساخت آیکون SVG پیش‌فرض کره زمین */
    function createGlobeFallback() {
      const span = document.createElement("span");

      span.className = "icon-fallback";

      span.innerHTML = `
        <svg
          viewBox="0 0 48 48"
          role="img"
          aria-label="کره زمین"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle
            cx="24"
            cy="24"
            r="21"
            fill="#2788d8"
          />

          <g
            fill="none"
            stroke="#fff"
            stroke-width="2.4"
            stroke-linecap="round"
          >
            <ellipse cx="24" cy="24" rx="9.5" ry="21"/>
            <ellipse cx="24" cy="24" rx="20.5" ry="8.5"/>
            <path d="M4 24h40"/>
            <path d="M8 14.5h32"/>
            <path d="M8 33.5h32"/>
          </g>
        </svg>
      `;

      return span;
    }

    /* نمایش یک نتیجه همراه با لوگوی همان سایت */
    function renderOneResult(r) {
      const card = document.createElement("article");
      card.className = "result";

      const iconWrap = document.createElement("div");
      iconWrap.className = "result-site-icon";
      iconWrap.setAttribute("aria-hidden", "true");

      const icon = document.createElement("img");
      icon.alt = "";
      icon.loading = "lazy";
      icon.referrerPolicy = "no-referrer";

      const fallback = createGlobeFallback();

      const host = hostOf(r.url);

      /*
       * ابتدا لوگوی سایت را دریافت می‌کنیم.
       * اگر لوگو بارگذاری نشود، کره زمین نمایش داده می‌شود.
       */
      icon.onerror = () => {
        iconWrap.classList.add("fallback");
      };

      if (host) {
        icon.src =
          `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
      } else {
        iconWrap.classList.add("fallback");
      }

      iconWrap.append(icon, fallback);
      card.appendChild(iconWrap);

      const heading = document.createElement("h2");
      const link = document.createElement("a");

      link.href = r.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = r.title || r.url;

      heading.appendChild(link);
      card.appendChild(heading);

      addText(card, "div", r.url, "result-url");

      if (r.content) {
        addText(card, "p", r.content);
      }

      addText(
        card,
        "span",
        `امتیاز: ${r.score} | موتورهای مؤثر: ${r.engines.join(", ")}`,
        "result-engine"
      );

      resultsBox.appendChild(card);
    }

    /* نمایش نتایج و هشدارهای موتورهای جست‌وجو */
    function renderVisible() {
      resultsBox.replaceChildren();

      preparedResults
        .slice(0, visibleCount)
        .forEach(renderOneResult);

      if (currentWarnings.length) {
        const messages = currentWarnings.map(
          x => `${x.engine}: ${x.reason}`
        );

        addText(
          resultsBox,
          "div",
          "برخی موتورهای جست‌وجو پاسخ نداده‌اند: " +
            messages.join("؛ "),
          "warning"
        );
      }

      showMoreButton.hidden =
        visibleCount >= preparedResults.length ||
        visibleCount >= MAX_RESULTS;
    }

    showMoreButton.addEventListener("click", () => {
      visibleCount = Math.min(
        visibleCount + 4,
        MAX_RESULTS,
        preparedResults.length
      );

      renderVisible();
      statusBox.textContent = "";
    });

    /* ارسال درخواست به موتور جست‌وجو */
    async function searchEngine(query, engine) {
      const url = new URL(API);

      url.searchParams.set("q", query);
      url.searchParams.set("engines", engine);
      url.searchParams.set("format", "json");

      const response = await fetch(url.toString(), {
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      return response.json();
    }

    /* ادغام و رتبه‌بندی نتایج */
    function mergeAndRank(engineData) {
      const merged = new Map();
      let stable = 0;

      for (const engine of ENGINES) {
        const data = engineData[engine];

        if (!data) continue;

        const list = Array.isArray(data.results)
          ? data.results
          : [];

        list.forEach((result, index) => {
          const url = normalizedUrl(result.url);

          if (!url) return;

          let item = merged.get(url);

          if (!item) {
            item = {
              ...result,
              url,
              score: 0,
              engines: [],
              ranks: {},
              _stable: stable++
            };

            merged.set(url, item);
          }

          if (item.engines.includes(engine)) return;

          item.engines.push(engine);
          item.ranks[engine] = index + 1;

          const rank = index + 1;

          if (rank <= 5) {
            item.score += WEIGHTS[engine][rank - 1];
          }

          if (!item.title && result.title) {
            item.title = result.title;
          }

          if (!item.content && result.content) {
            item.content = result.content;
          }
        });
      }

      return [...merged.values()]
        .sort((a, b) =>
          b.score - a.score ||
          (a.ranks.duckduckgo || Infinity) -
            (b.ranks.duckduckgo || Infinity) ||
          (a.ranks.bing || Infinity) -
            (b.ranks.bing || Infinity) ||
          (a.ranks.yandex || Infinity) -
            (b.ranks.yandex || Infinity) ||
          a._stable - b._stable
        )
        .slice(0, MAX_RESULTS);
    }

    /* اجرای جست‌وجو */
    searchForm.addEventListener("submit", async event => {
      event.preventDefault();

      const query = queryInput.value.trim();

      if (!query) return;

      submitButton.disabled = true;
      showMoreButton.hidden = true;
      resultsBox.replaceChildren();

      wikiImage.removeAttribute("src");
      wikiImageWrap.classList.remove("visible");

      loadWikipediaImage(query);

      preparedResults = [];
      visibleCount = 0;
      currentWarnings = [];

      statusBox.textContent =
        "در حال جست‌وجو در DuckDuckGo، Bing و Yandex... " +
        "بار اول ممکن است سرویس Render کمی دیر پاسخ دهد.";

      try {
        const settled = await Promise.all(
          ENGINES.map(async engine => {
            try {
              return {
                engine,
                data: await searchEngine(query, engine)
              };
            } catch (error) {
              return {
                engine,
                error: error.message
              };
            }
          })
        );

        const engineData = {};

        for (const item of settled) {
          if (item.data) {
            engineData[item.engine] = item.data;

            for (
              const warning of
              (item.data.unresponsive_engines || [])
            ) {
              currentWarnings.push({
                engine: item.engine,
                reason: Array.isArray(warning)
                  ? warning.join(": ")
                  : String(warning)
              });
            }
          } else {
            currentWarnings.push({
              engine: item.engine,
              reason: item.error || "پاسخ دریافت نشد"
            });
          }
        }

        preparedResults = mergeAndRank(engineData);

        visibleCount = Math.min(
          INITIAL_LIMIT,
          preparedResults.length
        );

        statusBox.textContent = preparedResults.length
          ? ""
          : "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";

        renderVisible();

        if (
          !preparedResults.length &&
          currentWarnings.length
        ) {
          statusBox.textContent =
            "موتورهای جست‌وجو پاسخ ندادند. " +
            "چند لحظه صبر کن و دوباره امتحان کن.";
        }
      } catch (error) {
        console.error("Shiraali Search error:", error);

        statusBox.textContent =
          "دریافت نتایج ناموفق بود. ممکن است سرویس در حال " +
          "بیدار شدن باشد یا دسترسی مرورگر مسدود شده باشد. " +
          "چند لحظه صبر کن و دوباره امتحان کن.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>Shiraali Search</title>
  <meta name="description" content="جست‌وجوی یکپارچه Shiraali">

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #ffffff;
      --border: #c5dbea;
      --button: #ffffff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255,255,255,.72);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16,47,76,.8);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme {
      position: fixed;
      z-index: 5;
      top: 18px;
      left: 18px;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    main {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .search-icon {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 22px;
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder {
      color: var(--muted);
    }

    .submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      text-align: right;
      margin-top: 18px;
    }

    .result {
      margin: 0 0 14px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover {
      text-decoration: underline;
    }

    .result-url {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .result p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-engine {
      display: inline-block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: right;
    }

    .more {
      display: inline-block;
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--button);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .more:hover {
      filter: brightness(.97);
    }

    .more[hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      main {
        padding-top: 100px;
      }

      .logo {
        margin-bottom: 24px;
      }

      .search-box {
        min-height: 52px;
      }

      .result {
        padding: 14px;
      }

      .result h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <button
    class="theme"
    id="theme"
    type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک"
  >🌙</button>

  <main>
    <img
      class="logo"
      src="https://shiraali.ir/logo.png"
      alt="شیر با دست روی کره زمین"
    >

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="query"
          type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="جست‌وجو"
        >➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite">
      عبارت موردنظرت را وارد کن و جست‌وجو را بزن.
    </div>

    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

  <script>
    // نشانی API موتور جست‌وجو
    const API = "https://shiraali-search.onrender.com/search";

    // ابتدا ۵ نتیجه و حداکثر ۹ نتیجه نمایش داده می‌شود.
    const INITIAL_LIMIT = 5;
    const MAX_RESULTS = 9;

    // فقط این سه موتور به‌صورت خودکار درخواست می‌شوند.
    const SEARCH_ENGINES = [
      "bing",
      "duckduckgo",
      "yandex"
    ];

    // اولویت مرتب‌سازی در صورت برابر بودن تعداد منابع
    const ENGINE_PRIORITY = [
      "bing",
      "duckduckgo",
      "yandex"
    ];

    const ENGINE_NAMES = {
      bing: "Bing",
      duckduckgo: "DuckDuckGo",
      yandex: "Yandex"
    };

    const themeButton = document.getElementById("theme");
    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const showMoreButton = document.getElementById("showMore");

    let preparedResults = [];
    let visibleCount = 0;
    let currentWarnings = [];

    // تغییر حالت روشن و تاریک
    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const dark = document.body.classList.contains("dark");
      themeButton.textContent = dark ? "☀️" : "🌙";

      document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
    });

    function addTextElement(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text || "";

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    // یکسان‌سازی آدرس‌ها برای شناسایی نتایج تکراری
    function normalizedUrl(rawUrl) {
      try {
        const url = new URL(rawUrl);

        if (!["http:", "https:"].includes(url.protocol)) {
          return null;
        }

        url.hash = "";
        url.hostname = url.hostname.toLowerCase()
          .replace(/^www\./, "");

        if (url.pathname.length > 1) {
          url.pathname = url.pathname.replace(/\/+$/, "");
        }

        [
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_term",
          "utm_content",
          "gclid",
          "fbclid"
        ].forEach(key => url.searchParams.delete(key));

        url.searchParams.sort();

        return url.href;
      } catch {
        return null;
      }
    }

    function hostOf(rawUrl) {
      try {
        return new URL(rawUrl).hostname
          .toLowerCase()
          .replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    function isWikipedia(result) {
      return /(^|\.)wikipedia\.org$/.test(hostOf(result.url));
    }

    function isIMDb(result) {
      if (!/(^|\.)imdb\.com$/.test(hostOf(result.url))) {
        return false;
      }

      try {
        return /\/title\/tt\d+/i.test(
          new URL(result.url).pathname
        );
      } catch {
        return false;
      }
    }

    // استخراج موتورهایی که هر نتیجه را گزارش کرده‌اند
    function getResultEngines(result) {
      const raw = Array.isArray(result.engines)
        ? result.engines
        : (result.engine ? [result.engine] : []);

      return [...new Set(
        raw
          .map(name => String(name).toLowerCase().trim())
          .filter(name => SEARCH_ENGINES.includes(name))
      )];
    }

    // حذف تکراری‌ها و مرتب‌سازی نتایج
    function prepareResults(data) {
      const seen = new Set();
      const all = [];

      for (const original of (data.results || [])) {
        const url = normalizedUrl(original.url);

        if (!url || seen.has(url)) {
          continue;
        }

        seen.add(url);

        all.push({
          ...original,
          url,
          _engines: getResultEngines(original)
        });
      }

      const used = new Set();
      const ordered = [];

      function takeFirst(predicate) {
        const found = all.find(
          item => !used.has(item.url) && predicate(item)
        );

        if (found) {
          used.add(found.url);
          ordered.push(found);
        }
      }

      // در صورت وجود، ابتدا نتیجه IMDb نمایش داده می‌شود.
      takeFirst(isIMDb);

      // در صورت وجود، سپس نتیجه Wikipedia نمایش داده می‌شود.
      takeFirst(isWikipedia);

      // بقیه نتایج بر اساس تعداد موتورهای تأییدکننده مرتب می‌شوند.
      // در تساوی: Bing، سپس DuckDuckGo، سپس Yandex.
      const remaining = all
        .filter(item => !used.has(item.url))
        .sort((a, b) => {
          const countDifference =
            b._engines.length - a._engines.length;

          if (countDifference !== 0) {
            return countDifference;
          }

          function bestPriority(item) {
            const ranks = item._engines
              .map(engine => ENGINE_PRIORITY.indexOf(engine))
              .filter(rank => rank >= 0);

            return ranks.length
              ? Math.min(...ranks)
              : ENGINE_PRIORITY.length;
          }

          return bestPriority(a) - bestPriority(b);
        });

      ordered.push(...remaining);

      return ordered.slice(0, MAX_RESULTS);
    }

    // ساخت کارت هر نتیجه
    function renderOneResult(result) {
      const card = document.createElement("article");
      card.className = "result";

      const heading = document.createElement("h2");
      const link = document.createElement("a");

      link.href = result.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = result.title || result.url;

      heading.appendChild(link);
      card.appendChild(heading);

      addTextElement(card, "div", result.url, "result-url");

      if (result.content) {
        addTextElement(card, "p", result.content);
      }

      const engineText = result._engines
        .map(engine => ENGINE_NAMES[engine] || engine)
        .join(", ");

      if (engineText) {
        addTextElement(
          card,
          "span",
          "منبع: " + engineText,
          "result-engine"
        );
      }

      resultsBox.appendChild(card);
    }

    // نمایش نتایج و پیام‌های خطای موتورهای جست‌وجو
    function renderVisibleResults() {
      resultsBox.replaceChildren();

      preparedResults
        .slice(0, visibleCount)
        .forEach(renderOneResult);

      if (currentWarnings.length) {
        const messages = currentWarnings.map(item => {
          const name = item[0] || "موتور ناشناس";
          const reason = item[1] || "پاسخ نداد";

          return `${name}: ${reason}`;
        });

        addTextElement(
          resultsBox,
          "div",
          "برخی موتورهای جست‌وجو پاسخ نداده‌اند: " +
            messages.join("؛ "),
          "warning"
        );
      }

      showMoreButton.hidden =
        visibleCount >= preparedResults.length ||
        visibleCount >= MAX_RESULTS;
    }

    // نمایش ۴ نتیجه دیگر با هر بار کلیک
    showMoreButton.addEventListener("click", () => {
      visibleCount = Math.min(
        visibleCount + 4,
        MAX_RESULTS,
        preparedResults.length
      );

      renderVisibleResults();

      statusBox.textContent =
        `${visibleCount} از ${preparedResults.length} نتیجه نمایش داده شده است.`;
    });

    function renderResults(data) {
      preparedResults = prepareResults(data);
      currentWarnings = data.unresponsive_engines || [];

      visibleCount = Math.min(
        INITIAL_LIMIT,
        preparedResults.length
      );

      if (preparedResults.length === 0) {
        statusBox.textContent =
          "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";
      } else {
        statusBox.textContent =
          `${preparedResults.length} نتیجه پیدا شد؛ ` +
          `ابتدا ${visibleCount} نتیجه نمایش داده می‌شود.`;
      }

      renderVisibleResults();
    }

    // اجرای جست‌وجو
    searchForm.addEventListener("submit", async event => {
      event.preventDefault();

      const query = queryInput.value.trim();

      if (!query) {
        return;
      }

      const url = new URL(API);

      url.searchParams.set("q", query);
      url.searchParams.set(
        "engines",
        SEARCH_ENGINES.join(",")
      );
      url.searchParams.set("format", "json");

      submitButton.disabled = true;
      showMoreButton.hidden = true;

      statusBox.textContent =
        "در حال جست‌وجو... بار اول ممکن است سرویس Render کمی دیر پاسخ دهد.";

      resultsBox.replaceChildren();
      preparedResults = [];
      visibleCount = 0;
      currentWarnings = [];

      try {
        const response = await fetch(url.toString(), {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        renderResults(data);

      } catch (error) {
        console.error("Shiraali Search error:", error);

        statusBox.textContent =
          "دریافت نتایج ناموفق بود. ممکن است سرویس در حال بیدار شدن باشد " +
          "یا دسترسی مرورگر (CORS) مسدود شده باشد. " +
          "چند لحظه صبر کن و دوباره امتحان کن.";

        const help = document.createElement("a");
        help.className = "more";
        help.href = url.toString();
        help.target = "_blank";
        help.rel = "noopener noreferrer";
        help.textContent = "آزمایش مستقیم سرویس جست‌وجو";

        resultsBox.appendChild(help);

      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>

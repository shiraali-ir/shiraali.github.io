
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <meta name="description" content="جست‌وجوی یکپارچه شیرالی">
  <title>شیرالی | Shiraali Search</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #ffffff;
      --border: #c5dbea;
      --button: #ffffff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255, 255, 255, .75);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16, 47, 76, .85);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme {
      position: fixed;
      z-index: 10;
      top: 18px;
      left: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    main {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: 100px 0 45px;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
    }

    .search-icon {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 22px;
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder {
      color: var(--muted);
    }

    .submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-size: 20px;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      margin-top: 18px;
      text-align: right;
    }

    .result {
      margin-bottom: 14px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover {
      text-decoration: underline;
    }

    .result-url {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .result p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-score {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .result-engine {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      main {
        padding-top: 100px;
      }

      .logo {
        margin-bottom: 24px;
      }

      .result {
        padding: 14px;
      }

      .result h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <button
    class="theme"
    id="theme"
    type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک"
  >🌙</button>

  <main>
    <img
      class="logo"
      src="https://shiraali.ir/logo.png"
      alt="شیر با دست روی کره زمین"
    >

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="query"
          type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="جست‌وجو"
        >➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite">
      عبارت موردنظرت را وارد کن و جست‌وجو را بزن.
    </div>

    <section id="results" aria-label="نتایج جست‌وجو"></section>
  </main>

  <script>
    const API = "https://shiraali-search.onrender.com/search";

    // وزن ثابت هر موتور جست‌وجو
    const ENGINES = [
      {
        id: "duckduckgo",
        label: "DuckDuckGo",
        points: 5,
        priority: 0
      },
      {
        id: "bing",
        label: "Bing",
        points: 3,
        priority: 1
      },
      {
        id: "yandex",
        label: "Yandex",
        points: 1,
        priority: 2
      }
    ];

    // حداکثر ۱۰ نتیجه از هر موتور
    const RESULTS_PER_ENGINE = 10;

    const themeButton = document.getElementById("theme");
    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");

    // تغییر حالت روشن و تاریک
    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const dark = document.body.classList.contains("dark");

      themeButton.textContent = dark ? "☀️" : "🌙";

      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
    });

    function addTextElement(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text || "";

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    // فقط بخش fragment یعنی #... حذف می‌شود.
    // مسیر و پارامترهای URL حفظ می‌شوند تا صفحات متفاوت اشتباهاً ادغام نشوند.
    function normalizeURL(rawURL) {
      try {
        const url = new URL(rawURL);

        if (!["http:", "https:"].includes(url.protocol)) {
          return null;
        }

        url.hash = "";

        return url.href;
      } catch {
        return null;
      }
    }

    // درخواست مستقل برای هر موتور
    async function searchOneEngine(query, engine) {
      const url = new URL(API);

      url.searchParams.set("q", query);
      url.searchParams.set("engines", engine.id);
      url.searchParams.set("format", "json");

      const response = await fetch(url.toString(), {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      const results = Array.isArray(data.results)
        ? data.results.slice(0, RESULTS_PER_ENGINE)
        : [];

      return {
        engine,
        results,
        warnings: Array.isArray(data.unresponsive_engines)
          ? data.unresponsive_engines
          : []
      };
    }

    // ادغام URLهای مشابه و جمع امتیاز موتورهای مختلف
    function mergeAndRank(engineResponses) {
      const resultsByURL = new Map();

      for (const response of engineResponses) {
        const engine = response.engine;

        response.results.forEach((item, index) => {
          const normalized = normalizeURL(item.url || "");

          if (!normalized) {
            return;
          }

          let result = resultsByURL.get(normalized);

          if (!result) {
            result = {
              url: normalized,
              title: item.title || normalized,
              content: item.content || "",
              score: 0,
              engines: [],
              firstRanks: {}
            };

            resultsByURL.set(normalized, result);
          }

          // هر موتور برای یک URL فقط یک بار امتیاز می‌دهد.
          const alreadyCounted = result.engines.some(
            existing => existing.id === engine.id
          );

          if (!alreadyCounted) {
            result.engines.push(engine);
            result.score += engine.points;
            result.firstRanks[engine.id] = index;
          }

          // اگر عنوان یا توضیح قبلی خالی بود، آن را تکمیل می‌کنیم.
          if (
            (!result.title || result.title === result.url) &&
            item.title
          ) {
            result.title = item.title;
          }

          if (!result.content && item.content) {
            result.content = item.content;
          }
        });
      }

      // مرتب‌سازی نزولی بر اساس امتیاز کل
      return [...resultsByURL.values()].sort((a, b) => {
        if (b.score !== a.score) {
          return b.score - a.score;
        }

        // در امتیاز برابر:
        // ابتدا رتبه DuckDuckGo، سپس Bing، سپس Yandex.
        for (const engine of ENGINES) {
          const rankA = a.firstRanks[engine.id];
          const rankB = b.firstRanks[engine.id];

          if (
            rankA !== undefined &&
            rankB !== undefined &&
            rankA !== rankB
          ) {
            return rankA - rankB;
          }

          if (rankA !== undefined && rankB === undefined) {
            return -1;
          }

          if (rankA === undefined && rankB !== undefined) {
            return 1;
          }
        }

        return a.url.localeCompare(b.url);
      });
    }

    function renderResults(results, warnings) {
      resultsBox.replaceChildren();

      if (results.length === 0) {
        statusBox.textContent =
          "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";
      } else {
        statusBox.textContent =
          `${results.length} نتیجهٔ یکتا پیدا شد؛ همهٔ نتایج نمایش داده می‌شوند.`;
      }

      // بدون محدودیت ۵ یا ۹ نتیجه
      for (const result of results) {
        const card = document.createElement("article");
        card.className = "result";

        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = result.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = result.title || result.url;

        heading.appendChild(link);
        card.appendChild(heading);

        addTextElement(
          card,
          "div",
          result.url,
          "result-url"
        );

        if (result.content) {
          addTextElement(card, "p", result.content);
        }

        addTextElement(
          card,
          "div",
          `امتیاز کل: ${result.score}`,
          "result-score"
        );

        const engineNames = result.engines
          .slice()
          .sort((a, b) => a.priority - b.priority)
          .map(engine => `${engine.label} (+${engine.points})`)
          .join("، ");

        addTextElement(
          card,
          "div",
          `موتورهای امتیازدهنده: ${engineNames}`,
          "result-engine"
        );

        resultsBox.appendChild(card);
      }

      if (warnings.length > 0) {
        const uniqueWarnings = [...new Set(warnings)];

        addTextElement(
          resultsBox,
          "div",
          "هشدار موتورهای جست‌وجو: " + uniqueWarnings.join("؛ "),
          "warning"
        );
      }
    }

    searchForm.addEventListener("submit", async event => {
      event.preventDefault();

      const query = queryInput.value.trim();

      if (!query) {
        return;
      }

      submitButton.disabled = true;
      resultsBox.replaceChildren();

      statusBox.textContent =
        "در حال جست‌وجو در DuckDuckGo، Bing و Yandex... " +
        "درخواست اول ممکن است به‌دلیل سرویس رایگان Render کمی طول بکشد.";

      try {
        // شکست یک موتور مانع دریافت نتایج دو موتور دیگر نمی‌شود.
        const settled = await Promise.allSettled(
          ENGINES.map(engine => searchOneEngine(query, engine))
        );

        const successfulResponses = [];
        const warnings = [];

        settled.forEach((outcome, index) => {
          const engine = ENGINES[index];

          if (outcome.status === "fulfilled") {
            successfulResponses.push(outcome.value);

            for (const warning of outcome.value.warnings) {
              if (Array.isArray(warning)) {
                warnings.push(`${warning[0]}: ${warning[1]}`);
              } else {
                warnings.push(`${engine.label}: ${String(warning)}`);
              }
            }
          } else {
            warnings.push(
              `${engine.label}: ${
                outcome.reason?.message || "پاسخ دریافت نشد"
              }`
            );
          }
        });

        const rankedResults = mergeAndRank(successfulResponses);

        renderResults(rankedResults, warnings);

        if (successfulResponses.length === 0) {
          statusBox.textContent =
            "هیچ‌یک از موتورهای جست‌وجو پاسخ ندادند. " +
            "چند لحظه صبر کن و دوباره امتحان کن.";
        }
      } catch (error) {
        console.error("Shiraali Search error:", error);

        statusBox.textContent =
          "دریافت نتایج ناموفق بود. ممکن است سرویس در دسترس نباشد " +
          "یا مرورگر دسترسی را مسدود کرده باشد. دوباره امتحان کن.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>

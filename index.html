
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>Shiraali</title>
  <meta name="description" content="جست‌وجوی شخصی Shiraali">

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #ffffff;
      --border: #c5dbea;
      --button: #ffffff;
      --muted: #526b80;
      --accent: #1677c8;
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme {
      position: absolute;
      top: 18px;
      left: 18px;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    main {
      width: min(620px, 92%);
      margin: 0 auto;
      padding-top: clamp(90px, 17vh, 165px);
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 30px;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      transition: box-shadow .2s;
    }

    .search-box:focus-within,
    .search-box:hover {
      box-shadow: 0 3px 12px rgba(0, 0, 0, .09);
    }

    .search-icon {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 22px;
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder {
      color: var(--muted);
      opacity: .85;
    }

    .submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    details {
      margin: 17px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    summary {
      display: inline-block;
      cursor: pointer;
      padding: 7px 12px;
      border-radius: 18px;
      user-select: none;
    }

    summary:hover {
      background: var(--button);
    }

    .engines {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
      margin: 12px auto;
    }

    .engines label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .engines input {
      accent-color: var(--accent);
    }

    @media (max-width: 480px) {
      main {
        padding-top: 115px;
      }

      .logo {
        margin-bottom: 25px;
      }

      .search-box {
        min-height: 52px;
      }
    }
  </style>
</head>

<body>
  <button class="theme" id="theme" type="button"
          aria-label="تغییر حالت روشن و تاریک"
          title="تغییر حالت روشن و تاریک">🌙</button>

  <main>
    <img
      class="logo"
      src="https://shiraali.ir/logo.png"
      alt="شیر با دست روی کره زمین"
    >

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="query"
          type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >

        <button class="submit" type="submit"
                aria-label="جست‌وجو">➜</button>
      </div>

      <details>
        <summary>موتورهای جست‌وجو</summary>
        <div class="engines">
          <label><input type="checkbox" value="google" checked> Google</label>
          <label><input type="checkbox" value="bing" checked> Bing</label>
          <label><input type="checkbox" value="duckduckgo" checked> DuckDuckGo</label>
          <label><input type="checkbox" value="brave" checked> Brave</label>
          <label><input type="checkbox" value="yandex"> Yandex</label>
        </div>
      </details>
    </form>
  </main>

  <script>
    const themeButton = document.getElementById("theme");
    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");

    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const dark = document.body.classList.contains("dark");
      themeButton.textContent = dark ? "☀️" : "🌙";

      document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
    });

    const engineUrls = {
      google: q => "https://www.google.com/search?q=" + q,
      bing: q => "https://www.bing.com/search?q=" + q,
      duckduckgo: q => "https://duckduckgo.com/?q=" + q,
      brave: q => "https://search.brave.com/search?q=" + q,
      yandex: q => "https://yandex.com/search/?text=" + q
    };

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      const query = queryInput.value.trim();
      if (!query) return;

      const encoded = encodeURIComponent(query);
      const selected = [
        ...document.querySelectorAll(
          ".engines input:checked"
        )
      ].map(input => input.value);

      if (selected.length === 0) {
        alert("حداقل یک موتور جست‌وجو انتخاب کن.");
        return;
      }

      selected.forEach(engine => {
        window.open(engineUrls[engine](encoded), "_blank");
      });
    });
  </script>
</body>
</html>

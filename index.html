
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <meta name="description" content="موتور جست‌وجوی شیرالی؛ جست‌وجوی یکپارچه در DuckDuckGo، Bing و Yandex">
  <title>شیرالی | Shiraali Search</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #ffffff;
      --border: #c5dbea;
      --button: #ffffff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255,255,255,.78);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16,47,76,.85);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme {
      position: fixed;
      z-index: 5;
      top: 18px;
      left: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    main {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 22px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 25px;
      font-weight: 600;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 9px 5px 7px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .search-icon {
      flex-shrink: 0;
      padding-right: 7px;
      color: var(--muted);
      font-size: 22px;
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder {
      color: var(--muted);
    }

    .submit {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 21px;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      margin-top: 18px;
      text-align: right;
    }

    .result {
      margin: 0 0 14px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover {
      text-decoration: underline;
    }

    .result-url {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .result p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .score {
      display: inline-block;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-weight: bold;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: right;
    }

    .more {
      display: inline-block;
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    .more:hover {
      filter: brightness(.97);
    }

    .more[hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      main {
        padding-top: 100px;
      }

      .logo {
        margin-bottom: 20px;
      }

      h1 {
        font-size: 22px;
      }

      .search-box {
        min-height: 52px;
      }

      .result {
        padding: 14px;
      }

      .result h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <button
    class="theme"
    id="theme"
    type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک"
  >🌙</button>

  <main>
    <img
      class="logo"
      src="https://shiraali.ir/logo.png"
      alt="لوگوی شیرالی"
    >

    <h1>شیرالی | Shiraali Search</h1>

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="query"
          type="search"
          placeholder="چه چیزی می‌خواهی پیدا کنی؟"
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="جست‌وجو"
        >➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite">
      عبارت موردنظرت را وارد کن و جست‌وجو را بزن.
    </div>

    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

  <script>
    "use strict";

    const API = "https://shiraali-search.onrender.com/search";

    // امتیاز ثابت هر موتور
    const ENGINES = [
      { name: "duckduckgo", label: "DuckDuckGo", weight: 5 },
      { name: "bing",       label: "Bing",       weight: 3 },
      { name: "yandex",     label: "Yandex",     weight: 1 }
    ];

    // رابط کاربری: ابتدا ۵ نتیجه، سپس حداکثر ۹ نتیجه
    const INITIAL_LIMIT = 5;
    const MAX_DISPLAY_RESULTS = 9;
    const MAX_PER_ENGINE = 10;

    const themeButton = document.getElementById("theme");
    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const showMoreButton = document.getElementById("showMore");

    let rankedResults = [];
    let visibleCount = 0;
    let warnings = [];
    let searchSequence = 0;

    // تغییر حالت روشن و تاریک
    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const dark = document.body.classList.contains("dark");

      themeButton.textContent = dark ? "☀️" : "🌙";

      document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
    });

    // فقط بخش fragment حذف می‌شود.
    // مسیر، اسلش انتهایی و پارامترهای query حفظ می‌شوند.
    // www و بدون www نیز به‌طور خودکار یکی نمی‌شوند.
    function normalizeURL(rawURL) {
      try {
        const url = new URL(rawURL);

        if (!["http:", "https:"].includes(url.protocol)) {
          return null;
        }

        url.hash = "";

        return url.href;
      } catch {
        return null;
      }
    }

    function addTextElement(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text || "";

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    // هر موتور جداگانه جست‌وجو می‌شود.
    // خطای یک موتور مانع دریافت نتایج موتورهای دیگر نیست.
    async function searchEngine(query, engine) {
      const url = new URL(API);

      url.searchParams.set("q", query);
      url.searchParams.set("engines", engine.name);
      url.searchParams.set("format", "json");

      try {
        const response = await fetch(url.toString(), {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        const results = Array.isArray(data.results)
          ? data.results.slice(0, MAX_PER_ENGINE)
          : [];

        return {
          engine,
          results,
          errors: Array.isArray(data.unresponsive_engines)
            ? data.unresponsive_engines
            : [],
          error: null
        };
      } catch (error) {
        console.error("Search engine error:", engine.name, error);

        return {
          engine,
          results: [],
          errors: [],
          error: error.message || "خطای ارتباط"
        };
      }
    }

    // ادغام فقط با نشانی یکسان پس از حذف #fragment
    function rankResults(engineResponses) {
      const merged = new Map();
      let stableOrder = 0;

      for (const response of engineResponses) {
        const engine = response.engine;
        const seenInThisEngine = new Set();

        response.results.forEach((result, index) => {
          if (!result || !result.url) {
            return;
          }

          const key = normalizeURL(result.url);

          if (!key || seenInThisEngine.has(key)) {
            return;
          }

          // یک موتور برای یک صفحه فقط یک بار امتیاز می‌دهد.
          seenInThisEngine.add(key);

          if (!merged.has(key)) {
            merged.set(key, {
              url: key,
              title: result.title || key,
              content: result.content || "",
              score: 0,
              engines: [],
              enginePriority: 99,
              engineRanks: [Infinity, Infinity, Infinity],
              order: stableOrder++
            });
          }

          const item = merged.get(key);

          item.score += engine.weight;

          if (!item.engines.includes(engine.name)) {
            item.engines.push(engine.name);
          }

          const priority = ENGINES.findIndex(
            candidate => candidate.name === engine.name
          );

          item.enginePriority = Math.min(
            item.enginePriority,
            priority
          );

          item.engineRanks[priority] = Math.min(
            item.engineRanks[priority],
            index + 1
          );

          if (
            (!item.title || item.title === item.url) &&
            result.title
          ) {
            item.title = result.title;
          }

          if (!item.content && result.content) {
            item.content = result.content;
          }
        });
      }

      // امتیاز بیشتر اول؛ در تساوی اولویت DDG، سپس Bing، سپس Yandex
      return Array.from(merged.values()).sort((a, b) => {
        if (b.score !== a.score) {
          return b.score - a.score;
        }

        if (a.enginePriority !== b.enginePriority) {
          return a.enginePriority - b.enginePriority;
        }

        for (let i = 0; i < ENGINES.length; i++) {
          if (a.engineRanks[i] !== b.engineRanks[i]) {
            return a.engineRanks[i] - b.engineRanks[i];
          }
        }

        return a.order - b.order;
      });
    }

    function renderOneResult(result) {
      const card = document.createElement("article");
      card.className = "result";

      const heading = document.createElement("h2");
      const link = document.createElement("a");

      link.href = result.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = result.title || result.url;

      heading.appendChild(link);
      card.appendChild(heading);

      addTextElement(card, "div", result.url, "result-url");

      if (result.content) {
        addTextElement(card, "p", result.content);
      }

      const meta = document.createElement("div");
      meta.className = "result-meta";

      addTextElement(
        meta,
        "span",
        "منبع: " + result.engines.map(name => {
          const engine = ENGINES.find(item => item.name === name);
          return engine ? engine.label : name;
        }).join("، ")
      );

      addTextElement(
        meta,
        "span",
        "امتیاز: " + result.score,
        "score"
      );

      card.appendChild(meta);
      resultsBox.appendChild(card);
    }

    function renderVisibleResults() {
      resultsBox.replaceChildren();

      rankedResults
        .slice(0, visibleCount)
        .forEach(renderOneResult);

      if (warnings.length) {
        addTextElement(
          resultsBox,
          "div",
          "هشدار: " + warnings.join("؛ "),
          "warning"
        );
      }

      showMoreButton.hidden =
        visibleCount >= rankedResults.length ||
        visibleCount >= MAX_DISPLAY_RESULTS;
    }

    showMoreButton.addEventListener("click", () => {
      visibleCount = Math.min(
        visibleCount + 4,
        MAX_DISPLAY_RESULTS,
        rankedResults.length
      );

      renderVisibleResults();

      statusBox.textContent =
        `${visibleCount} از ${Math.min(
          rankedResults.length,
          MAX_DISPLAY_RESULTS
        )} نتیجه نمایش داده شده است.`;
    });

    searchForm.addEventListener("submit", async event => {
      event.preventDefault();

      const query = queryInput.value.trim();
      if (!query) return;

      const thisSearch = ++searchSequence;

      submitButton.disabled = true;
      showMoreButton.hidden = true;
      resultsBox.replaceChildren();

      rankedResults = [];
      visibleCount = 0;
      warnings = [];

      statusBox.textContent =
        "در حال جست‌وجو در DuckDuckGo، Bing و Yandex... " +
        "بار اول ممکن است سرویس Render دیر پاسخ دهد.";

      try {
        // اجرای هم‌زمان سه موتور مستقل
        const responses = await Promise.all(
          ENGINES.map(engine => searchEngine(query, engine))
        );

        // اگر جست‌وجوی جدیدتری شروع شده باشد، نتیجه قدیمی نمایش داده نشود.
        if (thisSearch !== searchSequence) return;

        for (const response of responses) {
          if (response.error) {
            warnings.push(
              response.engine.label + ": " + response.error
            );
          }

          for (const failed of response.errors) {
            const name = Array.isArray(failed)
              ? failed[0]
              : response.engine.label;

            const reason = Array.isArray(failed)
              ? failed[1]
              : "پاسخ دریافت نشد";

            warnings.push(name + ": " + reason);
          }
        }

        // هر یک از ۱۰ نتیجهٔ هر موتور امتیاز ثابت خود را می‌گیرد.
        // امتیاز خام SearXNG در محاسبه استفاده نمی‌شود.
        const allRankedResults = rankResults(responses);

        // الگوریتم همهٔ نتایج یکتا را رتبه‌بندی می‌کند؛
        // رابط کاربری حداکثر ۹ نتیجه نمایش می‌دهد.
        rankedResults = allRankedResults.slice(
          0,
          MAX_DISPLAY_RESULTS
        );

        visibleCount = Math.min(
          INITIAL_LIMIT,
          rankedResults.length
        );

        if (rankedResults.length === 0) {
          statusBox.textContent = warnings.length
            ? "نتیجه‌ای دریافت نشد. ممکن است موتورهای جست‌وجو موقتاً در دسترس نباشند."
            : "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";
        } else {
          statusBox.textContent =
            `${rankedResults.length} نتیجهٔ برتر پیدا شد؛ ` +
            `ابتدا ${visibleCount} نتیجه نمایش داده می‌شود.`;
        }

        renderVisibleResults();
      } catch (error) {
        console.error("Shiraali Search error:", error);

        if (thisSearch === searchSequence) {
          statusBox.textContent =
            "در دریافت نتایج مشکلی پیش آمد. چند لحظه صبر کن و دوباره تلاش کن.";
        }
      } finally {
        if (thisSearch === searchSequence) {
          submitButton.disabled = false;
        }
      }
    });
  </script>
</body>
</html>

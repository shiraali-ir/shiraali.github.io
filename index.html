<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>Shiraali Search</title>
  <meta name="description" content="جست‌وجوی یکپارچه Shiraali">

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #fff;
      --border: #c5dbea;
      --button: #fff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255,255,255,.72);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16,47,76,.8);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme-icon {
      width: 25px;
      height: 25px;
      display: block;
      flex: none;
    }

    .theme {
      position: absolute;
      z-index: 9999;
      top: 8px;
      left: 8px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    main {
      width: 60%;
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .logo-link {
      display: block;
      width: fit-content;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }

    .search-form { width: 100%; }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px 5px 5px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder { color: var(--muted); }

    .submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      text-align: right;
      margin-top: 18px;
      width: 100%;
    }

    .result {
      position: relative;
      width: 100%;
      margin: 0 0 14px;
      padding: 17px 18px 17px 54px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result-site-icon {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255,255,255,.8);
      padding: 2px;
    }

    /* گالری تصاویر */
    .wiki-image-wrap {
      display: none;
      width: 100%;
      margin: 18px 0 22px;
      padding: 0;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: transparent;
      overflow: hidden;
    }

    .wiki-image-wrap.visible { display: block; }

    .wiki-gallery {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: clamp(260px, 50vw, 520px);
      min-height: 260px;
      overflow: hidden;
      border-radius: inherit;
    }

    /* کادر ۲: ساعت و مناسبت */
    .clock-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 26px 18px;
      text-align: center;
    }

    .clock-time {
      direction: ltr;
      font-size: clamp(40px, 9vw, 72px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .clock-event {
      font-size: 15px;
      line-height: 1.9;
      color: var(--muted);
    }

    #clockWrap {
      position: relative;
      background: var(--card);
    }

    /* کادر مسئلهٔ ریاضی: فقط پاسخ */
    #mathWrap { background: var(--card); }

    .math-answer {
      padding: 34px 18px;
      direction: ltr;
      text-align: center;
      font-size: clamp(40px, 10vw, 80px);
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    /* کادر ۲ (غذا): ارزش غذایی */
    #nutritionWrap { background: var(--card); }

    .nutrition-panel {
      padding: 20px;
      text-align: right;
    }

    .nutrition-title {
      margin: 0 0 4px;
      font-size: 19px;
      line-height: 1.8;
    }

    .nutrition-sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .nutrition-calories {
      margin: 12px 0 16px;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 700;
      line-height: 1.4;
    }

    .nutrition-section {
      margin: 16px 0 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .nutrition-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    #clockWrap.holiday::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 60, 60, .08);
      pointer-events: none;
    }

    /* اسلاید تصویری وضعیت آب‌وهوا */
    .weather-image-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      color: #fff;
      background: linear-gradient(145deg, #368dcc, #153b66 78%);
      text-align: center;
      overflow: hidden;
    }

    .weather-image-panel::before,
    .weather-image-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
      pointer-events: none;
    }

    .weather-image-panel::before {
      width: 280px;
      height: 280px;
      top: -115px;
      right: -65px;
    }

    .weather-image-panel::after {
      width: 220px;
      height: 220px;
      bottom: -115px;
      left: -45px;
    }

    .weather-image-icon {
      position: relative;
      z-index: 1;
      font-size: clamp(82px, 16vw, 150px);
      line-height: 1.35;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.15));
    }

    .weather-image-place {
      position: relative;
      z-index: 1;
      font-size: clamp(19px, 3vw, 27px);
      font-weight: 700;
      line-height: 1.7;
    }

    .weather-image-temperature {
      position: relative;
      z-index: 1;
      font-size: clamp(30px, 6vw, 46px);
      font-weight: 700;
      direction: ltr;
    }

    .weather-image-description {
      position: relative;
      z-index: 1;
      font-size: 16px;
      line-height: 1.8;
    }

    .wiki-image {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center;
      margin: 0;
      border-radius: inherit;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 44px;
      height: 58px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 5px rgba(0,0,0,.65);
      appearance: none;
      -webkit-appearance: none;
    }

    .gallery-prev {
      right: 12px;
      left: auto;
    }

    .gallery-next {
      left: 12px;
      right: auto;
    }

    .gallery-arrow:focus-visible {
      outline: 1px solid rgba(255,255,255,.7);
      outline-offset: -5px;
    }

    .gallery-arrow[hidden] { display: none; }

    .result h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover { text-decoration: underline; }

    .result p {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-engine {
      display: inline-block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: right;
    }

    /* کارت هواشناسی */
    .weather-card {
      position: relative;
      width: 100%;
      margin: 0 0 14px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      text-align: right;
      overflow: hidden;
    }

    .weather-details-title {
      margin: 0 0 14px;
      font-size: 19px;
      line-height: 1.8;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .weather-metric {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 16px;
      min-width: 0;
    }

    .weather-metric-label {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .weather-metric-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }

    .weather-source {
      display: block;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .weather-source a { color: var(--accent); }

    .more {
      display: inline-block;
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--button);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .more:hover { filter: brightness(.97); }
    .more[hidden] { display: none; }

    @media (max-width: 700px) {
      main { width: 92%; }
    }

    @media (max-width: 480px) {
      main { padding-top: 100px; }
      .logo { margin-bottom: 24px; }
      .search-box { min-height: 52px; }

      .wiki-gallery {
        height: 300px;
        min-height: 240px;
      }

      .gallery-arrow {
        width: 38px;
        height: 50px;
        font-size: 42px;
      }

      .gallery-prev {
        right: 6px;
        left: auto;
      }

      .gallery-next {
        left: 6px;
        right: auto;
      }

      .result { padding: 14px 14px 14px 48px; }

      .result-site-icon {
        top: 12px;
        left: 12px;
        width: 27px;
        height: 27px;
      }

      .result h2 { font-size: 16px; }
      .weather-card { padding: 14px; }
      .weather-grid { gap: 8px; }
      .weather-metric { padding: 10px; }
    }
  </style>
</head>

<body>
  <button class="theme" id="theme" type="button"
    aria-label="تغییر حالت روشن و تاریک" title="تغییر حالت روشن و تاریک">
    <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#fff" d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"/>
    </svg>
  </button>

  <main>
    <a class="logo-link" href="https://shiraali.ir/" aria-label="بارگذاری مجدد Shiraali">
      <img class="logo" src="https://shiraali.ir/logo.png"
        alt="شیر با دست روی کره زمین">
    </a>

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input id="query" type="search" placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو" autocomplete="off" required>
        <button class="submit" id="submitButton" type="submit"
          aria-label="جست‌وجو">➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <!-- کادر ۱: گالری تصاویر -->
    <div id="wikiImageWrap" class="wiki-image-wrap"
      aria-label="گالری تصاویر مرتبط">
      <div class="wiki-gallery">
        <button id="galleryPrev" class="gallery-arrow gallery-prev"
          type="button" aria-label="عکس قبلی" title="عکس قبلی" hidden>‹</button>

        <img id="wikiImage" class="wiki-image" alt=""
          loading="lazy" referrerpolicy="no-referrer">

        <button id="galleryNext" class="gallery-arrow gallery-next"
          type="button" aria-label="عکس بعدی" title="عکس بعدی" hidden>›</button>
      </div>
    </div>

    <!-- کادر ۲: ساعت و مناسبت (فقط برای جست‌وجوی مکان) -->
    <div id="clockWrap" class="wiki-image-wrap" aria-label="ساعت و مناسبت‌ها">
      <div id="clockBox"></div>
    </div>

    <!-- مسئلهٔ ریاضی: تنها کادر نمایش‌داده‌شده، فقط پاسخ -->
    <div id="mathWrap" class="wiki-image-wrap" aria-label="پاسخ">
      <div id="mathBox"></div>
    </div>

    <!-- کادر ۲ (برای جست‌وجوی خوراکی): ارزش غذایی -->
    <div id="nutritionWrap" class="wiki-image-wrap" aria-label="ارزش غذایی">
      <div id="nutritionBox"></div>
    </div>

    <!-- کادر ۳: تصویر آب‌وهوا -->
    <div id="weatherImageWrap" class="wiki-image-wrap"
      aria-label="تصویر وضعیت آب‌وهوا">
      <div id="weatherImageBox" class="wiki-gallery"></div>
    </div>

    <!-- کادر ۴: جزئیات آب‌وهوا و کادر ۵ به بعد: نتایج -->
    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

<script>
  const API = "https://shiraali-search.onrender.com/search";

  const INITIAL_LIMIT = 5;
  const MAX_RESULTS = 11;
  const ENGINES = ["duckduckgo", "bing", "yandex"];

  const WEIGHTS = {
    duckduckgo: [5, 5, 4, 4, 4],
    bing: [5, 3, 3, 2, 1],
    yandex: [1, 1, 1, 1, 1]
  };

  const SITE_ALIASES = [
    { domain: "x.com", names: ["twitter", "توییتر", "تویتر", "x.com"] },
    { domain: "youtube.com", names: ["youtube", "یوتیوب", "youtube.com"] },
    { domain: "instagram.com", names: ["instagram", "اینستاگرام", "instagram.com"] },
    { domain: "t.me", names: ["telegram", "تلگرام", "t.me"] },
    { domain: "wikipedia.org", names: ["wikipedia", "ویکی‌پدیا", "ویکی پدیا", "wikipedia.org"] },
    { domain: "facebook.com", names: ["facebook", "فیسبوک", "فیس‌بوک"] },
    { domain: "reddit.com", names: ["reddit", "ردیت"] },
    { domain: "github.com", names: ["github", "گیت‌هاب", "گیت هاب"] },
    { domain: "linkedin.com", names: ["linkedin", "لینکدین"] },
    { domain: "tiktok.com", names: ["tiktok", "تیک‌تاک", "تیک تاک"] },
    { domain: "aparat.com", names: ["aparat", "آپارات"] }
  ];

  const themeButton = document.getElementById("theme");
  const searchForm = document.getElementById("searchForm");
  const queryInput = document.getElementById("query");
  const submitButton = document.getElementById("submitButton");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const showMoreButton = document.getElementById("showMore");

  const wikiImageWrap = document.getElementById("wikiImageWrap");
  const wikiImage = document.getElementById("wikiImage");
  const galleryPrev = document.getElementById("galleryPrev");
  const galleryNext = document.getElementById("galleryNext");
  const weatherImageWrap = document.getElementById("weatherImageWrap");
  const weatherImageBox = document.getElementById("weatherImageBox");
  const clockWrap = document.getElementById("clockWrap");
  const clockBox = document.getElementById("clockBox");
  const mathWrap = document.getElementById("mathWrap");
  const mathBox = document.getElementById("mathBox");
  const nutritionWrap = document.getElementById("nutritionWrap");
  const nutritionBox = document.getElementById("nutritionBox");

  let preparedResults = [];
  let visibleCount = 0;
  let currentWarnings = [];
  let weatherData = null;
  let searchSequence = 0;
  let galleryImages = [];
  let galleryIndex = 0;
  let galleryReady = false; // فلش‌ها فقط پس از مرحلهٔ ۵ مجازند
  let clockTimer = null;
  let embassyResults = [];

  /* ---------- نتایج سفارت‌خانه‌ها (کادر ۵ به بعد) ---------- */

  const EMBASSY_MAX_AGE_DAYS = 365;
  const EMBASSY_MAX_RESULTS = 12;
  /* اگر موتور جست‌وجو تاریخ انتشار نداد: false = نمایش داده نشود، true = بدون تاریخ نمایش داده شود */
  const EMBASSY_ALLOW_UNDATED = false;

  /* نام فارسی کشور (نرمال‌شده) → وب‌سایت سفارت آن کشور در ایران.
     آدرس‌ها را پیش از استفاده بررسی کن و کشورهای دیگر را خودت اضافه کن. */
  const EMBASSY_SITES = {
    "آمریکا": "ir.usembassy.gov",
    "ایالات متحده": "ir.usembassy.gov",
    "ایالات متحده آمریکا": "ir.usembassy.gov",
    "آلمان": "teheran.diplo.de",
    "فرانسه": "ir.ambafrance.org",
    "ژاپن": "ir.emb-japan.go.jp",
    "ترکیه": "tahran.be.mfa.gov.tr",
    "ایتالیا": "ambteheran.esteri.it",
    "روسیه": "iran.mid.ru",
    "چین": "ir.china-embassy.gov.cn",
    "هند": "eoitehran.gov.in",
    "استرالیا": "iran.embassy.gov.au",
    "اسپانیا": "exteriores.gob.es/Embajadas/Teheran",
    "اتریش": "bmeia.gv.at/oeb-teheran",
    "سوئیس": "eda.admin.ch/teheran"
  };

  const EMBASSY_KEYWORDS = ["ویزا", "روادید", "دانشجو", "دانشجوی", "دانشگاه", "کار", "بورس", "بورسیه"];

  const EMBASSY_KEYWORD_RE =
    /(?<![\u0600-\u06FF])(ویزا|روادید|دانشجو(?:ی|یان)?|دانشگاه|کار|بورس|بورسیه)(?![\u0600-\u06FF])/;

  /* نام انگلیسی کشور (حروف کوچک) → وب‌سایت وزارت خارجه (mfa) و ایمیگریشن (imm).
     آدرس‌ها از حافظه نوشته شده‌اند؛ پیش از استفاده بررسی کن و کشورهای دیگر را اضافه کن. */
  const GOV_SITES = {};
  [
    [["united states", "usa", "us", "united states of america"], { mfa: "state.gov", imm: "uscis.gov" }],
    [["canada"], { mfa: "international.gc.ca", imm: "canada.ca/en/immigration-refugees-citizenship" }],
    [["australia"], { mfa: "dfat.gov.au", imm: "immi.homeaffairs.gov.au" }],
    [["new zealand"], { mfa: "mfat.govt.nz", imm: "immigration.govt.nz" }],
    [["germany"], { mfa: "auswaertiges-amt.de/en", imm: "bamf.de/EN" }],
    [["france"], { mfa: "diplomatie.gouv.fr/en", imm: "france-visas.gouv.fr" }],
    [["japan"], { mfa: "mofa.go.jp", imm: "isa.go.jp/en" }],
    [["turkey", "türkiye", "turkiye"], { mfa: "mfa.gov.tr", imm: "goc.gov.tr" }],
    [["netherlands"], { mfa: "netherlandsandyou.nl", imm: "ind.nl/en" }],
    [["sweden"], { mfa: "government.se", imm: "migrationsverket.se/en" }],
    [["india"], { mfa: "mea.gov.in", imm: "boi.gov.in" }],
    [["china"], { mfa: "fmprc.gov.cn/eng", imm: "en.nia.gov.cn" }]
  ].forEach(([names, cfg]) => names.forEach(name => { GOV_SITES[name] = cfg; }));

  const GOV_KEYWORDS = ["iran", "iranian"];
  const GOV_KEYWORD_RE = /\b(iran|iranian|iranians)\b/i;

  const KNOWN_PLACES = {

  function partsInZone(date, tz, calendar) {
    const fmt = new Intl.DateTimeFormat(
      "en-u-nu-latn" + (calendar ? "-ca-" + calendar : ""),
      { timeZone: tz, year: "numeric", month: "numeric", day: "numeric", weekday: "short" }
    );
    const o = {};
    fmt.formatToParts(date).forEach(p => { o[p.type] = p.value; });
    return { y: +o.year, m: +o.month, d: +o.day, weekday: o.weekday };
  }

  async function getTodayInfo(place, tz) {
    const now = new Date();
    const cc = (place.countryCode || "").toUpperCase();
    const greg = partsInZone(now, tz);
    const dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(greg.weekday);
    const events = [];
    let holiday = (WEEKENDS[cc] || [0, 6]).includes(dow);

    const add = (name, isHoliday) => {
      if (name && !events.includes(name)) events.push(name);
      if (isHoliday) holiday = true;
    };

    if (cc === "IR") {
      const s = partsInZone(now, tz, "persian");
      IR_SOLAR.forEach(([m, d, n, h]) => { if (m === s.m && d === s.d) add(n, h); });

      const h = partsInZone(now, tz, "islamic-civil");
      IR_HIJRI.forEach(([m, d, n, hol]) => { if (m === h.m && d === h.d) add(n, hol); });
    } else if (cc) {
      try {
        const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${greg.y}/${cc}`);

        if (res.ok) {
          const iso = `${greg.y}-${String(greg.m).padStart(2, "0")}-${String(greg.d).padStart(2, "0")}`;
          const list = await res.json();

          list.forEach(item => {
            if (item.date === iso && !item.counties) add(item.name, true);
          });
        }
      } catch (error) {
        console.warn("Holiday lookup failed:", error);
      }
    }

    const local = LOCAL_EVENTS[normalizePlaceName(place.name)] || [];
    local.forEach(([m, d, n]) => { if (m === greg.m && d === greg.d) add(n, false); });

    return { events, holiday };
  }

  async function renderClock(place, weather) {
    let tz = place.timezone || weather?.timezone;

    /* اگر کشور بود، ساعت پایتخت */
    if (place.isCountry && CAPITAL_TZ[place.countryCode]) {
      tz = CAPITAL_TZ[place.countryCode];
    }

    if (!tz) return;

    const info = await getTodayInfo(place, tz);

    const panel = document.createElement("div");
    panel.className = "clock-panel";

    const timeEl = addText(panel, "div", "", "clock-time");
    info.events.forEach(name => addText(panel, "div", name, "clock-event"));

    const fmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    });

    const tick = () => { timeEl.textContent = fmt.format(new Date()); };

    tick();
    clearInterval(clockTimer);
    clockTimer = setInterval(tick, 1000);

    clockBox.replaceChildren(panel);
    clockWrap.classList.toggle("holiday", info.holiday);
    clockWrap.classList.add("visible");
  }

  function resetGallery() {

  function showGalleryImage() {

      resetGallery();

    const item = galleryImages[galleryIndex];

    wikiImage.onerror = () => {
      item.failed = true;

    const showArrows = galleryReady && galleryImages.length > 1;
    galleryPrev.hidden = !showArrows;
    galleryNext.hidden = !showArrows;
  }

  function renderGallery(images) {
    /* ویکی‌پدیا + ۱۰ تصویر */
    galleryImages = images.slice(0, 11);
    galleryIndex = 0;

    if (!galleryImages.length) {
      resetGallery();
      return;
    }

    showGalleryImage();

      (galleryIndex - 1 + galleryImages.length) % galleryImages.length;

    showGalleryImage();

    if (galleryImages.length < 2) return;

  async function loadWikipediaImage(query, sequence) {
    for (const lang of ["fa", "en"]) {
      if (sequence !== searchSequence) return null;

      try {
        const api = new URL(`https://${lang}.wikipedia.org/w/api.php`);
        api.searchParams.set("action", "query");
        api.searchParams.set("generator", "search");
        api.searchParams.set("gsrsearch", query);
        api.searchParams.set("gsrnamespace", "0");
        api.searchParams.set("gsrlimit", "10");
        api.searchParams.set("prop", "pageimages");
        api.searchParams.set("piprop", "thumbnail");
        api.searchParams.set("pithumbsize", "900");
        api.searchParams.set("format", "json");
        api.searchParams.set("origin", "*");

        const response = await fetch(api.toString());
        if (!response.ok) continue;

        const data = await response.json();
        if (sequence !== searchSequence) return null;

        const pages = Object.values(data.query?.pages || {});
        const page = pages.find(item => item.thumbnail?.source);

        if (page?.thumbnail?.source) {
          return {
            src: page.thumbnail.source,
            source: "ویکی‌پدیا",
            score: 100000,
            rank: 0
          };
        }
      } catch (error) {
        console.warn(`Wikipedia image lookup (${lang}) failed:`, error);
      }
    }

    return null;
  }

  function extractImageUrl(result) {
    const candidates = [
      result.img_src,
      result.image,
      result.image_url,
      result.thumbnail,
      result.thumbnail_src,
      result.thumbnail_url
    ];

    for (const candidate of candidates) {
      if (typeof candidate !== "string") continue;

      try {
        const url = new URL(candidate);
        if (["http:", "https:"].includes(url.protocol)) return url.href;
      } catch {}
    }

    return null;
  }

  /*
   * مرحلهٔ ۵: تصاویر
   * این تابع فقط پس از پایان مرحلهٔ نتایج متنی اجرا می‌شود.
   * تصاویر سه موتور در همین مرحله می‌توانند هم‌زمان دریافت شوند.
   */
  async function collectImageResults(query, sequence, wikiImageResult) {
    const imageGroups = await Promise.all(
      ENGINES.map(async engine => {
        try {
          const data = await searchEngine(query, engine, "images");

          if (sequence !== searchSequence) return [];

          const list = Array.isArray(data.results) ? data.results : [];

          return list.map((result, index) => {
            const src = extractImageUrl(result);
            if (!src) return null;

            const weight = WEIGHTS[engine] || [];

            return {
              src,
              source: engine,
              score: (weight[index] || 0) + (index < 5 ? 2 : 0),
              rank: index + 1
            };
          }).filter(Boolean);
        } catch (error) {
          console.warn(`Image search failed (${engine}):`, error);
          return [];
        }
      })
    );

    if (sequence !== searchSequence) return;

    const uniqueImages = new Map();

    for (const image of imageGroups.flat()) {
      let key = image.src;

      try {
        const parsed = new URL(image.src);
        parsed.hash = "";
        key = parsed.href;
      } catch {}

      const existing = uniqueImages.get(key);

      if (!existing) {
        uniqueImages.set(key, { ...image });
      } else {
        existing.score += image.score;

        if (!existing.source.split(", ").includes(image.source)) {
          existing.source += `, ${image.source}`;
        }
      }
    }

    const rankedImages = [...uniqueImages.values()].sort((a, b) =>
      b.score - a.score || a.rank - b.rank
    );

    const finalImages = [];

    /* اگر ویکی‌پدیا تصویر داشت، آن تصویر همیشه اول است . */
    if (wikiImageResult?.src) {
      finalImages.push(wikiImageResult);
    }

    /* حداکثر ۱۱ تصویر با ویکی‌پدیا، یا ۱۰ تصویر بدون آن. */
    const maxGalleryImages = wikiImageResult?.src ? 11 : 10;

    for (const image of rankedImages) {
      if (finalImages.length >= maxGalleryImages) break;

      const duplicate = finalImages.some(item => {
        try {
          const first = new URL(item.src);
          const second = new URL(image.src);

          first.hash = "";
          second.hash = "";

          return first.href === second.href;
        } catch {
          return item.src === image.src;
        }
      });

      if (!duplicate) finalImages.push(image);
    }

    galleryReady = true;
    renderGallery(finalImages);
  }

  function addText(parent, tag, text, className) {
    const el = document.createElement(tag);
    el.textContent = text == null ? "" : String(text);

    if (className) el.className = className;

    parent.appendChild(el);
    return el;
  }

  function normalizedUrl(raw) {
    try {
      const u = new URL(raw);

      if (!["http:", "https:"].includes(u.protocol)) return null;

      u.hash = "";
      u.hostname = u.hostname.toLowerCase().replace(/^www\./, "");

      if (u.pathname.length > 1) {
        u.pathname = u.pathname.replace(/\/+$/, "");
      }

      [...u.searchParams.keys()].forEach(k => {
        if (/^utm_/i.test(k) ||
            ["gclid", "fbclid"].includes(k.toLowerCase())) {
          u.searchParams.delete(k);
        }
      });

      u.searchParams.sort();
      return u.href;
    } catch {
      return null;
    }
  }

  function hostOf(raw) {
    try {
      return new URL(raw).hostname.toLowerCase().replace(/^www\./, "");
    } catch {
      return "";
    }
  }

  function createSiteIcon(url) {
    const host = hostOf(url);
    if (!host) return null;

    const icon = document.createElement("img");
    icon.className = "result-site-icon";

    icon.setAttribute("aria-hidden", "true");
    icon.loading = "lazy";
    icon.referrerPolicy = "no-referrer";
    icon.src = "https://www.google.com/s2/favicons?domain=" +
      encodeURIComponent(host) + "&sz=64";

    icon.onerror = function () {
      if (this.dataset.fallbackTried !== "yes") {
        this.dataset.fallbackTried = "yes";
        this.src = "https://icons.duckduckgo.com/ip3/" +
          encodeURIComponent(host) + ".ico";
      } else {
        this.style.display = "none";
      }
    };

    return icon;
  }

  function detectTarget(input) {
    let remaining = input.trim();
    let directUrl = null;
    let domain = null;

    const urlMatch = remaining.match(
      /(?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?/i
    );

    if (urlMatch) {
      const candidate = urlMatch[0].replace(/[),؛،.!?]+$/, "");
      const normalizedCandidate = /^https?:\/\//i.test(candidate)
        ? candidate : "https://" + candidate;

      try {
        const parsed = new URL(normalizedCandidate);

        if (parsed.hostname.includes(".")) {
          directUrl = parsed.href;
          domain = parsed.hostname.toLowerCase().replace(/^www\./, "");
          remaining = remaining.replace(urlMatch[0], " ").trim();
        }
      } catch {}
    }

    if (!domain) {
      for (const site of SITE_ALIASES) {
        const aliases = [...site.names].sort((a, b) => b.length - a.length);

        for (const alias of aliases) {
          const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const pattern = new RegExp(
            `(^|\\s)${escaped}(?=$|\\s|[.,،؛])`, "i"
          );

          if (pattern.test(remaining)) {
            domain = site.domain;
            remaining = remaining.replace(pattern, " ").trim();
            break;
          }
        }

        if (domain) break;
      }
    }

    remaining = remaining.replace(/\s+/g, " ")
      .replace(/^[\s،,؛:]+|[\s،,؛:]+$/g, "").trim();

    if (!remaining && directUrl) {
      try {
        const path = new URL(directUrl).pathname.split("/").filter(Boolean).pop();

        if (path) {
          remaining = decodeURIComponent(path).replace(/[-_]/g, " ");
        }
      } catch {}
    }

    return { domain, query: remaining || input.trim(), directUrl };
  }

  /*
   * شناسایی مکان:
   * عبارت‌های آب‌وهوا و نام دقیق مکان پشتیبانی می‌شوند.
   * عبارت‌های عادی مانند «تاریخ ایران» نباید کارت هواشناسی بسازند.
   */
  function getWeatherPlaceQuery(query) {
    let value = normalizePlaceName(query);

    const prefixes = [
      /^وضعیت\s+آب\s+و\s+هوای\s+/,
      /^وضعیت\s+هوای\s+/,
      /^پیش\s+بینی\s+آب\s+و\s+هوای\s+/,
      /^پیش\s+بینی\s+هوای\s+/,
      /^آب\s+و\s+هوای\s+/,
      /^آب\s+و\s+هوا\s+/,
      /^هواشناسی\s+/,
      /^هوای\s+/,
      /^weather\s+forecast\s+for\s+/i,
      /^weather\s+in\s+/i,
      /^weather\s+for\s+/i,
      /^forecast\s+for\s+/i,
      /^forecast\s+in\s+/i,
      /^weather\s+/i
    ];

    for (const prefix of prefixes) {
      if (prefix.test(value)) {
        value = value.replace(prefix, "").trim();
        break;
      }
    }

    value = value
      .replace(/\s+(آب\s+و\s+هوا|هواشناسی|weather|forecast)$/i, "")
      .replace(/\s+(امروز|فردا|اکنون|الان|today|tomorrow|now)$/i, "")
      .trim();

    return value;
  }

  async function findWeatherPlace(query) {
    const placeQuery = getWeatherPlaceQuery(query);
    if (!placeQuery) return null;

    /* مکان‌های شناخته‌شده فقط با تطبیق کامل پذیرفته می‌شوند. */
    if (KNOWN_PLACES[placeQuery]) return KNOWN_PLACES[placeQuery];

    if (
      placeQuery.length > 45 ||
      placeQuery.split(" ").length > 4 ||
      /https?:|www\.|site:|twitter|youtube|instagram|telegram|تلگرام|توییتر|اینستاگرام/i.test(placeQuery)
    ) {
      return null;
    }

    for (const language of ["fa", "en"]) {
      try {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.searchParams.set("name", placeQuery);
        url.searchParams.set("count", "10");
        url.searchParams.set("language", language);
        url.searchParams.set("format", "json");

        const response = await fetch(url.toString());
        if (!response.ok) continue;

        const data = await response.json();
        const places = data.results || [];
        const queryNorm = normalizePlaceName(placeQuery);

        /* نام مکان باید دقیقاً با عبارت جست‌وجوشده برابر باشد. */
        const place = places.find(item =>
          normalizePlaceName(item.name || "") === queryNorm
        );

        if (!place) continue;

        if (!Number.isFinite(place.latitude) ||
            !Number.isFinite(place.longitude)) {
          continue;
        }

        return {
          name: place.name,
          latitude: place.latitude,
          longitude: place.longitude,
          country: place.country || "",
          countryCode: place.country_code || "",
          timezone: place.timezone || "",
          isCountry: place.feature_code === "PCLI"
        };
      } catch (error) {
        console.warn("Weather location lookup failed:", error);
      }
    }

    /* راه دوم: نام انگلیسی مکان را از ویکی‌پدیای فارسی بگیر و با آن جست‌وجو کن
       (برای املاهای متفاوت فارسی مثل «لوس آنجلس» و «لس‌آنجلس») */
    const englishName = await getEnglishNameFromWikipedia(placeQuery);

    if (englishName) {
      try {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.searchParams.set("name", englishName);
        url.searchParams.set("count", "10");
        url.searchParams.set("language", "en");
        url.searchParams.set("format", "json");

        const response = await fetch(url.toString());

        if (response.ok) {
          const data = await response.json();
          const wanted = normalizePlaceName(englishName);

          const place = (data.results || []).find(item =>
            normalizePlaceName(item.name || "") === wanted &&
            Number.isFinite(item.latitude) && Number.isFinite(item.longitude)
          );

          if (place) {
            return {
              name: placeQuery,
              latitude: place.latitude,
              longitude: place.longitude,
              country: place.country || "",
              countryCode: place.country_code || "",
              timezone: place.timezone || "",
              isCountry: place.feature_code === "PCLI"
            };
          }
        }
      } catch (error) {
        console.warn("English place lookup failed:", error);
      }
    }

    return null;
  }

  function nutrientValue(food, numbers) {
    const list = food.foodNutrients || [];

    for (const number of numbers) {
      const item = list.find(n => String(n.nutrientNumber) === String(number));
      const value = Number(item?.value);

      if (item && Number.isFinite(value)) return value;
    }

    return null;
  }

  async function loadNutrition(originalQuery, sequence) {
    const q = normalizePlaceName(originalQuery);

    if (!q || q.length > 30 || q.split(" ").length > 3 || /[\d:/@]/.test(q)) return null;

    let english = /[\u0600-\u06FF]/.test(q) ? await getEnglishNameFromWikipedia(q) : q;
    if (sequence !== searchSequence || !english) return null;

    english = english.replace(/\s*\(.*\)\s*$/, "").trim().toLowerCase();
    if (!english) return null;

    const url = new URL("https://api.nal.usda.gov/fdc/v1/foods/search");
    url.searchParams.set("api_key", USDA_API_KEY);
    url.searchParams.set("query", english);
    url.searchParams.set("dataType", "Foundation,SR Legacy,Survey (FNDDS)");
    url.searchParams.set("pageSize", "15");

    const response = await fetch(url.toString());
    if (!response.ok) return null;

    const data = await response.json();
    if (sequence !== searchSequence) return null;

    const base = english.replace(/(ies|es|s)$/, "");
    const escaped = base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("\\b" + escaped + "[a-z]{0,3}\\b", "i");
    const rank = { "Foundation": 0, "SR Legacy": 1, "Survey (FNDDS)": 2 };

    const food = (data.foods || [])
      .filter(item => re.test(item.description || "") && item.foodNutrients?.length)
      .sort((a, b) => (rank[a.dataType] ?? 3) - (rank[b.dataType] ?? 3))[0];

    return food ? { food, english } : null;
  }

  /* ارزیابی امن (بدون eval). اگر عبارت ریاضی نباشد، null برمی‌گرداند. */
  function evaluateMath(input) {
    let s = String(input || "").trim();
    if (!s) return null;

    const persianOut = /[۰-۹٠-٩]/.test(s);

    s = s
      .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
      .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
      .replace(/٫/g, ".")
      .replace(/[×✕]/g, "*")
      .replace(/÷/g, "/")
      .replace(/[−–—]/g, "-")
      .replace(/\*\*/g, "^")
      .replace(/=\s*\??\s*$/, "")
      .trim();

    s = s.replace(/(?<=[\d)])\s*[xX]\s*(?=[\d(])/g, "*");

    if (!/^[\d+\-*/().^\s]+$/.test(s)) return null;
    if (!/\d/.test(s) || !/[+\-*/^]/.test(s.replace(/^\s*[+-]/, ""))) return null;

    /* تاریخ، بازهٔ سال و شمارهٔ تلفن (مثل 2024-2025 یا 021-12345) محاسبه نمی‌شوند */
    if (/^\d{3,}(-\d+)+$/.test(s) || /^\d+(-\d{4,})+$/.test(s)) return null;

    const tokens = s.match(/\d+\.?\d*|\.\d+|[+\-*/^()]/g) || [];
    if (tokens.join("") !== s.replace(/\s+/g, "")) return null;

    let pos = 0;
    const peek = () => tokens[pos];
    const fail = () => { throw new Error("bad expression"); };

    function expr() {
      let value = term();
      while (peek() === "+" || peek() === "-") {
        const op = tokens[pos++];
        const right = term();
        value = op === "+" ? value + right : value - right;
      }
      return value;
    }

    function term() {
      let value = unary();
      while (peek() === "*" || peek() === "/") {
        const op = tokens[pos++];
        const right = unary();
        value = op === "*" ? value * right : value / right;
      }
      return value;
    }

    function unary() {
      if (peek() === "-") { pos++; return -unary(); }
      if (peek() === "+") { pos++; return unary(); }
      return power();
    }

    function power() {
      const base = primary();
      if (peek() === "^") { pos++; return Math.pow(base, unary()); }
      return base;
    }

    function primary() {
      const token = tokens[pos++];
      if (token === undefined) fail();
      if (token === "(") {
        const value = expr();
        if (tokens[pos++] !== ")") fail();
        return value;
      }
      const number = Number(token);
      if (!Number.isFinite(number)) fail();
      return number;
    }

    try {
      const result = expr();
      if (pos !== tokens.length || !Number.isFinite(result)) return null;

      let text = String(parseFloat(result.toPrecision(12)));
      if (persianOut) text = text.replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]).replace(/\./g, "٫");

      return text;
    } catch {
      return null;
    }
  }

  async function getEnglishNameFromWikipedia(title) {
    try {
      const api = new URL("https://fa.wikipedia.org/w/api.php");
      api.searchParams.set("action", "query");
      api.searchParams.set("titles", title);
      api.searchParams.set("redirects", "1");
      api.searchParams.set("prop", "langlinks");
      api.searchParams.set("lllang", "en");
      api.searchParams.set("format", "json");
      api.searchParams.set("origin", "*");

      const response = await fetch(api.toString());
      if (!response.ok) return null;

      const data = await response.json();
      const pages = Object.values(data.query?.pages || {});
      const link = pages.find(page => page.langlinks?.length)?.langlinks[0];

      return link?.["*"] || null;
    } catch (error) {
      console.warn("Wikipedia name lookup failed:", error);
      return null;
    }
  }

  async function fetchWeather(place) {
    const url = new URL("https://api.open-meteo.com/v1/forecast");

    url.searchParams.set("latitude", place.latitude);
    url.searchParams.set("longitude", place.longitude);

    url.searchParams.set("current", [
      "temperature_2m", "relative_humidity_2m", "apparent_temperature",
      "is_day", "precipitation",
      "weather_code", "cloud_cover", "wind_speed_10m", "wind_direction_10m"
    ].join(","));

    url.searchParams.set("daily", [
      "temperature_2m_max", "temperature_2m_min",
      "precipitation_probability_max", "sunrise", "sunset"
    ].join(","));

    url.searchParams.set("forecast_days", "1");
    url.searchParams.set("timezone", "auto");

    const response = await fetch(url.toString());

    if (!response.ok) {
      throw new Error("سرویس هواشناسی پاسخ نداد.");
    }

    const data = await response.json();

    if (!data.current) {
      throw new Error("اطلاعات فعلی هوا در دسترس نیست.");
    }

    return { ...data, place };
  }

    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: "بارانی", icon: "🌧️" };

  async function searchEngine(query, engine, category = null) {
    const u = new URL(API);

    u.searchParams.set("q", query);
    u.searchParams.set("engines", engine);
    u.searchParams.set("format", "json");

    if (category) {
      u.searchParams.set("categories", category);
    }

    const res = await fetch(u.toString(), {
      headers: { Accept: "application/json" }
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    return res.json();
  }

  /* اجرای موازی سه موتور متنی و افزودن نتایج/هشدارها */
  async function collectTextGroups(query, priority, label, groups) {
    const settled = await Promise.all(
      ENGINES.map(async engine => {
        try {
          return { engine, data: await searchEngine(query, engine) };
        } catch (error) {
          return { engine, error };
        }
      })
    );

    for (const { engine, data, error } of settled) {
      const name = engine + label;

      if (!data) {
        currentWarnings.push({ engine: name, reason: error?.message || "پاسخ دریافت نشد" });
        continue;
      }

      groups.push({ engine, data, priority });

      for (const warning of data.unresponsive_engines || []) {
        currentWarnings.push({
          engine: name,
          reason: Array.isArray(warning) ? warning.join(": ") : String(warning)
        });
      }
    }
  }

  /*
   * جست‌وجوی عمومی در چند وب‌سایت مشخص:
   * فقط صفحه‌های همان وب‌سایت، دارای کلیدواژه، حداکثر ۳۶۵ روز از انتشار، جدیدترین اول.
   */
  async function collectSiteResults(sites, keywords, keywordRe, requirePersian, sequence) {
    const parsedSites = sites.map(item => {
      const [host, ...pathParts] = item.domain.toLowerCase().split("/");
      return {
        domain: item.domain,
        label: item.label,
        host,
        basePath: pathParts.length ? "/" + pathParts.join("/") : ""
      };
    });

    const jobs = [];

    for (const site of parsedSites) {
      const query = `site:${site.domain} (${keywords.join(" OR ")})`;

      for (const engine of ENGINES) {
        for (const category of [null, "news"]) {
          jobs.push(
            searchEngine(query, engine, category)
              .then(data => (Array.isArray(data.results) ? data.results : [])
                .map(r => ({ r, site })))
              .catch(() => [])
          );
        }
      }
    }

    const lists = await Promise.all(jobs);
    if (sequence !== searchSequence) return [];

    const now = Date.now();
    const maxAge = EMBASSY_MAX_AGE_DAYS * 86400000;
    const merged = new Map();

    for (const { r, site } of lists.flat()) {
      const url = normalizedUrl(r.url);
      if (!url) continue;

      /* فقط صفحه‌های خود همان وب‌سایت */
      const parsed = new URL(url);
      const urlHost = parsed.hostname;
      if (urlHost !== site.host && !urlHost.endsWith("." + site.host)) continue;
      if (site.basePath && !parsed.pathname.toLowerCase().startsWith(site.basePath)) continue;

      /* کلیدواژه (و در صورت نیاز فارسی بودن مطلب) */
      const text = `${r.title || ""} ${r.content || ""}`
        .replace(/ي/g, "ی").replace(/ك/g, "ک");
      if (requirePersian && !/[\u0600-\u06FF]/.test(text)) continue;
      if (!keywordRe.test(text)) continue;

      /* شرط ۳۶۵ روز */
      let time = Date.parse(r.publishedDate || r.published_date || "");
      if (Number.isNaN(time)) {
        if (!EMBASSY_ALLOW_UNDATED) continue;
        time = null;
      } else if (now - time > maxAge) {
        continue;
      }

      const existing = merged.get(url);

      if (!existing || (existing.time == null && time != null)) {
        merged.set(url, {
          url,
          title: typeof r.title === "string" ? r.title.trim() : "",
          content: r.content || "",
          time,
          embassy: true,
          sourceLabel: site.label
        });
      }
    }

    /* جدیدترین اول؛ مطالب بدون تاریخ آخر */
    return [...merged.values()]
      .sort((a, b) => (b.time ?? -Infinity) - (a.time ?? -Infinity))
      .slice(0, EMBASSY_MAX_RESULTS);
  }

  /* نام فارسی کشور → سفارت */
  async function collectEmbassyResults(originalQuery, sequence) {
    const site = EMBASSY_SITES[normalizePlaceName(originalQuery)];
    if (!site) return [];

    return collectSiteResults(
      [{ domain: site, label: "سفارت" }],
      EMBASSY_KEYWORDS, EMBASSY_KEYWORD_RE, true, sequence
    );
  }

  /* نام انگلیسی کشور → وزارت خارجه و ایمیگریشن (مطالب دارای iran / iranian) */
  async function collectGovResults(originalQuery, sequence) {
    const cfg = GOV_SITES[normalizePlaceName(originalQuery)];
    if (!cfg) return [];

    const sites = [{ domain: cfg.mfa, label: "وزارت خارجه" }];
    if (cfg.imm) sites.push({ domain: cfg.imm, label: "ایمیگریشن" });

    return collectSiteResults(sites, GOV_KEYWORDS, GOV_KEYWORD_RE, false, sequence);
  }

  function mergeAndRank(groups, directUrl) {
    const merged = new Map();
    let stable = 0;

    for (const group of groups) {
      if (!group.data) continue;

      const list = Array.isArray(group.data.results)
        ? group.data.results
        : [];

      list.forEach((r, index) => {
        const url = normalizedUrl(r.url);
        if (!url) return;

        let item = merged.get(url);

        if (!item) {
          item = {
            ...r,
            url,
            title: typeof r.title === "string" ? r.title.trim() : "",
            content: r.content || "",
            score: 0,
            engines: [],
            ranks: {},
            priority: group.priority,
            _stable: stable++
          };

          merged.set(url, item);
        } else {
          item.priority = Math.max(item.priority, group.priority);
        }

        if (!item.engines.includes(group.engine)) {
          item.engines.push(group.engine);
          item.ranks[group.engine] = index + 1;

          const rank = index + 1;
          if (rank <= 5) {
            item.score += WEIGHTS[group.engine][rank - 1];
          }
        }

        if (!item.title && r.title) {
          item.title = String(r.title).trim();
        }

        if (!item.content && r.content) {
          item.content = r.content;
        }
      });
    }

    if (directUrl) {
      const url = normalizedUrl(directUrl);

      if (url && !merged.has(url)) {
        merged.set(url, {
          url,
          title: "",
          content: "",
          score: 0,
          engines: ["آدرس مستقیم"],
          ranks: {},
          priority: 3,
          _stable: -1
        });
      } else if (url && merged.has(url)) {
        merged.get(url).priority = 3;
      }
    }

    return [...merged.values()]
      .sort((a, b) =>
        b.priority - a.priority ||
        b.score - a.score ||
        (a.ranks.duckduckgo || Infinity) - (b.ranks.duckduckgo || Infinity) ||
        (a.ranks.bing || Infinity) - (b.ranks.bing || Infinity) ||
        (a.ranks.yandex || Infinity) - (b.ranks.yandex || Infinity) ||
        a._stable - b._stable
      )
      .slice(0, MAX_RESULTS);
  }

  function renderOneResult(r) {
    const card = document.createElement("article");
    card.className = "result";

    const siteIcon = createSiteIcon(r.url);
    if (siteIcon) card.appendChild(siteIcon);

    const heading = document.createElement("h2");
    const link = document.createElement("a");

    link.href = r.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.textContent =
      (typeof r.title === "string" ? r.title.trim() : "") || r.url;

    heading.appendChild(link);
    card.appendChild(heading);

    if (r.content) {
      addText(card, "p", r.content);
    }

    addText(
      card,
      "span",
      r.embassy
        ? `${r.sourceLabel || "سفارت"} | ${r.time != null
            ? "تاریخ انتشار: " + new Date(r.time).toLocaleDateString("fa-IR")
            : "تاریخ نامشخص"}`
        : `امتیاز: ${r.score} | منابع: ${r.engines.join(", ")}`,
      "result-engine"
    );

    resultsBox.appendChild(card);
  }

  function renderVisible() {
    resultsBox.replaceChildren();

    /*
     * گالری و کادر ساعت و کادر تصویر آب‌وهوا در HTML بالاتر از این بخش‌اند.
     * کارت جزئیات هواشناسی (کادر ۴) در ابتدای نتایج و پیش از نتایج متنی نمایش داده می‌شود.
     */
    if (weatherData) {
      renderWeatherCards(weatherData);
    }

    embassyResults.forEach(renderOneResult);

    preparedResults.slice(0, visibleCount).forEach(renderOneResult);

    if (currentWarnings.length) {
      const messages = currentWarnings.map(
        item => `${item.engine}: ${item.reason}`
      );

      addText(
        resultsBox,
        "div",
        "برخی جست‌وجوها پاسخ نداده‌اند: " + messages.join("؛ "),
        "warning"
      );
    }

    showMoreButton.hidden =
      visibleCount >= preparedResults.length ||
      visibleCount >= MAX_RESULTS;
  }

  showMoreButton.addEventListener("click", () => {
    visibleCount = Math.min(
      visibleCount + 6,
      MAX_RESULTS,
      preparedResults.length
    );

    renderVisible();
    statusBox.textContent = "";
  });

  /*
   * اجرای ترتیبی کل جست‌وجو:
   *
   * ۱. تصویر ویکی‌پدیا (کادر ۱)
   * ۲. شناسایی مکان؛ نمایش ساعت و مناسبت (کادر ۲)
   * ۳. دریافت هواشناسی؛ نمایش تصویر آب‌وهوا (کادر ۳)
   * ۴. نمایش کارت جزئیات هواشناسی (کادر ۴)
   * ۵. دریافت و نمایش نتایج متنی (کادر ۵ به بعد)
   * ۶. دریافت تصاویر سه موتور و تکمیل گالری
   * ۷. نمایش فلش‌های گالری
   */
  searchForm.addEventListener("submit", async event => {
    event.preventDefault();

    const originalQuery = queryInput.value.trim();
    if (!originalQuery) return;

    const thisSearch = ++searchSequence;
    const target = detectTarget(originalQuery);
    const searchQuery = target.query;
    const domain = target.domain;

    submitButton.disabled = true;
    showMoreButton.hidden = true;
    resultsBox.replaceChildren();

    preparedResults = [];
    embassyResults = [];
    visibleCount = 0;
    currentWarnings = [];
    weatherData = null;

    resetGallery();
    resetWeatherImage();
    resetClock();
    resetNutrition();
    resetMath();

    /* مسئلهٔ ریاضی: فقط یک کادر با پاسخ نمایش داده می‌شود و جست‌وجوی دیگری انجام نمی‌شود */
    const mathAnswer = evaluateMath(originalQuery);

    if (mathAnswer !== null) {
      statusBox.textContent = "";
      renderMath(mathAnswer);
      submitButton.disabled = false;
      return;
    }

    try {
      /* مرحلهٔ ۱: فقط ویکی‌پدیا */

      const wikiImageResult = await loadWikipediaImage(
        searchQuery,
        thisSearch
      );

      if (thisSearch !== searchSequence) return;

      if (wikiImageResult?.src) {
        renderGallery([wikiImageResult]);
      }

      /* مرحلهٔ ۲ و ۳: شناسایی مکان، ساعت و مناسبت، سپس هواشناسی (فقط برای جست‌وجوهای مکانی) */

      let weatherPlace = null;

      if (!domain && !target.directUrl) {

        try {
          weatherPlace = await findWeatherPlace(originalQuery);
        } catch (error) {
          console.warn("Place lookup failed:", error);
        }

        if (thisSearch !== searchSequence) return;

        if (weatherPlace) {
          /* کادر ۲: ساعت و مناسبت (مستقل از هواشناسی) */
          try {
            await renderClock(weatherPlace, null);
          } catch (error) {
            console.warn("Clock render failed:", error);
            resetClock();
          }

          if (thisSearch !== searchSequence) return;

          /* کادر ۳ و ۴: هواشناسی */
          try {
            const data = await fetchWeather(weatherPlace);

            if (thisSearch !== searchSequence) return;

            weatherData = data;
            renderWeatherImage(data);
          } catch (error) {
            console.warn("Weather request failed:", error);
            weatherData = null;
          }
        }
      }

      if (thisSearch !== searchSequence) return;

      /* کادر ۲ برای خوراکی‌ها: ارزش غذایی (فقط اگر مکان یا سایت نبود) */
      if (!weatherPlace && !domain && !target.directUrl) {
        try {
          const nutrition = await loadNutrition(originalQuery, thisSearch);

          if (thisSearch !== searchSequence) return;

          if (nutrition) renderNutrition(nutrition, originalQuery);
        } catch (error) {
          console.warn("Nutrition lookup failed:", error);
          resetNutrition();
        }
      }

      if (thisSearch !== searchSequence) return;

      /* مرحلهٔ ۴: نمایش کارت جزئیات هواشناسی (در صورت وجود) */

      renderVisible();

      /* نتایج سفارت (نام فارسی کشور) یا وزارت خارجه و ایمیگریشن (نام انگلیسی کشور): کادر ۵ به بعد */
      if (!domain && !target.directUrl) {
        try {
          const [embassyList, govList] = await Promise.all([
            collectEmbassyResults(originalQuery, thisSearch),
            collectGovResults(originalQuery, thisSearch)
          ]);

          embassyResults = [...embassyList, ...govList];
        } catch (error) {
          console.warn("Embassy search failed:", error);
          embassyResults = [];
        }

        if (thisSearch !== searchSequence) return;

        if (embassyResults.length) renderVisible();
      }

      /* مرحلهٔ ۵: نتایج متنی؛ جست‌وجوی تصاویر هنوز آغاز نشده است. */
      const groups = [];

      if (domain) {

        await collectTextGroups(
          `site:${domain} ${searchQuery}`.trim(), 2, " (جست‌وجوی سایت)", groups
        );

        if (thisSearch !== searchSequence) return;
      }

      await collectTextGroups(searchQuery, 1, "", groups);

      if (thisSearch !== searchSequence) return;

      preparedResults = mergeAndRank(groups, target.directUrl);
      visibleCount = Math.min(INITIAL_LIMIT, preparedResults.length);

      /* نتایج متنی پیش از شروع جست‌وجوی تصاویر نمایش داده می‌شوند. */
      renderVisible();

      /* مرحلهٔ ۶: اکنون جست‌وجوی تصاویر DuckDuckGo، Bing و Yandex آغاز می‌شود. */

      try {
        await collectImageResults(
          searchQuery,
          thisSearch,
          wikiImageResult
        );
      } catch (error) {
        console.warn("Image collection failed:", error);
      }

      if (thisSearch !== searchSequence) return;

      /* مرحلهٔ ۷: نمایش فلش‌ها (حتی اگر دریافت تصاویر با خطا مواجه شده باشد) */
      galleryReady = true;
      if (galleryImages.length) showGalleryImage();

      if (preparedResults.length) {
        statusBox.textContent = "";
      } else if (weatherData) {
        statusBox.textContent =
          "اطلاعات هواشناسی نمایش داده شد؛ نتیجهٔ متنی دیگری پیدا نشد.";
      } else if (currentWarnings.length) {
        statusBox.textContent =
          "موتورهای جست‌وجو پاسخ ندادند. چند لحظه صبر کن و دوباره امتحان کن.";
      } else {
        statusBox.textContent =
          "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";
      }
    } catch (error) {
      console.error("Shiraali Search error:", error);

      if (thisSearch === searchSequence) {
        statusBox.textContent = weatherData
          ? "اطلاعات هواشناسی نمایش داده شد، اما جست‌وجو با خطا مواجه شد."
          : "دریافت نتایج ناموفق بود. چند لحظه صبر کن و دوباره امتحان کن.";

        renderVisible();
      }
    } finally {
      if (thisSearch === searchSequence) {
        submitButton.disabled = false;
      }
    }
  });
</script>

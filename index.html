
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>Shiraali Search</title>
  <meta name="description" content="جست‌وجوی یکپارچه Shiraali">

  <style>
    :root {
      --bg: #dff2ff;
      --text: #173650;
      --input: #ffffff;
      --border: #c5dbea;
      --button: #ffffff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255,255,255,.72);
    }

    body.dark {
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16,47,76,.8);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme {
      position: fixed;
      z-index: 5;
      top: 18px;
      left: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    main {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder { color: var(--muted); }

    .submit {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      margin-top: 18px;
      text-align: right;
    }

    .result {
      margin-bottom: 14px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover { text-decoration: underline; }

    .result-url {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .result p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin-top: 11px;
    }

    .result-engine {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .result-score {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--button);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .more {
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    .more[hidden] { display: none; }

    @media (max-width: 480px) {
      main { padding-top: 100px; }
      .logo { margin-bottom: 24px; }
      .result { padding: 14px; }
      .result h2 { font-size: 16px; }
    }
  </style>
</head>

<body>
  <button class="theme" id="theme" type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک">🌙</button>

  <main>
    <img class="logo"
      src="https://shiraali.ir/logo.png"
      alt="لوگوی Shiraali">

    <form id="searchForm">
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="query" type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off" required>
        <button class="submit" id="submitButton"
          type="submit" aria-label="جست‌وجو">➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite">
      عبارت موردنظرت را وارد کن و جست‌وجو را بزن.
    </div>

    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش ۴ نتیجهٔ بعدی
    </button>
  </main>

  <script>
    const API = "https://shiraali-search.onrender.com/search";
    const INITIAL_LIMIT = 5;
    const MAX_RESULTS = 9;

    /*
      امتیازهای رتبه‌های اصلی ۱ تا ۵:
      رتبه:       ۱  ۲  ۳  ۴  ۵
      DuckDuckGo: 5  5  4  4  4
      Bing:       5  3  3  2  1
      Yandex:     1  1  1  1  1
    */
    const WEIGHTS = {
      duckduckgo: [5, 5, 4, 4, 4],
      bing:       [5, 3, 3, 2, 1],
      yandex:     [1, 1, 1, 1, 1]
    };

    const ENGINE_ORDER = ["duckduckgo", "bing", "yandex"];

    const ENGINE_NAMES = {
      duckduckgo: "DuckDuckGo",
      bing: "Bing",
      yandex: "Yandex"
    };

    const $ = id => document.getElementById(id);

    let allResults = [];
    let visibleCount = 0;
    let warnings = [];

    $("theme").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const dark = document.body.classList.contains("dark");
      $("theme").textContent = dark ? "☀️" : "🌙";
      document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
    });

    function normalizeURL(raw) {
      try {
        const url = new URL(raw);

        if (!["http:", "https:"].includes(url.protocol)) {
          return null;
        }

        url.hash = "";
        url.hostname = url.hostname.toLowerCase()
          .replace(/^www\./, "");

        if (url.pathname.length > 1) {
          url.pathname = url.pathname.replace(/\/+$/, "");
        }

        for (const key of [...url.searchParams.keys()]) {
          const lower = key.toLowerCase();

          if (lower.startsWith("utm_") ||
              ["gclid", "fbclid"].includes(lower)) {
            url.searchParams.delete(key);
          }
        }

        url.searchParams.sort();
        return url.href;
      } catch {
        return null;
      }
    }

    function apiURL(query, engine) {
      const url = new URL(API);
      url.searchParams.set("q", query);
      url.searchParams.set("engines", engine);
      url.searchParams.set("format", "json");
      return url.toString();
    }

    async function searchEngine(query, engine) {
      const response = await fetch(apiURL(query, engine), {
        headers: { Accept: "application/json" }
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (!Array.isArray(data.results)) {
        throw new Error("پاسخ API فاقد فهرست نتایج است");
      }

      return data;
    }

    /*
      همهٔ نتایج سه موتور در یک مجموعه ادغام می‌شوند.
      هیچ نام سایت، از جمله Wikipedia یا IMDb، اولویت ویژه ندارد.
    */
    function rankAndMerge(engineData) {
      const merged = new Map();
      let stableIndex = 0;

      for (const engine of ENGINE_ORDER) {
        const data = engineData[engine];

        if (!data || !Array.isArray(data.results)) continue;

        const seen = new Set();

        data.results.forEach((result, index) => {
          if (!result.url) return;

          const url = normalizeURL(result.url);
          if (!url || seen.has(url)) return;

          seen.add(url);

          const rank = index + 1;
          const points = rank <= 5
            ? WEIGHTS[engine][rank - 1]
            : 0;

          let item = merged.get(url);

          if (!item) {
            item = {
              url,
              title: result.title || url,
              content: result.content || "",
              score: 0,
              ranks: {
                duckduckgo: Infinity,
                bing: Infinity,
                yandex: Infinity
              },
              engines: [],
              stableIndex: stableIndex++
            };

            merged.set(url, item);
          } else {
            if ((!item.title || item.title === item.url) &&
                result.title) {
              item.title = result.title;
            }

            if (!item.content && result.content) {
              item.content = result.content;
            }
          }

          // فقط یک مشارکت از هر موتور برای هر URL.
          item.ranks[engine] = Math.min(item.ranks[engine], rank);

          if (points > 0 && !item.engines.includes(engine)) {
            item.score += points;
            item.engines.push(engine);
          }
        });
      }

      return [...merged.values()]
        .sort((a, b) => {
          // قانون اول: مجموع امتیاز بیشتر.
          if (a.score !== b.score) {
            return b.score - a.score;
          }

          // قانون تساوی: رتبهٔ بهتر DDG، سپس Bing، سپس Yandex.
          for (const engine of ENGINE_ORDER) {
            if (a.ranks[engine] !== b.ranks[engine]) {
              return a.ranks[engine] - b.ranks[engine];
            }
          }

          // آخرین معیار: ترتیب پایدار ورود نتیجه‌ها.
          return a.stableIndex - b.stableIndex;
        })
        .slice(0, MAX_RESULTS);
    }

    function addText(parent, tag, value, className) {
      const element = document.createElement(tag);
      element.textContent = value || "";

      if (className) element.className = className;

      parent.appendChild(element);
      return element;
    }

    function renderResult(result) {
      const card = document.createElement("article");
      card.className = "result";

      const heading = document.createElement("h2");
      const link = document.createElement("a");

      link.href = result.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = result.title || result.url;

      heading.appendChild(link);
      card.appendChild(heading);

      addText(card, "div", result.url, "result-url");

      if (result.content) {
        addText(card, "p", result.content);
      }

      const meta = document.createElement("div");
      meta.className = "result-meta";

      const engineNames = result.engines.length
        ? result.engines.map(name => ENGINE_NAMES[name]).join("، ")
        : "بدون امتیاز";

      addText(
        meta, "span",
        "موتورهای مشارکت‌کننده: " + engineNames,
        "result-engine"
      );

      addText(
        meta, "span",
        "امتیاز: " + result.score,
        "result-score"
      );

      card.appendChild(meta);
      return card;
    }

    function render() {
      $("results").replaceChildren();

      allResults.slice(0, visibleCount).forEach(result => {
        $("results").appendChild(renderResult(result));
      });

      if (warnings.length) {
        const text = warnings.map(w =>
          ENGINE_NAMES[w.engine] + ": " + w.message
        ).join("؛ ");

        addText(
          $("results"), "div",
          "هشدار: " + text,
          "warning"
        );
      }

      $("showMore").hidden =
        visibleCount >= allResults.length ||
        visibleCount >= MAX_RESULTS;
    }

    $("showMore").addEventListener("click", () => {
      visibleCount = Math.min(
        visibleCount + 4,
        MAX_RESULTS,
        allResults.length
      );

      render();

      $("status").textContent =
        visibleCount + " از " + allResults.length +
        " نتیجه نمایش داده شده است.";
    });

    $("searchForm").addEventListener("submit", async event => {
      event.preventDefault();

      const query = $("query").value.trim();
      if (!query) return;

      $("submitButton").disabled = true;
      $("showMore").hidden = true;
      $("results").replaceChildren();

      $("status").textContent =
        "در حال جست‌وجوی جداگانه در DuckDuckGo، Bing و Yandex...";

      allResults = [];
      visibleCount = 0;
      warnings = [];

      /*
        درخواست‌های سه موتور مستقل‌اند؛
        شکست یک موتور مانع دریافت نتایج دو موتور دیگر نمی‌شود.
      */
      const entries = await Promise.all(
        ENGINE_ORDER.map(async engine => {
          try {
            return [engine, await searchEngine(query, engine)];
          } catch (error) {
            console.error(engine, error);

            warnings.push({
              engine,
              message: error.message || "دریافت نتیجه ناموفق بود"
            });

            return [engine, { results: [] }];
          }
        })
      );

      const engineData = Object.fromEntries(entries);

      allResults = rankAndMerge(engineData);
      visibleCount = Math.min(INITIAL_LIMIT, allResults.length);

      if (allResults.length) {
        $("status").textContent =
          allResults.length +
          " نتیجهٔ یکتا بر اساس مجموع امتیازها مرتب شده است.";
      } else {
        $("status").textContent =
          "نتیجه‌ای دریافت نشد. ممکن است API در دسترس نباشد.";
      }

      render();
      $("submitButton").disabled = false;
    });
  </script>
</body>
</html>

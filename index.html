<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Shiraali.ir">

    <title>Shiraali.ir</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">


    <style>

        /* =================================================
           RESET
        ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =================================================
           LIGHT MODE
        ================================================= */

        :root {

            /* آبی بسیار کم‌رنگ و یکدست */
            --background: #dff2ff;

            /* رنگ نوشته اصلی */
            --text: #062d5c;

            /* رنگ نوشته فرعی */
            --text-soft: #285d8c;

            /* رنگ نقطه وسط */
            --accent: #2188d1;

            /* کنترل‌های بالای صفحه */
            --control-bg:
                rgba(255, 255, 255, 0.48);

            --control-border:
                rgba(40, 130, 200, 0.28);

            /* سایه */
            --shadow:
                rgba(0, 60, 120, 0.10);
        }


        /* =================================================
           DARK MODE
        ================================================= */

        body.dark {

            /*
               سرمه‌ای / آبی خیلی تیره
               کاملاً یکدست
            */

            --background: #0b3157;

            --text: #ffffff;

            --text-soft: #d8e9f8;

            --accent: #76b9e8;

            --control-bg:
                rgba(255, 255, 255, 0.09);

            --control-border:
                rgba(255, 255, 255, 0.20);

            --shadow:
                rgba(0, 20, 45, 0.30);
        }


        /* =================================================
           BODY
        ================================================= */

        body {

            font-family:
                Tahoma,
                "Segoe UI",
                Arial,
                sans-serif;

            overflow: hidden;

            color: var(--text);

            /*
               مهم:
               هیچ گرادیان یا تغییر رنگی وجود ندارد.
               کل صفحه دقیقاً یک رنگ است.
            */

            background:
                var(--background);

            transition:
                background 0.5s ease,
                color 0.5s ease;
        }


        /* =================================================
           MAIN PAGE
        ================================================= */

        .page {

            position: relative;

            width: 100vw;
            height: 100vh;

            min-height: 600px;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 30px;

            overflow: hidden;
        }


        /* =================================================
           TOP BAR

           همیشه LTR است تا تغییر زبان
           جای کنترل‌ها را تغییر ندهد.
        ================================================= */

        .top-bar {

            position: absolute;

            top: 30px;

            left: 0;
            right: 0;

            width: 100%;

            padding-left: 42px;
            padding-right: 42px;

            display: flex;

            flex-direction: row;

            justify-content: space-between;
            align-items: center;

            direction: ltr;

            z-index: 10;
        }


        /* =================================================
           DAY / NIGHT SWITCH
        ================================================= */

        .theme-switch {

            direction: ltr;

            flex-shrink: 0;

            width: 92px;
            height: 46px;

            border-radius: 30px;

            border:
                1px solid var(--control-border);

            background:
                var(--control-bg);

            backdrop-filter: blur(12px);

            display: flex;

            align-items: center;

            padding: 4px;

            cursor: pointer;

            box-shadow:
                0 8px 30px var(--shadow);
        }


        .theme-slider {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.97);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 19px;

            transition:
                transform 0.4s ease;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.12);
        }


        /* حرکت دایره فقط داخل کنترل */

        body.dark
        .theme-slider {

            transform:
                translateX(46px);
        }


        /* =================================================
           CENTER CONTENT
        ================================================= */

        .content {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 1000px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            transform:
                translateY(-15px);
        }


        /* =================================================
           LOGO
        ================================================= */

        .logo {

            width: 260px;
            height: 260px;

            object-fit: contain;

            display: block;

            margin-bottom: 28px;

            transition:
                transform 0.4s ease;
        }


        .logo:hover {

            transform:
                scale(1.02);
        }


        /* =================================================
           MAIN TITLE
        ================================================= */

        h1 {

            color: var(--text);

            font-size:
                clamp(30px, 4.2vw, 55px);

            font-weight: 700;

            line-height: 1.5;

            margin-bottom: 8px;
        }


        /* =================================================
           ENGLISH TITLE
        ================================================= */

        .english-title {

            direction: ltr;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            font-size:
                clamp(20px, 2.3vw, 30px);

            font-weight: 500;

            line-height: 1.5;

            margin-bottom: 20px;
        }


        /* =================================================
           DESCRIPTION
        ================================================= */

        .description {

            color: var(--text-soft);

            font-size:
                clamp(15px, 1.5vw, 19px);

            line-height: 2;

            margin-bottom: 30px;
        }


        /* =================================================
           DIVIDER
        ================================================= */

        .divider {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            margin-bottom: 50px;
        }


        .divider-line {

            width: 125px;

            height: 1px;

            background:
                var(--text-soft);

            opacity: 0.55;
        }


        .divider-dot {

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background:
                var(--accent);
        }


        /* =================================================
           DOWN ARROW
        ================================================= */

        .arrow {

            width: 22px;
            height: 22px;

            border-right:
                3px solid var(--text);

            border-bottom:
                3px solid var(--text);

            transform:
                rotate(45deg);

            opacity: 0.9;

            animation:
                arrowMove 2s infinite;
        }


        @keyframes arrowMove {

            0%,
            100% {

                transform:
                    rotate(45deg)
                    translate(0, 0);
            }

            50% {

                transform:
                    rotate(45deg)
                    translate(5px, 5px);
            }
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .page {

                min-height: 100svh;

                padding: 20px;
            }


            .top-bar {

                top: 18px;

                padding-left: 18px;
                padding-right: 18px;
            }


            .theme-switch {

                width: 78px;
                height: 40px;
            }


            .theme-slider {

                width: 32px;
                height: 32px;

                font-size: 17px;
            }


            body.dark
            .theme-slider {

                transform:
                    translateX(38px);
            }


            .content {

                transform:
                    translateY(-5px);
            }


            .logo {

                width: 190px;
                height: 190px;

                margin-bottom: 20px;
            }


            h1 {

                font-size: 28px;

                line-height: 1.65;
            }


            .english-title {

                font-size: 19px;
            }


            .description {

                font-size: 14px;

                max-width: 330px;

                margin-bottom: 25px;
            }


            .divider {

                margin-bottom: 38px;
            }


            .divider-line {

                width: 75px;
            }
        }


        /* =================================================
           SMALL HEIGHT
        ================================================= */

        @media (max-height: 700px) {

            .logo {

                width: 155px;
                height: 155px;

                margin-bottom: 12px;
            }


            h1 {

                font-size: 25px;
            }


            .description {

                margin-bottom: 18px;
            }


            .divider {

                margin-bottom: 25px;
            }
        }

    </style>

</head>


<body>


<main class="page">


    <!-- ================================================
         TOP CONTROLS
    ================================================= -->

    <header class="top-bar"><!-- DAY / NIGHT -->

        <button
            class="theme-switch"
            type="button"
            onclick="toggleTheme()"
            aria-label="تغییر حالت روز و شب">

            <span
                id="themeIcon"
                class="theme-slider">

                ☀️

            </span>

        </button>

    </header>



    <!-- ================================================
         CENTER CONTENT
    ================================================= -->

    <section class="content">


        <!-- LOGO -->

        <img
            src="/logo.png"
            alt="Shiraali Logo"
            class="logo">

        <h1>
                سایت بزودی راه‌اندازی می‌شود
            </h1>


            <div class="english-title">

                The website will be launching soon

            </div>


            <p class="description">

                به زودی با محتوای بهتر و امکانات بیشتر
                در خدمت شما خواهیم بود.

            </p>
<!-- DIVIDER -->

        <div class="divider">

            <span class="divider-line"></span>

            <span class="divider-dot"></span>

            <span class="divider-line"></span>

        </div>


        <!-- ARROW -->

        <div class="arrow"></div>


    </section>


</main>



<script>


/* =====================================================
   THEME
===================================================== */

function toggleTheme() {

    document.body.classList.toggle("dark");


    const isDark =
        document.body.classList.contains("dark");


    localStorage.setItem(
        "theme",
        isDark ? "dark" : "light"
    );


    updateThemeIcon();
}


function updateThemeIcon() {

    const icon =
        document.getElementById("themeIcon");


    const isDark =
        document.body.classList.contains("dark");


    icon.textContent =
        isDark ? "🌙" : "☀️";
}



/* =====================================================
   LOAD SAVED SETTINGS
===================================================== */

const savedTheme =
    localStorage.getItem("theme");


updateThemeIcon();

</script>


</body>

</html>

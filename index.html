```html
<script>
  const API = "https://shiraali-search.onrender.com/search";

  const INITIAL_LIMIT = 5;
  const MAX_RESULTS = 9;

  // ترتیب درخواست موتورهای جست‌وجو
  const SEARCH_ENGINES = ["bing", "duckduckgo", "yandex"];

  const ENGINE_NAMES = {
    bing: "Bing",
    duckduckgo: "DuckDuckGo",
    yandex: "Yandex"
  };

  // امتیاز هر موتور بر اساس رتبهٔ اصلی نتیجه
  // رتبه‌های بالاتر از ۵ امتیاز نمی‌گیرند.
  const ENGINE_SCORES = {
    duckduckgo: [5, 5, 4, 4, 4],
    bing:       [5, 3, 3, 2, 1],
    yandex:     [1, 1, 1, 1, 1]
  };

  // ترتیب رفع تساوی: ابتدا DuckDuckGo، سپس Bing و Yandex
  const TIE_BREAK_PRIORITY = ["duckduckgo", "bing", "yandex"];

  const themeButton = document.getElementById("theme");
  const searchForm = document.getElementById("searchForm");
  const queryInput = document.getElementById("query");
  const submitButton = document.getElementById("submitButton");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const showMoreButton = document.getElementById("showMore");

  let preparedResults = [];
  let visibleCount = 0;
  let currentWarnings = [];

  // تغییر حالت روشن و تاریک
  themeButton.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");
    themeButton.textContent = dark ? "☀️" : "🌙";

    document.querySelector('meta[name="theme-color"]')
      .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
  });

  function addTextElement(parent, tag, text, className) {
    const element = document.createElement(tag);
    element.textContent = text || "";

    if (className) {
      element.className = className;
    }

    parent.appendChild(element);
    return element;
  }

  // ساخت کلید یکسان برای لینک‌های تکراری
  function normalizedUrl(rawUrl) {
    try {
      const url = new URL(rawUrl);

      if (!["http:", "https:"].includes(url.protocol)) {
        return null;
      }

      url.hostname = url.hostname.toLowerCase()
        .replace(/^www\./, "");

      url.hash = "";

      if (url.pathname.length > 1) {
        url.pathname = url.pathname.replace(/\/+$/, "");
      }

      // حذف پارامترهای رایج رهگیری
      for (const key of [...url.searchParams.keys()]) {
        const lowerKey = key.toLowerCase();

        if (
          lowerKey.startsWith("utm_") ||
          ["gclid", "fbclid"].includes(lowerKey)
        ) {
          url.searchParams.delete(key);
        }
      }

      // مرتب‌سازی پارامترها برای شناسایی بهتر لینک‌های تکراری
      url.searchParams.sort();

      // پورت‌های پیش‌فرض اهمیتی در تشخیص تکرار ندارند
      if (
        (url.protocol === "https:" && url.port === "443") ||
        (url.protocol === "http:" && url.port === "80")
      ) {
        url.port = "";
      }

      return url.href;
    } catch {
      return null;
    }
  }

  // جست‌وجوی مستقل در یک موتور
  async function searchOneEngine(query, engine) {
    const url = new URL(API);

    url.searchParams.set("q", query);
    url.searchParams.set("engines", engine);
    url.searchParams.set("format", "json");

    const response = await fetch(url.toString(), {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.results)) {
      throw new Error("ساختار پاسخ نامعتبر است");
    }

    return {
      engine,
      results: data.results,
      warnings: data.unresponsive_engines || []
    };
  }

  // ادغام نتایج و محاسبهٔ امتیاز نهایی
  function prepareResults(engineResponses) {
    const merged = new Map();
    let stableOrder = 0;

    // ترتیب پردازش ثابت است تا نتیجه‌ها قابل پیش‌بینی باشند.
    for (const engine of SEARCH_ENGINES) {
      const response = engineResponses.find(
        item => item.engine === engine
      );

      if (!response) continue;

      const results = response.results || [];
      const alreadySeenInThisEngine = new Set();

      // فقط پنج نتیجهٔ اول هر موتور امتیاز می‌گیرند.
      for (let index = 0; index < Math.min(5, results.length); index++) {
        const original = results[index];
        const key = normalizedUrl(original.url);

        if (!key) continue;

        // یک موتور نباید برای یک لینک تکراری دوبار امتیاز بدهد.
        if (alreadySeenInThisEngine.has(key)) continue;
        alreadySeenInThisEngine.add(key);

        let item = merged.get(key);

        if (!item) {
          item = {
            ...original,
            url: original.url,
            _key: key,
            _score: 0,
            _engines: [],
            _ranks: {
              duckduckgo: Infinity,
              bing: Infinity,
              yandex: Infinity
            },
            _stableOrder: stableOrder++
          };

          merged.set(key, item);
        } else {
          // اگر نسخهٔ قبلی عنوان یا توضیح نداشت، از نسخهٔ جدید بگیر.
          if (!item.title && original.title) {
            item.title = original.title;
          }

          if (!item.content && original.content) {
            item.content = original.content;
          }
        }

        const rank = index + 1;
        const points = ENGINE_SCORES[engine][index];

        item._score += points;
        item._ranks[engine] = Math.min(
          item._ranks[engine],
          rank
        );

        if (!item._engines.includes(engine)) {
          item._engines.push(engine);
        }
      }
    }

    const ordered = [...merged.values()];

    ordered.sort((a, b) => {
      // معیار اول: امتیاز کل بیشتر
      if (b._score !== a._score) {
        return b._score - a._score;
      }

      // معیارهای بعدی: رتبهٔ بهتر در موتورهای تعیین‌شده
      for (const engine of TIE_BREAK_PRIORITY) {
        if (a._ranks[engine] !== b._ranks[engine]) {
          return a._ranks[engine] - b._ranks[engine];
        }
      }

      // اگر همه‌چیز برابر بود، ترتیب ثابت اولیه حفظ شود.
      return a._stableOrder - b._stableOrder;
    });

    // فقط ۹ لینک یکتای برتر
    return ordered.slice(0, MAX_RESULTS);
  }

  function renderOneResult(result) {
    const card = document.createElement("article");
    card.className = "result";

    const heading = document.createElement("h2");
    const link = document.createElement("a");

    link.href = result.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = result.title || result.url;

    heading.appendChild(link);
    card.appendChild(heading);

    addTextElement(card, "div", result.url, "result-url");

    if (result.content) {
      addTextElement(card, "p", result.content);
    }

    const engineNames = result._engines
      .map(engine => ENGINE_NAMES[engine] || engine)
      .join("، ");

    const details =
      "امتیاز: " + result._score +
      " | منبع: " + engineNames;

    addTextElement(card, "span", details, "result-engine");

    resultsBox.appendChild(card);
  }

  function renderVisibleResults() {
    resultsBox.replaceChildren();

    preparedResults
      .slice(0, visibleCount)
      .forEach(renderOneResult);

    if (currentWarnings.length) {
      const messages = currentWarnings.map(item => {
        if (Array.isArray(item)) {
          return (item[0] || "موتور ناشناس") +
            ": " + (item[1] || "پاسخ نداد");
        }

        return String(item);
      });

      addTextElement(
        resultsBox,
        "div",
        "هشدار موتورهای جست‌وجو: " + messages.join("؛ "),
        "warning"
      );
    }

    showMoreButton.hidden =
      visibleCount >= preparedResults.length ||
      visibleCount >= MAX_RESULTS;
  }

  showMoreButton.addEventListener("click", () => {
    visibleCount = Math.min(
      visibleCount + 4,
      MAX_RESULTS,
      preparedResults.length
    );

    renderVisibleResults();

    statusBox.textContent =
      visibleCount + " از " + preparedResults.length +
      " نتیجه نمایش داده شده است.";
  });

  function renderResults(engineResponses, warnings) {
    preparedResults = prepareResults(engineResponses);
    currentWarnings = warnings;

    visibleCount = Math.min(
      INITIAL_LIMIT,
      preparedResults.length
    );

    if (preparedResults.length === 0) {
      statusBox.textContent =
        "نتیجه‌ای پیدا نشد. ممکن است موتورهای جست‌وجو پاسخ نداده باشند؛ عبارت دیگری را امتحان کن.";
    } else {
      statusBox.textContent =
        preparedResults.length + " نتیجهٔ یکتا پیدا شد؛ " +
        "ابتدا " + visibleCount + " نتیجه نمایش داده می‌شود.";
    }

    renderVisibleResults();
  }

  searchForm.addEventListener("submit", async event => {
    event.preventDefault();

    const query = queryInput.value.trim();
    if (!query) return;

    submitButton.disabled = true;
    showMoreButton.hidden = true;

    statusBox.textContent =
      "در حال جست‌وجوی جداگانه در Bing، DuckDuckGo و Yandex... " +
      "بار اول ممکن است سرویس Render کمی دیر پاسخ دهد.";

    resultsBox.replaceChildren();
    preparedResults = [];
    visibleCount = 0;
    currentWarnings = [];

    try {
      // هر موتور درخواست مستقل دارد؛ خرابی یک موتور بقیه را متوقف نمی‌کند.
      const outcomes = await Promise.all(
        SEARCH_ENGINES.map(async engine => {
          try {
            return {
              ok: true,
              data: await searchOneEngine(query, engine)
            };
          } catch (error) {
            console.error("Search engine error:", engine, error);

            return {
              ok: false,
              engine,
              error
            };
          }
        })
      );

      const engineResponses = [];
      const warnings = [];

      for (const outcome of outcomes) {
        if (outcome.ok) {
          engineResponses.push(outcome.data);

          for (const warning of outcome.data.warnings || []) {
            if (Array.isArray(warning)) {
              warnings.push([
                ENGINE_NAMES[outcome.data.engine] || outcome.data.engine,
                warning[1] || warning[0] || "پاسخ نداد"
              ]);
            } else {
              warnings.push(
                (ENGINE_NAMES[outcome.data.engine] ||
                  outcome.data.engine) + ": " + String(warning)
              );
            }
          }
        } else {
          warnings.push([
            ENGINE_NAMES[outcome.engine] || outcome.engine,
            "دریافت نتایج ناموفق بود"
          ]);
        }
      }

      if (engineResponses.length === 0) {
        throw new Error("هیچ موتور جست‌وجویی پاسخ نداد");
      }

      renderResults(engineResponses, warnings);

    } catch (error) {
      console.error("Shiraali Search error:", error);

      statusBox.textContent =
        "دریافت نتایج ناموفق بود. ممکن است سرویس Render در حال بیدار شدن باشد " +
        "یا دسترسی مرورگر (CORS) مسدود شده باشد. چند لحظه صبر کن و دوباره امتحان کن.";

      const help = document.createElement("a");
      help.className = "more";
      help.href = API + "?q=" + encodeURIComponent(query) +
        "&engines=bing%2Cduckduckgo%2Cyandex&format=json";
      help.target = "_blank";
      help.rel = "noopener noreferrer";
      help.textContent = "آزمایش مستقیم سرویس جست‌وجو";

      resultsBox.appendChild(help);

    } finally {
      submitButton.disabled = false;
    }
  });
</script>

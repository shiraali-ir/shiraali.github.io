
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>Shiraali Search</title>
  <meta name="description" content="جست‌وجوی یکپارچه Shiraali">

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #fff;
      --border: #c5dbea;
      --button: #fff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255,255,255,.72);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16,47,76,.8);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme {
      position: fixed;
      z-index: 5;
      top: 18px;
      left: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    main {
      width: min(760px, 92%);
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      overflow: hidden;
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .search-icon {
      flex-shrink: 0;
      padding-inline: 5px;
      color: var(--muted);
      font-size: 22px;
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 3px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder {
      color: var(--muted);
    }

    /* دکمه در انتهای کادر، با فاصلهٔ کم و هماهنگ با انحنای آن */
    .submit {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      margin-top: 18px;
      text-align: right;
    }

    .result {
      margin: 0 0 14px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover {
      text-decoration: underline;
    }

    .result-url {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .result p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-engine {
      display: inline-block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: right;
    }

    .more {
      display: inline-block;
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--button);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .more:hover {
      filter: brightness(.97);
    }

    .more[hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      main {
        padding-top: 100px;
      }

      .logo {
        margin-bottom: 24px;
      }

      .search-box {
        min-height: 52px;
        gap: 6px;
      }

      .result {
        padding: 14px;
      }

      .result h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <button
    class="theme"
    id="theme"
    type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک"
  >🌙</button>

  <main>
    <img
      class="logo"
      src="https://shiraali.ir/logo.png"
      alt="شیر با دست روی کره زمین"
    >

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="query"
          type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="جست‌وجو"
        >➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite">
      عبارت موردنظرت را وارد کن و جست‌وجو را بزن.
    </div>

    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

  <script>
    const API = "https://shiraali-search.onrender.com/search";

    const INITIAL_LIMIT = 5;
    const MAX_RESULTS = 9;
    const ENGINE_LIMIT = 5;

    const ENGINES = ["duckduckgo", "bing", "yandex"];

    const WEIGHTS = {
      duckduckgo: [5, 5, 4, 4, 4],
      bing:       [5, 3, 3, 2, 1],
      yandex:     [1, 1, 1, 1, 1]
    };

    const ENGINE_NAMES = {
      duckduckgo: "DuckDuckGo",
      bing: "Bing",
      yandex: "Yandex"
    };

    const themeButton = document.getElementById("theme");
    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const showMoreButton = document.getElementById("showMore");

    let preparedResults = [];
    let visibleCount = 0;
    let currentWarnings = [];

    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const dark = document.body.classList.contains("dark");

      themeButton.textContent = dark ? "☀️" : "🌙";

      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
    });

    function addText(parent, tag, text, className) {
      const el = document.createElement(tag);
      el.textContent = text || "";

      if (className) {
        el.className = className;
      }

      parent.appendChild(el);
      return el;
    }

    /*
      نرمال‌سازی آدرس:
      - حذف www و حروف بزرگ دامنه
      - حذف بخش بعد از #
      - حذف پارامترهای ردیابی
      - مرتب‌سازی پارامترهای باقی‌مانده
      - حذف اسلش انتهایی مسیر
    */
    function normalizedUrl(raw) {
      try {
        const u = new URL(raw);

        if (!["http:", "https:"].includes(u.protocol)) {
          return null;
        }

        u.hash = "";
        u.hostname = u.hostname.toLowerCase().replace(/^www\./, "");

        if (u.pathname.length > 1) {
          u.pathname = u.pathname.replace(/\/+$/, "");
        }

        [...u.searchParams.keys()].forEach(key => {
          if (
            /^utm_/i.test(key) ||
            ["gclid", "fbclid"].includes(key.toLowerCase())
          ) {
            u.searchParams.delete(key);
          }
        });

        u.searchParams.sort();

        return u.href;
      } catch {
        return null;
      }
    }

    function renderOneResult(result) {
      const card = document.createElement("article");
      card.className = "result";

      const heading = document.createElement("h2");
      const link = document.createElement("a");

      link.href = result.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = result.title || result.url;

      heading.appendChild(link);
      card.appendChild(heading);

      addText(card, "div", result.url, "result-url");

      if (result.content) {
        addText(card, "p", result.content);
      }

      const sourceNames = result.engines
        .map(engine => ENGINE_NAMES[engine] || engine)
        .join("، ");

      addText(
        card,
        "span",
        `امتیاز کل: ${result.score} | موتورهای امتیازدهنده: ${sourceNames}`,
        "result-engine"
      );

      resultsBox.appendChild(card);
    }

    function renderVisible() {
      resultsBox.replaceChildren();

      preparedResults
        .slice(0, visibleCount)
        .forEach(renderOneResult);

      if (currentWarnings.length) {
        const messages = currentWarnings.map(
          item => `${ENGINE_NAMES[item.engine] || item.engine}: ${item.reason}`
        );

        addText(
          resultsBox,
          "div",
          "هشدار موتورهای جست‌وجو: " + messages.join("؛ "),
          "warning"
        );
      }

      showMoreButton.hidden =
        visibleCount >= preparedResults.length ||
        visibleCount >= MAX_RESULTS;
    }

    showMoreButton.addEventListener("click", () => {
      visibleCount = Math.min(
        visibleCount + 4,
        MAX_RESULTS,
        preparedResults.length
      );

      renderVisible();

      statusBox.textContent =
        `${visibleCount} از ${preparedResults.length} نتیجه نمایش داده شده است.`;
    });

    /*
      هر موتور جداگانه جست‌وجو می‌شود.
      پاسخ خام API ممکن است بیش از ۵ نتیجه داشته باشد؛
      در مرحلهٔ رتبه‌بندی فقط پنج رتبهٔ اول استفاده می‌شوند.
    */
    async function searchEngine(query, engine) {
      const url = new URL(API);

      url.searchParams.set("q", query);
      url.searchParams.set("engines", engine);
      url.searchParams.set("format", "json");

      const response = await fetch(url.toString(), {
        headers: { Accept: "application/json" }
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      return response.json();
    }

    /*
      رتبهٔ اصلی از positions خوانده می‌شود.
      اگر موجود نبود، از ترتیب نتیجه در پاسخ استفاده می‌کنیم.
      فقط رتبه‌های ۱ تا ۵ امتیاز می‌گیرند.
    */
    function getTopFive(data, engine) {
      const list = Array.isArray(data?.results)
        ? data.results
        : [];

      return list
        .map((result, index) => {
          const positions = Array.isArray(result.positions)
            ? result.positions
            : [];

          const rank = Number(positions[0]) || index + 1;

          return { result, rank, engine };
        })
        .filter(item => item.rank >= 1 && item.rank <= ENGINE_LIMIT)
        .sort((a, b) => a.rank - b.rank)
        .slice(0, ENGINE_LIMIT);
    }

    /*
      ادغام نتایج:
      - هر موتور فقط یک بار به هر آدرس امتیاز می‌دهد.
      - امتیازها بر اساس رتبهٔ اصلی هر موتور هستند.
      - Wikipedia و IMDb هیچ اولویت ویژه‌ای ندارند.
      - ترتیب تساوی: DuckDuckGo، سپس Bing، سپس Yandex.
    */
    function mergeAndRank(engineData) {
      const merged = new Map();
      let stableOrder = 0;

      for (const engine of ENGINES) {
        const data = engineData[engine];

        if (!data) {
          continue;
        }

        const topResults = getTopFive(data, engine);

        for (const entry of topResults) {
          const result = entry.result;
          const rank = entry.rank;
          const urlKey = normalizedUrl(result.url);

          if (!urlKey) {
            continue;
          }

          let item = merged.get(urlKey);

          if (!item) {
            item = {
              ...result,
              url: result.url,
              score: 0,
              engines: [],
              ranks: {},
              _stable: stableOrder++
            };

            merged.set(urlKey, item);
          }

          // از امتیازدهی تکراری یک موتور به یک URL جلوگیری می‌کند.
          if (item.engines.includes(engine)) {
            continue;
          }

          item.engines.push(engine);
          item.ranks[engine] = rank;
          item.score += WEIGHTS[engine][rank - 1];

          if (!item.title && result.title) {
            item.title = result.title;
          }

          if (!item.content && result.content) {
            item.content = result.content;
          }
        }
      }

      const missingRank = Number.POSITIVE_INFINITY;

      return [...merged.values()]
        .sort((a, b) => {
          // اول امتیاز کل از بیشترین به کمترین
          if (b.score !== a.score) {
            return b.score - a.score;
          }

          // در تساوی: رتبهٔ بهتر DuckDuckGo
          const ddgDiff =
            (a.ranks.duckduckgo ?? missingRank) -
            (b.ranks.duckduckgo ?? missingRank);

          if (ddgDiff !== 0) {
            return ddgDiff;
          }

          // سپس رتبهٔ بهتر Bing
          const bingDiff =
            (a.ranks.bing ?? missingRank) -
            (b.ranks.bing ?? missingRank);

          if (bingDiff !== 0) {
            return bingDiff;
          }

          // سپس رتبهٔ بهتر Yandex
          const yandexDiff =
            (a.ranks.yandex ?? missingRank) -
            (b.ranks.yandex ?? missingRank);

          if (yandexDiff !== 0) {
            return yandexDiff;
          }

          return a._stable - b._stable;
        })
        .slice(0, MAX_RESULTS);
    }

    searchForm.addEventListener("submit", async event => {
      event.preventDefault();

      const query = queryInput.value.trim();

      if (!query) {
        return;
      }

      submitButton.disabled = true;
      showMoreButton.hidden = true;
      resultsBox.replaceChildren();

      preparedResults = [];
      visibleCount = 0;
      currentWarnings = [];

      statusBox.textContent =
        "در حال جست‌وجوی مستقل در DuckDuckGo، Bing و Yandex...";

      try {
        /*
          سه درخواست هم‌زمان هستند.
          خرابی یک موتور جلوی نمایش نتایج دو موتور دیگر را نمی‌گیرد.
        */
        const settled = await Promise.all(
          ENGINES.map(async engine => {
            try {
              return {
                engine,
                data: await searchEngine(query, engine)
              };
            } catch (error) {
              return {
                engine,
                error: error.message || "پاسخ دریافت نشد"
              };
            }
          })
        );

        const engineData = {};

        for (const item of settled) {
          if (item.data) {
            engineData[item.engine] = item.data;

            for (const warning of (
              item.data.unresponsive_engines || []
            )) {
              currentWarnings.push({
                engine: item.engine,
                reason: Array.isArray(warning)
                  ? warning.join(": ")
                  : String(warning)
              });
            }
          } else {
            currentWarnings.push({
              engine: item.engine,
              reason: item.error
            });
          }
        }

        preparedResults = mergeAndRank(engineData);
        visibleCount = Math.min(
          INITIAL_LIMIT,
          preparedResults.length
        );

        if (preparedResults.length) {
          statusBox.textContent =
            `${preparedResults.length} نتیجهٔ یکتا پس از رتبه‌بندی پیدا شد؛ ` +
            `${visibleCount} نتیجه نمایش داده می‌شود.`;
        } else {
          statusBox.textContent =
            "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";
        }

        renderVisible();

        if (!preparedResults.length && currentWarnings.length) {
          statusBox.textContent =
            "موتورهای جست‌وجو پاسخ قابل استفاده ندادند. " +
            "چند لحظه صبر کن و دوباره امتحان کن.";
        }
      } catch (error) {
        console.error("Shiraali Search error:", error);

        statusBox.textContent =
          "دریافت نتایج ناموفق بود. چند لحظه صبر کن و دوباره امتحان کن.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>

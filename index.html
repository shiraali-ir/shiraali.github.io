
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>Shiraali Search</title>
  <meta name="description" content="جست‌وجوی یکپارچه Shiraali">

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #fff;
      --border: #c5dbea;
      --button: #fff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255,255,255,.72);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16,47,76,.8);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme-icon {
      width: 25px;
      height: 25px;
      display: block;
      flex: none;
    }

    .theme {
      position: absolute;
      z-index: 9999;
      top: 8px;
      left: 8px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      color: #fff;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 27px;
      line-height: 1;
      appearance: none;
      -webkit-appearance: none;
    }

    /* عرض محتوای دسکتاپ: 60 درصد صفحه */
    main {
      width: 60%;
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px 5px 5px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder {
      color: var(--muted);
    }

    .submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      text-align: right;
      margin-top: 18px;
      width: 100%;
    }

    /* کارت نتیجه با فضای کافی برای آیکون */
    .result {
      position: relative;
      width: 100%;
      margin: 0 0 14px;
      padding: 17px 18px 17px 54px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    /* آیکون سایت در گوشه بالا سمت چپ */
    .result-site-icon {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255,255,255,.8);
      padding: 2px;
    }

    .wiki-image-wrap {
      display: none;
      width: 100%;
      margin: 18px 0 22px;
      text-align: center;
      border-radius: 30px;
      overflow: hidden;
    }

    .wiki-image-wrap.visible {
      display: block;
    }

    .wiki-image {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 360px;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 30px;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover {
      text-decoration: underline;
    }

    .result-url {
      display: block;
      margin-bottom: 8px;
      padding-left: 38px;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .result p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-engine {
      display: inline-block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: right;
    }

    .more {
      display: inline-block;
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--button);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .more:hover {
      filter: brightness(.97);
    }

    .more[hidden] {
      display: none;
    }

    /* تبلت و صفحه‌های کوچک‌تر */
    @media (max-width: 700px) {
      main {
        width: 92%;
      }
    }

    @media (max-width: 480px) {
      main {
        padding-top: 100px;
      }

      .logo {
        margin-bottom: 24px;
      }

      .search-box {
        min-height: 52px;
      }

      .result {
        padding: 14px 14px 14px 48px;
      }

      .result-site-icon {
        top: 12px;
        left: 12px;
        width: 27px;
        height: 27px;
      }

      .result h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <button
    class="theme"
    id="theme"
    type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک"
  >
    <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#fff" d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"/>
    </svg>
  </button>

  <main>
    <img
      class="logo"
      src="https://shiraali.ir/logo.png"
      alt="شیر با دست روی کره زمین"
    >

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input
          id="query"
          type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >
        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="جست‌وجو"
        >➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div
      id="wikiImageWrap"
      class="wiki-image-wrap"
      aria-label="تصویر مرتبط از ویکی‌پدیا"
    >
      <img
        id="wikiImage"
        class="wiki-image"
        alt=""
        loading="lazy"
        referrerpolicy="no-referrer"
      >
    </div>

    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

<script>
  const API = "https://shiraali-search.onrender.com/search";

  const INITIAL_LIMIT = 5;
  const MAX_RESULTS = 9;

  const ENGINES = ["duckduckgo", "bing", "yandex"];

  const WEIGHTS = {
    duckduckgo: [5, 5, 4, 4, 4],
    bing: [5, 3, 3, 2, 1],
    yandex: [1, 1, 1, 1, 1]
  };

  const themeButton = document.getElementById("theme");
  const searchForm = document.getElementById("searchForm");
  const queryInput = document.getElementById("query");
  const submitButton = document.getElementById("submitButton");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const showMoreButton = document.getElementById("showMore");
  const wikiImageWrap = document.getElementById("wikiImageWrap");
  const wikiImage = document.getElementById("wikiImage");

  let preparedResults = [];
  let visibleCount = 0;
  let currentWarnings = [];

  themeButton.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    themeButton.innerHTML = dark
      ? `<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="#fff"/>
          <g stroke="#fff" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v2.2M12 19.8V22"/>
            <path d="M4.93 4.93l1.55 1.55M17.52 17.52l1.55 1.55"/>
            <path d="M2 12h2.2M19.8 12H22"/>
            <path d="M4.93 19.07l1.55-1.55M17.52 6.48l1.55-1.55"/>
          </g>
        </svg>`
      : `<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#fff" d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"/>
        </svg>`;

    document.querySelector('meta[name="theme-color"]')
      .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
  });

  async function loadWikipediaImage(query) {
    wikiImage.removeAttribute("src");
    wikiImage.alt = "";
    wikiImageWrap.classList.remove("visible");

    const languages = ["fa", "en"];

    for (const lang of languages) {
      try {
        const api = new URL(`https://${lang}.wikipedia.org/w/api.php`);

        api.searchParams.set("action", "query");
        api.searchParams.set("generator", "search");
        api.searchParams.set("gsrsearch", query);
        api.searchParams.set("gsrnamespace", "0");
        api.searchParams.set("gsrlimit", "1");
        api.searchParams.set("prop", "pageimages");
        api.searchParams.set("piprop", "thumbnail");
        api.searchParams.set("pithumbsize", "900");
        api.searchParams.set("format", "json");
        api.searchParams.set("origin", "*");

        const response = await fetch(api.toString());

        if (!response.ok) continue;

        const data = await response.json();
        const pages = Object.values(data.query?.pages || {});
        const image = pages.find(
          page => page.thumbnail?.source
        )?.thumbnail?.source;

        if (image) {
          wikiImage.src = image;
          wikiImageWrap.classList.add("visible");
          return;
        }
      } catch (error) {
        console.warn(`Wikipedia image lookup (${lang}) failed:`, error);
      }
    }
  }

  function addText(parent, tag, text, className) {
    const el = document.createElement(tag);
    el.textContent = text || "";

    if (className) {
      el.className = className;
    }

    parent.appendChild(el);
    return el;
  }

  function normalizedUrl(raw) {
    try {
      const u = new URL(raw);

      if (!["http:", "https:"].includes(u.protocol)) {
        return null;
      }

      u.hash = "";
      u.hostname = u.hostname.toLowerCase().replace(/^www\./, "");

      if (u.pathname.length > 1) {
        u.pathname = u.pathname.replace(/\/+$/, "");
      }

      [...u.searchParams.keys()].forEach(k => {
        if (
          /^utm_/i.test(k) ||
          ["gclid", "fbclid"].includes(k.toLowerCase())
        ) {
          u.searchParams.delete(k);
        }
      });

      u.searchParams.sort();
      return u.href;
    } catch {
      return null;
    }
  }

  function hostOf(raw) {
    try {
      return new URL(raw).hostname.toLowerCase().replace(/^www\./, "");
    } catch {
      return "";
    }
  }

  /* ساخت آیکون مخصوص دامنه هر نتیجه */
  function createSiteIcon(url) {
    const icon = document.createElement("img");
    const host = hostOf(url);

    if (!host) {
      return null;
    }

    icon.className = "result-site-icon";
    icon.alt = "";
    icon.setAttribute("aria-hidden", "true");
    icon.loading = "lazy";
    icon.referrerPolicy = "no-referrer";

    /* ابتدا دریافت آیکون از سرویس Google */
    icon.src =
      "https://www.google.com/s2/favicons?domain=" +
      encodeURIComponent(host) +
      "&sz=64";

    /* در صورت خطا، تلاش با سرویس جایگزین */
    icon.onerror = function () {
      if (this.dataset.fallbackTried !== "yes") {
        this.dataset.fallbackTried = "yes";
        this.src = "https://icons.duckduckgo.com/ip3/" +
          encodeURIComponent(host) + ".ico";
      } else {
        this.style.display = "none";
      }
    };

    return icon;
  }

  function renderOneResult(r) {
    const card = document.createElement("article");
    card.className = "result";

    const siteIcon = createSiteIcon(r.url);

    if (siteIcon) {
      card.appendChild(siteIcon);
    }

    const h = document.createElement("h2");
    const a = document.createElement("a");

    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = r.title || r.url;

    h.appendChild(a);
    card.appendChild(h);

    addText(card, "div", r.url, "result-url");

    if (r.content) {
      addText(card, "p", r.content);
    }

    addText(
      card,
      "span",
      `امتیاز: ${r.score} | موتورهای مؤثر: ${r.engines.join(", ")}`,
      "result-engine"
    );

    resultsBox.appendChild(card);
  }

  function renderVisible() {
    resultsBox.replaceChildren();

    preparedResults
      .slice(0, visibleCount)
      .forEach(renderOneResult);

    if (currentWarnings.length) {
      const msgs = currentWarnings.map(
        x => `${x.engine}: ${x.reason}`
      );

      addText(
        resultsBox,
        "div",
        "برخی موتورهای جست‌وجو پاسخ نداده‌اند: " + msgs.join("؛ "),
        "warning"
      );
    }

    showMoreButton.hidden =
      visibleCount >= preparedResults.length ||
      visibleCount >= MAX_RESULTS;
  }

  showMoreButton.addEventListener("click", () => {
    visibleCount = Math.min(
      visibleCount + 4,
      MAX_RESULTS,
      preparedResults.length
    );

    renderVisible();
    statusBox.textContent = "";
  });

  async function searchEngine(query, engine) {
    const u = new URL(API);

    u.searchParams.set("q", query);
    u.searchParams.set("engines", engine);
    u.searchParams.set("format", "json");

    const res = await fetch(u.toString(), {
      headers: { Accept: "application/json" }
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    return res.json();
  }

  function mergeAndRank(engineData) {
    const merged = new Map();
    let stable = 0;

    for (const engine of ENGINES) {
      const data = engineData[engine];

      if (!data) continue;

      const list = Array.isArray(data.results)
        ? data.results
        : [];

      list.forEach((r, index) => {
        const url = normalizedUrl(r.url);

        if (!url) return;

        let item = merged.get(url);

        if (!item) {
          item = {
            ...r,
            url,
            score: 0,
            engines: [],
            ranks: {},
            _stable: stable++
          };

          merged.set(url, item);
        }

        if (item.engines.includes(engine)) return;

        item.engines.push(engine);
        item.ranks[engine] = index + 1;

        const rank = index + 1;

        if (rank <= 5) {
          item.score += WEIGHTS[engine][rank - 1];
        }

        if (!item.title && r.title) {
          item.title = r.title;
        }

        if (!item.content && r.content) {
          item.content = r.content;
        }
      });
    }

    return [...merged.values()]
      .sort((a, b) =>
        b.score - a.score ||
        (a.ranks.duckduckgo || Infinity) -
          (b.ranks.duckduckgo || Infinity) ||
        (a.ranks.bing || Infinity) -
          (b.ranks.bing || Infinity) ||
        (a.ranks.yandex || Infinity) -
          (b.ranks.yandex || Infinity) ||
        a._stable - b._stable
      )
      .slice(0, MAX_RESULTS);
  }

  searchForm.addEventListener("submit", async e => {
    e.preventDefault();

    const query = queryInput.value.trim();

    if (!query) return;

    submitButton.disabled = true;
    showMoreButton.hidden = true;
    resultsBox.replaceChildren();

    wikiImage.removeAttribute("src");
    wikiImageWrap.classList.remove("visible");

    loadWikipediaImage(query);

    preparedResults = [];
    visibleCount = 0;
    currentWarnings = [];

    statusBox.textContent =
      "در حال جست‌وجو در DuckDuckGo، Bing و Yandex... بار اول ممکن است سرویس Render کمی دیر پاسخ دهد.";

    try {
      const settled = await Promise.all(
        ENGINES.map(async engine => {
          try {
            return {
              engine,
              data: await searchEngine(query, engine)
            };
          } catch (err) {
            return {
              engine,
              error: err.message
            };
          }
        })
      );

      const engineData = {};

      for (const item of settled) {
        if (item.data) {
          engineData[item.engine] = item.data;

          for (const warning of (item.data.unresponsive_engines || [])) {
            currentWarnings.push({
              engine: item.engine,
              reason: Array.isArray(warning)
                ? warning.join(": ")
                : String(warning)
            });
          }
        } else {
          currentWarnings.push({
            engine: item.engine,
            reason: item.error || "پاسخ دریافت نشد"
          });
        }
      }

      preparedResults = mergeAndRank(engineData);
      visibleCount = Math.min(
        INITIAL_LIMIT,
        preparedResults.length
      );

      statusBox.textContent = preparedResults.length
        ? ""
        : "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";

      renderVisible();

      if (!preparedResults.length && currentWarnings.length) {
        statusBox.textContent =
          "موتورهای جست‌وجو پاسخ ندادند. چند لحظه صبر کن و دوباره امتحان کن.";
      }
    } catch (err) {
      console.error("Shiraali Search error:", err);

      statusBox.textContent =
        "دریافت نتایج ناموفق بود. ممکن است سرویس در حال بیدار شدن باشد یا دسترسی مرورگر مسدود شده باشد. چند لحظه صبر کن و دوباره امتحان کن.";
    } finally {
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>

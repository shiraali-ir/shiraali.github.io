  ["groq", "Groq", "gpt-oss-120b"],
  ["openrouter", "OpenRouter", "nemotron-3-ultra"],
  ["cohere", "Cohere", "command-a"],
  ["workersai", "Workers AI", "gemma-4-26b"],
  ["gemini", "Gemini", "gemini-flash-lite"],
  ["cerebras", "Cerebras", "gpt-oss-120b"],
  ["mistral", "Mistral", "mistral-large"],
  ["sambanova", "SambaNova", "gemma-4-31b"],
  ["huggingface", "Hugging Face", "gemma-3-27b"]
];
const aiSection = document.getElementById("aiSection");
let aiActive = null, aiStarted = false, aiCtrl = null, aiSources = [], aiCards = {};
const faNum = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

function aiHealth() {
  if (aiActive) return Promise.resolve(aiActive);
  return fetch(AI_ENDPOINT + "/health").then(r => r.json())
    .then(d => (aiActive = new Set(d.providers || [])))
    .catch(() => null);
}

function resetAI() {
  if (aiCtrl) aiCtrl.abort();
  aiCtrl = null; aiStarted = false; aiSources = []; aiCards = {};
  aiSection.hidden = true;
  aiSection.replaceChildren();
}

function aiCardOff(card, label) {
  card.className = "ai-card off";
  card.replaceChildren();
  const head = document.createElement("div"); head.className = "ai-head";
  head.textContent = card.dataset.name;
  addText(head, "span", label || "فعلاً در دسترس نیست", "ai-model");
  card.appendChild(head);
}

function aiCardLoading(card) {
  card.className = "ai-card loading";
  card.replaceChildren();
  const head = document.createElement("div"); head.className = "ai-head";
  head.textContent = card.dataset.name;
  addText(head, "span", "در حال آماده‌شدن…", "ai-model");
  card.appendChild(head);
  addText(card, "div", "", "ai-skel");
  addText(card, "div", "", "ai-skel short");
}

function aiCardFill(card, res) {
  card.className = "ai-card";
  card.replaceChildren();
  const head = document.createElement("div"); head.className = "ai-head";
  head.textContent = card.dataset.name;
  addText(head, "span", card.dataset.model, "ai-model");
  card.appendChild(head);
  const p = document.createElement("p"); p.className = "ai-text";
  String(res.text).split(/(\[\d{1,2}\])/).forEach(part => {
    const m = part.match(/^\[(\d{1,2})\]$/);
    const src = m && aiSources[+m[1] - 1];
    if (src) {
      const sup = document.createElement("sup"); const a = document.createElement("a");
      a.href = src.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "[" + faNum(m[1]) + "]";
      sup.appendChild(a); p.appendChild(sup);
    } else if (!m) p.appendChild(document.createTextNode(part));
  });
  card.appendChild(p);
  const used = (res.sources || []).filter(i => aiSources[i - 1]);
  if (used.length) {
    const box = document.createElement("div"); box.className = "ai-src";
    used.forEach(i => {
      const a = document.createElement("a");
      a.href = aiSources[i - 1].url; a.target = "_blank"; a.rel = "noopener noreferrer";
      let host = aiSources[i - 1].url;
      try { host = new URL(host).hostname.replace(/^www\./, ""); } catch {}
      a.textContent = faNum(i) + " " + host;
      box.appendChild(a);
    });
    card.appendChild(box);
  }
}

async function startAI(seq, q) {
  if (aiStarted || seq !== searchSequence) return;
  const seen = new Set();
  const list = [...prioritySiteResults, ...preparedResults].filter(r => {
    const k = r && r.url && normalizedUrl(r.url);
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  }).slice(0, 8);
  if (!list.length) return;
  aiStarted = true;
  aiSources = list.map(r => ({ title: cleanResultTitle(r) || r.title || "", url: r.url, snippet: r.content || "" }));
  const ctrl = aiCtrl = new AbortController();
  const active = await aiHealth();
  if (seq !== searchSequence || ctrl.signal.aborted) return;

  aiSection.replaceChildren();
  const title = document.createElement("h2"); title.className = "ai-title";
  title.textContent = "✨ نتایج هوشواره";
  addText(title, "span", "آزمایشی", "ai-badge");
  aiSection.appendChild(title);
  AI_ORDER.forEach(([id, name, model]) => {
    const card = document.createElement("div");
    card.dataset.name = name; card.dataset.model = model;
    if (!active || active.has(id)) aiCardLoading(card); else aiCardOff(card);
    aiCards[id] = card; aiSection.appendChild(card);
  });
  addText(aiSection, "div", "پاسخ‌های خودکار از روی نتایج؛ ممکن است خطا داشته باشند.", "ai-note");
  aiSection.hidden = false;
  renderVisible();

  const done = new Set();
  try {
    const r = await fetch(AI_ENDPOINT + "/ai", {
      method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q, results: aiSources })
    });
    if (!r.ok || !r.body) throw new Error("ai " + r.status);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line || seq !== searchSequence) continue;
        let res; try { res = JSON.parse(line); } catch { continue; }
        const card = aiCards[res.provider]; if (!card) continue;
        done.add(res.provider);
        if (res.ok && res.text) aiCardFill(card, res); else aiCardOff(card);
      }
    }
  } catch (e) {
    if (ctrl.signal.aborted) return;
    console.warn("هوشواره:", e);
  }
  if (seq !== searchSequence) return;
  Object.entries(aiCards).forEach(([id, card]) => { if (!done.has(id) && card.classList.contains("loading")) aiCardOff(card); });
  if (!Object.values(aiCards).some(c => !c.classList.contains("off"))) aiSection.hidden = true;
}

let secondaryDone = true;

/* سه بخش ویژه، سوشال و جنرال کاملاً مستقل‌اند؛ هر کدام با رسیدن جواب خودش نمایش می‌دهد */
async function runTextSearch(seq, domain, q, directUrl) {
  const generalGroups = [];
  const priorityGroups = [];
  const alive = () => seq === searchSequence;

  runGoogleCseSearch(domain ? `site:${domain} ${q}` : q);
  secondaryDone = false;

  const rebuildPriority = () => {
    prioritySiteResults = mergeAndRank(priorityGroups, null, INITIAL_LIMIT, true, q);
  };

  const rebuildGeneral = () => {
    preparedResults = mergeAndRank(generalGroups, directUrl, Number.MAX_SAFE_INTEGER, false, q)
      .filter(item => item.isDirect || priorityForUrl(item.url) > PRIORITY_SITES.length)
      .slice(0, MAX_RESULTS);
    visibleCount = Math.min(Math.max(visibleCount, INITIAL_LIMIT), preparedResults.length);
  };

  let aiTimer = null;
  const kickAI = () => {
    if (aiStarted || !alive()) return;
    const n = prioritySiteResults.length + preparedResults.length;
    if (n >= 5) { clearTimeout(aiTimer); startAI(seq, q); }
    else if (n && !aiTimer) aiTimer = setTimeout(() => startAI(seq, q), 3500);
  };

  const sitesTask = async (sites, base) => {
    await collectPriorityGroups(sites, base, q, priorityGroups);
    if (!alive()) return;
    rebuildPriority();
    renderVisible();
    kickAI();
  };

  const generalStage = async engines => {
    if (domain) {
      await collectTextGroups(`site:${domain} ${q}`.trim(), 2, " (جست‌وجوی سایت)",
        generalGroups, engines, domain, BACKENDS.general);
    }
    await collectTextGroups(q, 1, "", generalGroups, engines, null, BACKENDS.general);
    if (!alive()) return false;
    rebuildGeneral();
    return true;
  };

  const generalTask = async () => {
    try {
      if (!(await generalStage(ENGINES))) return;
      renderVisible();
      kickAI();
      if (!(await generalStage(SECONDARY_ENGINES))) return;
    } finally {
      if (alive()) { secondaryDone = true; renderVisible(); }
    }
  };

  await Promise.all([
    sitesTask(SPECIAL_SITES, BACKENDS.special).catch(e => console.warn("special failed:", e)),
    sitesTask(SOCIAL_SITES,  BACKENDS.social ).catch(e => console.warn("social failed:", e)),
    generalTask().catch(e => console.warn("general failed:", e))
  ]);
  if (alive()) { clearTimeout(aiTimer); startAI(seq, q); }
}

function renderOneResult(r) {
  const card = document.createElement("article");
  card.className = "result";

  const siteIcon = createSiteIcon(r.url);
  if (siteIcon) card.appendChild(siteIcon);

  const heading = document.createElement("h2");
  const link = document.createElement("a");

  link.href = r.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = (typeof r.title === "string" ? r.title.trim() : "") || r.url;

  heading.appendChild(link);
  card.appendChild(heading);

  if (r.content) addText(card, "p", r.content);

  addText(
    card,
    "span",
    r.embassy
      ? `${r.sourceLabel || "سفارت"} | ${r.time != null
          ? "تاریخ انتشار: " + new Date(r.time).toLocaleDateString("fa-IR")
          : "تاریخ نامشخص"}`
      : `امتیاز: ${r.rankingScore ?? r.score} | منابع: ${r.engines.join(", ")}`,
    "result-engine"
  );

  resultsBox.appendChild(card);
}

function renderVisible() {
  resultsBox.replaceChildren();

  if (weatherData) renderWeatherCards(weatherData);
  if (wikiInfobox) renderInfoboxCard(wikiInfobox);
  if (aiStarted) resultsBox.appendChild(aiSection);

  if (wikiCard || prioritySiteResults.length) {
    addText(resultsBox, "h2", "نتایج سایت‌های اولویت‌دار", "results-section-title");
    if (wikiCard) renderWikiCard(wikiCard);

    const wikiUrl = wikiCard ? normalizedUrl(wikiCard.url) : null;
    prioritySiteResults
      .filter(r => !wikiUrl || normalizedUrl(r.url) !== wikiUrl)
      .slice(0, wikiCard ? 10 : 11)
      .forEach(renderOneResult);
  }

  if (preparedResults.length) {
    addText(resultsBox, "h2", "نتایج جست‌وجوی عمومی", "results-section-title");
    preparedResults.slice(0, visibleCount).forEach(renderOneResult);
  }

  embassyResults.forEach(renderOneResult);

  if (currentWarnings.length) {
    const messages = currentWarnings.map(item => `${item.engine}: ${item.reason}`);
    addText(resultsBox, "div", "برخی جست‌وجوها پاسخ نداده‌اند: " + messages.join("؛ "), "warning");
  }

  const more = visibleCount < preparedResults.length && visibleCount < MAX_RESULTS;
  const waiting = !secondaryDone && visibleCount >= preparedResults.length && preparedResults.length > 0;

  showMoreButton.hidden = !(more || waiting);
  showMoreButton.disabled = waiting;
  showMoreButton.textContent = waiting ? "در حال دریافت نتایج بیشتر..." : "نمایش نتایج بیشتر";

  /* اولین نتیجه رسید: پیام «بیدار شدن سرور» پاک و دکمه آزاد می‌شود */
  if (resultsBox.children.length) {
    clearTimeout(slowTimer);
    submitButton.disabled = false;
    if (/بیدار/.test(statusBox.textContent)) statusBox.textContent = "";
  }
}

showMoreButton.addEventListener("click", () => {
  visibleCount = Math.min(visibleCount + 11, MAX_RESULTS, preparedResults.length);
  renderVisible();
  statusBox.textContent = "";
});

/* ---------- اجرای جست‌وجو ---------- */

searchForm.addEventListener("submit", async event => {
  event.preventDefault();

  const originalQuery = queryInput.value.trim();
  if (!originalQuery) return;

  const thisSearch = ++searchSequence;
  hasSearched = true;
  queryInput.blur();
  const target = detectTarget(originalQuery);

  const cls = classifyQuery(originalQuery);
  const searchQuery = cls.query || target.query;
  const operator = detectOperator(originalQuery);
  const skipPlace = ["animal", "plain", "milk"].includes(cls.kind) || !!operator;
  const placeLevel = (cls.kind === "produce" || cls.kind === "food")
    ? (cls.single ? "top" : "strict") : "any";
  const domain = target.domain;

  submitButton.disabled = true;
  showMoreButton.hidden = true;
  resultsBox.replaceChildren();
  resetAI();
  googleCseWrap.hidden = true;
  googleCseResults.replaceChildren();

  preparedResults = [];
  prioritySiteResults = [];
  embassyResults = [];
  visibleCount = 0;
  currentWarnings = [];
  weatherData = null;
  wikiCard = null;
  wikiInfobox = null;

  resetGallery();
  resetWeatherImage();
  resetClock();
  resetNutrition();
  resetMath();
  resetColor();
  resetTranslation();
  resetLex();
  resetOperator();
  hideCorrection();

  const colorHex = detectColor(originalQuery);

  if (colorHex) {
    statusBox.textContent = "";
    renderColor(colorHex);
    submitButton.disabled = false;
    return;
  }

  const mathAnswer = evaluateMath(originalQuery);

  if (mathAnswer !== null) {
    statusBox.textContent = "";
    renderMath(mathAnswer);
    submitButton.disabled = false;
    return;
  }

  const translationRequest = parseTranslationRequest(originalQuery);

  if (translationRequest) {
    try {
      const translated = await fetchTranslation(translationRequest, thisSearch);

      if (thisSearch !== searchSequence) return;

      if (translated) {
        statusBox.textContent = "";
        renderTranslation(translated);
        submitButton.disabled = false;
        return;
      }
    } catch (error) {
      console.warn("Translation failed:", error);
    }

    if (thisSearch !== searchSequence) return;
  }

  const equivRequest = parseEquivalentRequest(originalQuery);

  if (equivRequest) {
    statusBox.textContent = "در حال جست‌وجو در لغتنامه...";

    try {
      await renderEquivalent(equivRequest.text, thisSearch);
    } catch (error) {
      console.warn("Equivalent lookup failed:", error);
    }

    if (thisSearch !== searchSequence) return;

    statusBox.textContent = "";
    submitButton.disabled = false;
    return;
  }

  if (!domain && !target.directUrl && !operator) {
    computeCorrection(originalQuery, thisSearch).catch(error =>
      console.warn("Correction failed:", error));
  }

  clearTimeout(slowTimer);
  slowTimer = setTimeout(() => {
    if (thisSearch === searchSequence && !resultsBox.children.length &&
        !wikiImageWrap.classList.contains("visible")) {
      statusBox.textContent = "سرور در حال بیدار شدن است، تا یک دقیقه ممکن است طول بکشد...";
    }
  }, 5000);

  const plain = !domain && !target.directUrl;
  const alive = () => thisSearch === searchSequence;
  if (operator) renderOperator(operator);

  let wikiImageResult = null;
  let engineImages = null;

  const refreshGallery = () => {
    if (!alive()) return;
    const list = [];
    if (wikiImageResult?.src) list.push(wikiImageResult);
    (engineImages || []).forEach(img => {
      if (!list.some(i => i.src === img.src)) list.push(img);
    });
    if (list.length) renderGallery(list);
  };

  const task = (name, fn) => fn().catch(e => console.warn(name + " failed:", e));

  try {
    await Promise.all([

      /* ویژه + سوشال + جنرال */
      task("text", () => runTextSearch(thisSearch, domain, searchQuery, target.directUrl)),

      /* تصاویر موتورها */
      task("images", async () => {
        const imgs = await collectImageResults(searchQuery, thisSearch, null);
        if (!alive() || !imgs) return;
        engineImages = imgs;
        galleryReady = true;
        refreshGallery();
      }),

      /* عکس ویکی‌پدیا */
      task("wikiImage", async () => {
        const img = await loadWikipediaImage(searchQuery, thisSearch);
        if (!alive() || !img) return;
        wikiImageResult = img;
        refreshGallery();
      }),

      /* خلاصهٔ ویکی‌پدیا */
      task("wikiText", async () => {
        if (!plain) return;
        const card = await loadWikipediaSummary(searchQuery, thisSearch);
        if (!alive() || !card) return;
        wikiCard = card;
        renderVisible();
      }),

      /* Infobox */
      task("infobox", async () => {
        if (!plain) return;
        const info = await loadWikiInfobox(searchQuery, thisSearch);
        if (!alive() || !info) return;
        wikiInfobox = info;
        renderVisible();
      }),

      /* مکان ← ساعت ← هواشناسی، یا ارزش غذایی */
      task("place", async () => {
        let weatherPlace = null;

        if (plain && !skipPlace && shouldShowWeatherForQuery(originalQuery)) {
          weatherPlace = await findWeatherPlace(originalQuery, placeLevel);
          if (!alive()) return;

          if (weatherPlace) {
            renderClock(weatherPlace, null).catch(() => resetClock());

            try {
              const data = await fetchWeather(weatherPlace);
              if (!alive()) return;
              weatherData = data;
              renderWeatherImage(data);
              renderVisible();
            } catch (error) {
              console.warn("Weather request failed:", error);
            }
          }
        }

        if (!weatherPlace && plain && !operator &&
            ["food", "produce", "milk"].includes(cls.kind)) {
          try {
            const nutrition = await loadNutrition(cls.en || originalQuery, thisSearch);
            if (!alive()) return;
            if (nutrition) renderNutrition(nutrition, originalQuery);
          } catch (error) {
            console.warn("Nutrition lookup failed:", error);
            currentWarnings.push({ engine: "ارزش غذایی", reason: error?.message || "پاسخ دریافت نشد" });
            resetNutrition();
            renderVisible();
          }
        }
      }),

      /* سفارت، وزارت خارجه، ایمیگریشن (بک‌اند embassy) */
      task("embassy", async () => {
        if (!plain) return;
        const [embassyList, govList] = await Promise.all([
          collectEmbassyResults(originalQuery, thisSearch),
          collectGovResults(originalQuery, thisSearch)
        ]);
        if (!alive()) return;
        embassyResults = [...embassyList, ...govList];
        if (embassyResults.length) renderVisible();
      })
    ]);

    if (!alive()) return;

    galleryReady = true;
    if (galleryImages.length) showGalleryImage();

    if (preparedResults.length || prioritySiteResults.length) {
      statusBox.textContent = "";
    } else if (weatherData) {
      statusBox.textContent = "اطلاعات هواشناسی نمایش داده شد؛ نتیجهٔ متنی دیگری پیدا نشد.";
    } else if (currentWarnings.length) {
      statusBox.textContent = "موتورهای جست‌وجو پاسخ ندادند. چند لحظه صبر کن و دوباره امتحان کن.";
    } else {
      statusBox.textContent = "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";
    }
  } catch (error) {
    console.error("Shiraali Search error:", error);
    if (alive()) {
      statusBox.textContent = "دریافت نتایج ناموفق بود. چند لحظه صبر کن و دوباره امتحان کن.";
      renderVisible();
    }
  } finally {
    clearTimeout(slowTimer);
    if (alive()) submitButton.disabled = false;
  }
});
</script>

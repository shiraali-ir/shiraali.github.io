
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <meta name="description" content="جست‌وجوی یکپارچه">

  <title>Shiraali</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #ffffff;
      --border: #c5dbea;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255, 255, 255, 0.72);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16, 47, 76, 0.8);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    /* دکمه تغییر تم؛ همراه صفحه اسکرول می‌شود */
    .theme {
      position: absolute;
      z-index: 5;
      top: 18px;
      left: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      outline: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .theme svg {
      display: block;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      background: transparent;
    }

    main {
      width: 50%;
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    /* کلیک یا لمس لوگو، صفحه اصلی را دوباره باز می‌کند */
    .logo-link {
      display: inline-block;
      line-height: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .logo-link .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px 5px 5px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder {
      color: var(--muted);
    }

    .submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-size: 20px;
    }

    .submit:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    #results {
      margin-top: 18px;
      text-align: right;
    }

    .result {
      margin: 0 0 14px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover {
      text-decoration: underline;
    }

    .result-url {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .result p {
      margin: 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-engine {
      display: inline-block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: right;
    }

    .more {
      display: inline-block;
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--input);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .more:hover {
      filter: brightness(0.97);
    }

    .more[hidden] {
      display: none;
    }

    .wiki-image-wrap {
      display: none;
      margin: 18px 0 22px;
      text-align: center;
    }

    .wiki-image-wrap.visible {
      display: block;
    }

    .wiki-image {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 360px;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 14px;
    }

    @media (max-width: 700px) {
      main {
        width: 92%;
      }
    }

    @media (max-width: 480px) {
      main {
        padding-top: 100px;
      }

      .logo-link .logo {
        margin-bottom: 24px;
      }

      .search-box {
        min-height: 52px;
      }

      .result {
        padding: 14px;
      }

      .result h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- دکمه تغییر حالت روشن و تاریک -->
  <button
    class="theme"
    id="theme"
    type="button"
    aria-label="تغییر حالت روشن و تاریک"
    title="تغییر حالت روشن و تاریک"
  >
    <!-- ماه سفید -->
    <svg
      id="moonIcon"
      width="34"
      height="34"
      viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M39 8 A24 24 0 1 0 56 43 A21 21 0 0 1 39 8Z"
        fill="#ffffff"
      />
    </svg>

    <!-- خورشید سفید -->
    <svg
      id="sunIcon"
      width="34"
      height="34"
      viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
      style="display:none"
    >
      <g
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
      >
        <path d="M32 5V12"/>
        <path d="M32 52V59"/>
        <path d="M5 32H12"/>
        <path d="M52 32H59"/>
        <path d="M13 13L18 18"/>
        <path d="M46 46L51 51"/>
        <path d="M51 13L46 18"/>
        <path d="M18 46L13 51"/>
      </g>
      <circle cx="32" cy="32" r="12" fill="#ffffff"/>
    </svg>
  </button>

  <main>
    <!-- لوگو لینک صفحه اصلی است -->
    <a
      href="https://shiraali.ir/"
      class="logo-link"
      aria-label="بازگشت به صفحه اصلی"
    >
      <img
        class="logo"
        src="https://shiraali.ir/logo.png"
        alt="لوگوی شیر"
      >
    </a>

    <!-- فرم جست‌وجو -->
    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input
          id="query"
          type="search"
          placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو"
          autocomplete="off"
          required
        >

        <button
          class="submit"
          id="submitButton"
          type="submit"
          aria-label="جست‌وجو"
        >➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <!-- تصویر مرتبط از ویکی‌پدیا -->
    <div
      id="wikiImageWrap"
      class="wiki-image-wrap"
      aria-label="تصویر مرتبط از ویکی‌پدیا"
    >
      <img
        id="wikiImage"
        class="wiki-image"
        alt=""
        loading="lazy"
        referrerpolicy="no-referrer"
      >
    </div>

    <!-- نتایج جست‌وجو -->
    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

  <script>
    const API = "https://shiraali-search.onrender.com/search";

    const INITIAL_LIMIT = 5;
    const MAX_RESULTS = 9;

    const ENGINES = [
      "duckduckgo",
      "bing",
      "yandex"
    ];

    const WEIGHTS = {
      duckduckgo: [5, 5, 4, 4, 4],
      bing: [5, 3, 3, 2, 1],
      yandex: [1, 1, 1, 1, 1]
    };

    const themeButton = document.getElementById("theme");
    const moonIcon = document.getElementById("moonIcon");
    const sunIcon = document.getElementById("sunIcon");

    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const showMoreButton = document.getElementById("showMore");

    const wikiImageWrap = document.getElementById("wikiImageWrap");
    const wikiImage = document.getElementById("wikiImage");

    let preparedResults = [];
    let visibleCount = 0;
    let currentWarnings = [];

    /* تغییر تم */
    function updateThemeIcon() {
      const dark = document.body.classList.contains("dark");

      moonIcon.style.display = dark ? "none" : "block";
      sunIcon.style.display = dark ? "block" : "none";

      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute(
          "content",
          dark ? "#0b3157" : "#dff2ff"
        );
    }

    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      updateThemeIcon();
    });

    /* دریافت تصویر مرتبط از ویکی‌پدیا */
    async function loadWikipediaImage(query) {
      wikiImage.removeAttribute("src");
      wikiImage.alt = "";
      wikiImageWrap.classList.remove("visible");

      const languages = ["fa", "en"];

      for (const lang of languages) {
        try {
          const api = new URL(
            `https://${lang}.wikipedia.org/w/api.php`
          );

          api.searchParams.set("action", "query");
          api.searchParams.set("generator", "search");
          api.searchParams.set("gsrsearch", query);
          api.searchParams.set("gsrnamespace", "0");
          api.searchParams.set("gsrlimit", "1");
          api.searchParams.set("prop", "pageimages");
          api.searchParams.set("piprop", "thumbnail");
          api.searchParams.set("pithumbsize", "900");
          api.searchParams.set("format", "json");
          api.searchParams.set("origin", "*");

          const response = await fetch(api.toString());

          if (!response.ok) {
            continue;
          }

          const data = await response.json();
          const pages = Object.values(
            data.query?.pages || {}
          );

          const image = pages.find(
            page => page.thumbnail?.source
          )?.thumbnail?.source;

          if (image) {
            wikiImage.src = image;
            wikiImage.alt = `تصویر مرتبط با ${query}`;
            wikiImageWrap.classList.add("visible");
            return;
          }
        } catch (error) {
          console.warn(
            `Wikipedia image lookup (${lang}) failed:`,
            error
          );
        }
      }
    }

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text || "";

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    /* حذف نتایج تکراری */
    function normalizedUrl(raw) {
      try {
        const url = new URL(raw);

        if (!["http:", "https:"].includes(url.protocol)) {
          return null;
        }

        url.hash = "";
        url.hostname = url.hostname
          .toLowerCase()
          .replace(/^www\./, "");

        if (url.pathname.length > 1) {
          url.pathname = url.pathname.replace(/\/+$/, "");
        }

        [...url.searchParams.keys()].forEach(key => {
          if (
            /^utm_/i.test(key) ||
            ["gclid", "fbclid"].includes(key.toLowerCase())
          ) {
            url.searchParams.delete(key);
          }
        });

        url.searchParams.sort();
        return url.href;
      } catch {
        return null;
      }
    }

    /* ساخت کارت نتیجه */
    function renderOneResult(result) {
      const card = document.createElement("article");
      card.className = "result";

      const heading = document.createElement("h2");
      const link = document.createElement("a");

      link.href = result.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = result.title || result.url;

      heading.appendChild(link);
      card.appendChild(heading);

      addText(card, "div", result.url, "result-url");

      if (result.content) {
        addText(card, "p", result.content);
      }

      addText(
        card,
        "span",
        `امتیاز: ${result.score} | موتورهای مؤثر: ${result.engines.join(", ")}`,
        "result-engine"
      );

      resultsBox.appendChild(card);
    }

    /* نمایش نتایج */
    function renderVisible() {
      resultsBox.replaceChildren();

      preparedResults
        .slice(0, visibleCount)
        .forEach(renderOneResult);

      if (currentWarnings.length) {
        const messages = currentWarnings.map(
          warning => `${warning.engine}: ${warning.reason}`
        );

        addText(
          resultsBox,
          "div",
          "برخی موتورهای جست‌وجو پاسخ نداده‌اند: " +
            messages.join("؛ "),
          "warning"
        );
      }

      showMoreButton.hidden =
        visibleCount >= preparedResults.length ||
        visibleCount >= MAX_RESULTS;
    }

    showMoreButton.addEventListener("click", () => {
      visibleCount = Math.min(
        visibleCount + 4,
        MAX_RESULTS,
        preparedResults.length
      );

      renderVisible();
      statusBox.textContent = "";
    });

    /* درخواست به سرویس جست‌وجو */
    async function searchEngine(query, engine) {
      const url = new URL(API);

      url.searchParams.set("q", query);
      url.searchParams.set("engines", engine);
      url.searchParams.set("format", "json");

      const response = await fetch(url.toString(), {
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      return response.json();
    }

    /* ادغام و رتبه‌بندی نتایج */
    function mergeAndRank(engineData) {
      const merged = new Map();
      let stable = 0;

      for (const engine of ENGINES) {
        const data = engineData[engine];

        if (!data) {
          continue;
        }

        const list = Array.isArray(data.results)
          ? data.results
          : [];

        list.forEach((result, index) => {
          const url = normalizedUrl(result.url);

          if (!url) {
            return;
          }

          let item = merged.get(url);

          if (!item) {
            item = {
              ...result,
              url,
              score: 0,
              engines: [],
              ranks: {},
              _stable: stable++
            };

            merged.set(url, item);
          }

          if (item.engines.includes(engine)) {
            return;
          }

          item.engines.push(engine);
          item.ranks[engine] = index + 1;

          const rank = index + 1;

          if (rank <= 5) {
            item.score += WEIGHTS[engine][rank - 1];
          }

          if (!item.title && result.title) {
            item.title = result.title;
          }

          if (!item.content && result.content) {
            item.content = result.content;
          }
        });
      }

      return [...merged.values()]
        .sort((a, b) =>
          b.score - a.score ||
          (a.ranks.duckduckgo || Infinity) -
            (b.ranks.duckduckgo || Infinity) ||
          (a.ranks.bing || Infinity) -
            (b.ranks.bing || Infinity) ||
          (a.ranks.yandex || Infinity) -
            (b.ranks.yandex || Infinity) ||
          a._stable - b._stable
        )
        .slice(0, MAX_RESULTS);
    }

    /* اجرای جست‌وجو */
    searchForm.addEventListener("submit", async event => {
      event.preventDefault();

      const query = queryInput.value.trim();

      if (!query) {
        return;
      }

      submitButton.disabled = true;
      showMoreButton.hidden = true;
      resultsBox.replaceChildren();

      wikiImage.removeAttribute("src");
      wikiImageWrap.classList.remove("visible");

      loadWikipediaImage(query);

      preparedResults = [];
      visibleCount = 0;
      currentWarnings = [];

      statusBox.textContent =
        "در حال جست‌وجو در DuckDuckGo، Bing و Yandex... " +
        "بار اول ممکن است سرویس Render کمی دیر پاسخ دهد.";

      try {
        const settled = await Promise.all(
          ENGINES.map(async engine => {
            try {
              return {
                engine,
                data: await searchEngine(query, engine)
              };
            } catch (error) {
              return {
                engine,
                error: error.message
              };
            }
          })
        );

        const engineData = {};

        for (const item of settled) {
          if (item.data) {
            engineData[item.engine] = item.data;

            for (
              const warning of
              item.data.unresponsive_engines || []
            ) {
              currentWarnings.push({
                engine: item.engine,
                reason: Array.isArray(warning)
                  ? warning.join(": ")
                  : String(warning)
              });
            }
          } else {
            currentWarnings.push({
              engine: item.engine,
              reason: item.error || "پاسخ دریافت نشد"
            });
          }
        }

        preparedResults = mergeAndRank(engineData);

        visibleCount = Math.min(
          INITIAL_LIMIT,
          preparedResults.length
        );

        statusBox.textContent = preparedResults.length
          ? ""
          : "نتیجه‌ای پیدا نشد.\nعبارت دیگری را امتحان کن.";

        renderVisible();

        if (
          !preparedResults.length &&
          currentWarnings.length
        ) {
          statusBox.textContent =
            "موتورهای جست‌وجو پاسخ ندادند. " +
            "چند لحظه صبر کن و دوباره امتحان کن.";
        }
      } catch (error) {
        console.error("Search error:", error);

        statusBox.textContent =
          "دریافت نتایج ناموفق بود. ممکن است سرویس در حال " +
          "بیدار شدن باشد یا دسترسی مرورگر مسدود شده باشد. " +
          "چند لحظه صبر کن و دوباره امتحان کن.";
      } finally {
        submitButton.disabled = false;
      }
    });

    updateThemeIcon();
  </script>
</body>
</html>

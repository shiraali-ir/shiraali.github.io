
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff2ff">
  <title>Shiraali Search</title>
  <meta name="description" content="جست‌وجوی یکپارچه Shiraali">

  <style>
    :root {
      color-scheme: light;
      --bg: #dff2ff;
      --text: #173650;
      --input: #fff;
      --border: #c5dbea;
      --button: #fff;
      --muted: #526b80;
      --accent: #1677c8;
      --card: rgba(255,255,255,.72);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b3157;
      --text: #f4f9ff;
      --input: #102f4c;
      --border: #42627e;
      --button: #163e60;
      --muted: #c0d5e7;
      --accent: #238de0;
      --card: rgba(16,47,76,.8);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
      transition: background .2s, color .2s;
    }

    .theme-icon {
      width: 25px;
      height: 25px;
      display: block;
      flex: none;
    }

    .theme {
      position: fixed;
      z-index: 9999;
      top: 8px;
      left: 8px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      color: #fff;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 27px;
      line-height: 1;
      appearance: none;
      -webkit-appearance: none;
    }

    main {
      width: 60%;
      margin: 0 auto;
      padding: clamp(75px, 12vh, 120px) 0 45px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 150px;
      height: 150px;
      max-width: 42vw;
      max-height: 42vw;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .search-form { width: 100%; }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 5px 15px 5px 5px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--input);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    #query {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      text-align: right;
    }

    #query::placeholder { color: var(--muted); }

    .submit {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    .submit:disabled {
      opacity: .55;
      cursor: wait;
    }

    #status {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    #results {
      text-align: right;
      margin-top: 18px;
      width: 100%;
    }

    .result {
      position: relative;
      width: 100%;
      margin: 0 0 14px;
      padding: 17px 18px 17px 54px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      overflow-wrap: anywhere;
    }

    .result-site-icon {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255,255,255,.8);
      padding: 2px;
    }

    /* گالری تصاویر */
    .wiki-image-wrap {
      display: none;
      width: 100%;
      margin: 18px 0 22px;
      padding: 0;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: transparent;
      overflow: hidden;
    }

    .wiki-image-wrap.visible { display: block; }

    .wiki-gallery {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: clamp(260px, 50vw, 520px);
      min-height: 260px;
      overflow: hidden;
      border-radius: inherit;
    }

    /* کارت ساعت و تقویم فقط برای جست‌وجوی مکان */
    .place-time-card {
      width: 100%;
      margin: 18px 0 14px;
      padding: 20px 18px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      color: var(--text);
      text-align: center;
      overflow-wrap: anywhere;
    }
    .place-time-card[hidden], .weather-image-wrap[hidden] { display: none; }
    .place-time-card.holiday { background: #fff0f0; border-color: #f3d4d4; color: #572626; }
    body.dark .place-time-card.holiday { background: #4a292e; border-color: #70434a; color: #fff0f0; }
    .place-clock { font-size: clamp(30px, 6vw, 48px); font-weight: 700; direction: ltr; font-variant-numeric: tabular-nums; }
    .place-date { margin-top: 5px; font-size: 14px; line-height: 1.8; }
    .place-events { margin-top: 10px; font-size: 14px; line-height: 1.9; }
    .weather-image-wrap {
      position: relative; width: 100%; min-height: 300px; margin: 0 0 14px;
      border: 1px solid var(--border); border-radius: 30px; overflow: hidden;
    }

    /* نمای تصویری آب‌وهوا در کارت مستقل، بعد از کارت ساعت */
    .weather-image-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      color: #fff;
      background: linear-gradient(145deg, #368dcc, #153b66 78%);
      text-align: center;
      overflow: hidden;
    }

    .weather-image-panel::before,
    .weather-image-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
      pointer-events: none;
    }

    .weather-image-panel::before {
      width: 280px;
      height: 280px;
      top: -115px;
      right: -65px;
    }

    .weather-image-panel::after {
      width: 220px;
      height: 220px;
      bottom: -115px;
      left: -45px;
    }

    .weather-image-icon {
      position: relative;
      z-index: 1;
      font-size: clamp(82px, 16vw, 150px);
      line-height: 1.35;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.15));
    }

    .weather-image-place {
      position: relative;
      z-index: 1;
      font-size: clamp(19px, 3vw, 27px);
      font-weight: 700;
      line-height: 1.7;
    }

    .weather-image-temperature {
      position: relative;
      z-index: 1;
      font-size: clamp(30px, 6vw, 46px);
      font-weight: 700;
      direction: ltr;
    }

    .weather-image-description {
      position: relative;
      z-index: 1;
      font-size: 16px;
      line-height: 1.8;
    }

    .weather-image-panel[hidden] { display: none; }

    .wiki-image {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center;
      margin: 0;
      border-radius: inherit;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 44px;
      height: 58px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 5px rgba(0,0,0,.65);
      appearance: none;
      -webkit-appearance: none;
    }

    .gallery-prev {
      right: 12px;
      left: auto;
    }

    .gallery-next {
      left: 12px;
      right: auto;
    }

    .gallery-arrow:hover,
    .gallery-arrow:focus,
    .gallery-arrow:active {
      background: transparent;
      box-shadow: none;
      color: #fff;
    }

    .gallery-arrow:focus-visible {
      outline: 1px solid rgba(255,255,255,.7);
      outline-offset: -5px;
    }

    .gallery-arrow:disabled {
      opacity: .35;
      cursor: default;
    }

    .gallery-arrow[hidden] { display: none; }

    .wiki-caption,
    .gallery-counter {
      display: none !important;
    }

    .result h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.7;
    }

    .result h2 a {
      color: var(--accent);
      text-decoration: none;
    }

    .result h2 a:hover { text-decoration: underline; }

    .result p {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .result-engine {
      display: inline-block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .warning {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
      text-align: right;
    }

    /* کارت هواشناسی */
    .weather-card {
      position: relative;
      width: 100%;
      margin: 0 0 14px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      text-align: right;
      overflow: hidden;
    }

    .weather-hero {
      text-align: center;
      padding: 24px 12px;
      border-radius: 22px;
      background: linear-gradient(
        135deg,
        rgba(35,141,224,.18),
        rgba(255,255,255,.08)
      );
      margin-bottom: 20px;
    }

    .weather-illustration {
      font-size: 82px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .weather-location {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.7;
    }

    .weather-temperature {
      font-size: 42px;
      font-weight: 700;
      margin: 8px 0;
      direction: ltr;
    }

    .weather-description {
      font-size: 16px;
      line-height: 1.8;
    }

    .weather-updated {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .weather-details-title {
      margin: 0 0 14px;
      font-size: 19px;
      line-height: 1.8;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .weather-metric {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 16px;
      min-width: 0;
    }

    .weather-metric-label {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .weather-metric-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }

    .weather-source {
      display: block;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .weather-source a { color: var(--accent); }

    .more {
      display: inline-block;
      margin: 15px 0 5px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--button);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .more:hover { filter: brightness(.97); }
    .more[hidden] { display: none; }

    @media (max-width: 700px) {
      main { width: 92%; }
    }

    @media (max-width: 480px) {
      main { padding-top: 100px; }
      .logo { margin-bottom: 24px; }
      .search-box { min-height: 52px; }

      .wiki-gallery {
        height: 300px;
        min-height: 240px;
      }

      .wiki-image {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: cover;
      }

      .gallery-arrow {
        width: 38px;
        height: 50px;
        font-size: 42px;
      }

      .gallery-prev {
        right: 6px;
        left: auto;
      }

      .gallery-next {
        left: 6px;
        right: auto;
      }

      .result { padding: 14px 14px 14px 48px; }

      .result-site-icon {
        top: 12px;
        left: 12px;
        width: 27px;
        height: 27px;
      }

      .result h2 { font-size: 16px; }
      .weather-card { padding: 14px; }
      .weather-illustration { font-size: 68px; }
      .weather-temperature { font-size: 36px; }
      .weather-grid { gap: 8px; }
      .weather-metric { padding: 10px; }
    }
  </style>
</head>

<body>
  <button class="theme" id="theme" type="button"
    aria-label="تغییر حالت روشن و تاریک" title="تغییر حالت روشن و تاریک">
    <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#fff" d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"/>
    </svg>
  </button>

  <main>
    <img class="logo" src="https://shiraali.ir/logo.png"
      alt="شیر با دست روی کره زمین">

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <input id="query" type="search" placeholder="جست‌وجو..."
          aria-label="عبارت جست‌وجو" autocomplete="off" required>
        <button class="submit" id="submitButton" type="submit"
          aria-label="جست‌وجو">➜</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div id="wikiImageWrap" class="wiki-image-wrap"
      aria-label="گالری تصاویر مرتبط">
      <div class="wiki-gallery">
        <button id="galleryPrev" class="gallery-arrow gallery-prev"
          type="button" aria-label="عکس قبلی" title="عکس قبلی" hidden>‹</button>

        <img id="wikiImage" class="wiki-image" alt=""
          loading="lazy" referrerpolicy="no-referrer">

        <button id="galleryNext" class="gallery-arrow gallery-next"
          type="button" aria-label="عکس بعدی" title="عکس بعدی" hidden>›</button>
      </div>
      <div id="wikiCaption" class="wiki-caption" aria-hidden="true"></div>
      <div id="galleryCounter" class="gallery-counter" aria-hidden="true"></div>
    </div>

    <section id="placeTimeCard" class="place-time-card" aria-label="ساعت محلی و مناسبت‌ها" hidden></section>
    <section id="weatherImageWrap" class="weather-image-wrap" aria-label="وضعیت آب‌وهوا" hidden></section>

    <section id="results" aria-label="نتایج جست‌وجو"></section>

    <button id="showMore" class="more" type="button" hidden>
      نمایش نتایج بیشتر
    </button>
  </main>

<script>
  const API = "https://shiraali-search.onrender.com/search";

  const INITIAL_LIMIT = 5;
  const MAX_RESULTS = 11;
  const ENGINES = ["duckduckgo", "bing", "yandex"];

  const WEIGHTS = {
    duckduckgo: [5, 5, 4, 4, 4],
    bing: [5, 3, 3, 2, 1],
    yandex: [1, 1, 1, 1, 1]
  };

  const SITE_ALIASES = [
    { domain: "x.com", names: ["twitter", "توییتر", "تویتر", "x.com"] },
    { domain: "youtube.com", names: ["youtube", "یوتیوب", "youtube.com"] },
    { domain: "instagram.com", names: ["instagram", "اینستاگرام", "instagram.com"] },
    { domain: "t.me", names: ["telegram", "تلگرام", "t.me"] },
    { domain: "wikipedia.org", names: ["wikipedia", "ویکی‌پدیا", "ویکی پدیا", "wikipedia.org"] },
    { domain: "facebook.com", names: ["facebook", "فیسبوک", "فیس‌بوک"] },
    { domain: "reddit.com", names: ["reddit", "ردیت"] },
    { domain: "github.com", names: ["github", "گیت‌هاب", "گیت هاب"] },
    { domain: "linkedin.com", names: ["linkedin", "لینکدین"] },
    { domain: "tiktok.com", names: ["tiktok", "تیک‌تاک", "تیک تاک"] },
    { domain: "aparat.com", names: ["aparat", "آپارات"] }
  ];

  const themeButton = document.getElementById("theme");
  const searchForm = document.getElementById("searchForm");
  const queryInput = document.getElementById("query");
  const submitButton = document.getElementById("submitButton");
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const showMoreButton = document.getElementById("showMore");

  const wikiImageWrap = document.getElementById("wikiImageWrap");
  const wikiImage = document.getElementById("wikiImage");
  const wikiCaption = document.getElementById("wikiCaption");
  const galleryPrev = document.getElementById("galleryPrev");
  const galleryNext = document.getElementById("galleryNext");
  const galleryCounter = document.getElementById("galleryCounter");
  const placeTimeCard = document.getElementById("placeTimeCard");
  const weatherImageWrap = document.getElementById("weatherImageWrap");

  let preparedResults = [];
  let visibleCount = 0;
  let currentWarnings = [];
  let weatherData = null;
  let placeClockData = null;
  let placeClockTimer = null;
  let searchSequence = 0;
  let galleryImages = [];
  let galleryIndex = 0;

  const KNOWN_PLACES = {
    "تهران": { name: "تهران", latitude: 35.6892, longitude: 51.3890, country: "ایران" },
    "tehran": { name: "Tehran", latitude: 35.6892, longitude: 51.3890, country: "Iran" },
    "لندن": { name: "لندن", latitude: 51.5072, longitude: -0.1276, country: "بریتانیا" },
    "london": { name: "London", latitude: 51.5072, longitude: -0.1276, country: "United Kingdom" },
    "ایران": { name: "ایران — محدودهٔ مرکزی", latitude: 32.4279, longitude: 53.6880, country: "ایران" },
    "iran": { name: "Iran — Central Region", latitude: 32.4279, longitude: 53.6880, country: "Iran" },
    "ژاپن": { name: "ژاپن — محدودهٔ مرکزی", latitude: 36.2048, longitude: 138.2529, country: "ژاپن" },
    "japan": { name: "Japan — Central Region", latitude: 36.2048, longitude: 138.2529, country: "Japan" },
    "توکیو": { name: "توکیو", latitude: 35.6762, longitude: 139.6503, country: "ژاپن" },
    "tokyo": { name: "Tokyo", latitude: 35.6762, longitude: 139.6503, country: "Japan" },
    "نیویورک": { name: "نیویورک", latitude: 40.7128, longitude: -74.0060, country: "آمریکا" },
    "new york": { name: "New York", latitude: 40.7128, longitude: -74.0060, country: "United States" },
    "پاریس": { name: "پاریس", latitude: 48.8566, longitude: 2.3522, country: "فرانسه" },
    "paris": { name: "Paris", latitude: 48.8566, longitude: 2.3522, country: "France" }
  };

  function normalizePlaceName(value) {
    return String(value || "").trim().toLocaleLowerCase()
      .replace(/[يى]/g, "ی")
      .replace(/ك/g, "ک")
      .replace(/‌/g, " ")
      .replace(/\s+/g, " ");
  }

  themeButton.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const dark = document.body.classList.contains("dark");

    themeButton.innerHTML = dark
      ? `<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="#fff"/>
          <g stroke="#fff" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v2.2M12 19.8V22"/>
            <path d="M4.93 4.93l1.55 1.55M17.52 17.52l1.55 1.55"/>
            <path d="M2 12h2.2M19.8 12H22"/>
            <path d="M4.93 19.07l1.55-1.55M17.52 6.48l1.55-1.55"/>
          </g>
        </svg>`
      : `<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#fff" d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"/>
        </svg>`;

    document.querySelector('meta[name="theme-color"]')
      .setAttribute("content", dark ? "#0b3157" : "#dff2ff");
  });

  function resetGallery() {
    galleryImages = [];
    galleryIndex = 0;
    wikiImage.onerror = null;
    wikiImage.removeAttribute("src");
    wikiImage.alt = "";
    wikiCaption.textContent = "";
    galleryCounter.textContent = "";
    galleryPrev.hidden = true;
    galleryNext.hidden = true;
    wikiImageWrap.classList.remove("visible");
  }

  function showGalleryImage() {
    if (!galleryImages.length) {
      resetGallery();
      return;
    }

    const item = galleryImages[galleryIndex];

    wikiImage.onerror = () => {
      item.failed = true;
      const nextImages = galleryImages.filter(image => !image.failed);
      renderGallery(nextImages);
    };

    wikiImage.src = item.src;
    wikiImage.alt = "تصویر مرتبط با جست‌وجو";

    wikiCaption.textContent = "";
    galleryCounter.textContent = "";

    wikiImageWrap.classList.add("visible");
    galleryPrev.hidden = galleryImages.length < 2;
    galleryNext.hidden = galleryImages.length < 2;
  }

  function renderGallery(images) {
    galleryImages = images.slice(0, 11);
    galleryIndex = 0;

    if (!galleryImages.length) {
      resetGallery();
      return;
    }

    showGalleryImage();
  }

  galleryPrev.addEventListener("click", () => {
    if (galleryImages.length < 2) return;

    galleryIndex =
      (galleryIndex - 1 + galleryImages.length) % galleryImages.length;

    showGalleryImage();
  });

  galleryNext.addEventListener("click", () => {
    if (galleryImages.length < 2) return;

    galleryIndex = (galleryIndex + 1) % galleryImages.length;

    showGalleryImage();
  });

  async function loadWikipediaImage(query, sequence) {
    for (const lang of ["fa", "en"]) {
      if (sequence !== searchSequence) return null;

      try {
        const api = new URL(`https://${lang}.wikipedia.org/w/api.php`);
        api.searchParams.set("action", "query");
        api.searchParams.set("generator", "search");
        api.searchParams.set("gsrsearch", query);
        api.searchParams.set("gsrnamespace", "0");
        api.searchParams.set("gsrlimit", "10");
        api.searchParams.set("prop", "pageimages");
        api.searchParams.set("piprop", "thumbnail");
        api.searchParams.set("pithumbsize", "900");
        api.searchParams.set("format", "json");
        api.searchParams.set("origin", "*");

        const response = await fetch(api.toString());
        if (!response.ok) continue;

        const data = await response.json();
        if (sequence !== searchSequence) return null;

        const pages = Object.values(data.query?.pages || {});
        const page = pages.find(item => item.thumbnail?.source);

        if (page?.thumbnail?.source) {
          return {
            src: page.thumbnail.source,
            title: page.title || query,
            source: "ویکی‌پدیا",
            score: 100000,
            rank: 0
          };
        }
      } catch (error) {
        console.warn(`Wikipedia image lookup (${lang}) failed:`, error);
      }
    }

    return null;
  }

  function extractImageUrl(result) {
    const candidates = [
      result.img_src,
      result.image,
      result.image_url,
      result.thumbnail,
      result.thumbnail_src,
      result.thumbnail_url
    ];

    for (const candidate of candidates) {
      if (typeof candidate !== "string") continue;

      try {
        const url = new URL(candidate);
        if (["http:", "https:"].includes(url.protocol)) return url.href;
      } catch {}
    }

    return null;
  }

  /*
   * مرحلهٔ تصاویر:
   * این تابع فقط پس از پایان مرحلهٔ نتایج متنی اجرا می‌شود.
   * تصاویر سه موتور در همین مرحله می‌توانند هم‌زمان دریافت شوند.
   */
  async function collectImageResults(query, sequence, wikiImageResult) {
    /* وقتی آب‌وهوا شناسایی شده، کادر ۲ برای تصویر وضعیت هوا محفوظ می‌ماند. */
    if (weatherData) {
      renderWeatherImage(weatherData);
      return;
    }

    const imageGroups = await Promise.all(
      ENGINES.map(async engine => {
        try {
          const data = await searchEngine(query, engine, "images");

          if (sequence !== searchSequence) return [];

          const list = Array.isArray(data.results) ? data.results : [];

          return list.map((result, index) => {
            const src = extractImageUrl(result);
            if (!src) return null;

            const weight = WEIGHTS[engine] || [];

            return {
              src,
              title: result.title || result.alt || query,
              source: engine,
              score: (weight[index] || 0) + (index < 5 ? 2 : 0),
              rank: index + 1
            };
          }).filter(Boolean);
        } catch (error) {
          console.warn(`Image search failed (${engine}):`, error);
          return [];
        }
      })
    );

    if (sequence !== searchSequence) return;

    const uniqueImages = new Map();

    for (const image of imageGroups.flat()) {
      let key = image.src;

      try {
        const parsed = new URL(image.src);
        parsed.hash = "";
        key = parsed.href;
      } catch {}

      const existing = uniqueImages.get(key);

      if (!existing) {
        uniqueImages.set(key, { ...image });
      } else {
        existing.score += image.score;

        if (!existing.source.split(", ").includes(image.source)) {
          existing.source += `, ${image.source}`;
        }
      }
    }

    const rankedImages = [...uniqueImages.values()].sort((a, b) =>
      b.score - a.score || a.rank - b.rank
    );

    const finalImages = [];

    /* اگر ویکی‌پدیا تصویر داشت، آن تصویر همیشه اول است. */
    if (wikiImageResult?.src) {
      finalImages.push(wikiImageResult);
    }

    /* حداکثر ۱۱ تصویر با ویکی‌پدیا، یا ۱۰ تصویر بدون آن. */
    const maxGalleryImages = wikiImageResult?.src ? 11 : 10;

    for (const image of rankedImages) {
      if (finalImages.length >= maxGalleryImages) break;

      const duplicate = finalImages.some(item => {
        try {
          const first = new URL(item.src);
          const second = new URL(image.src);

          first.hash = "";
          second.hash = "";

          return first.href === second.href;
        } catch {
          return item.src === image.src;
        }
      });

      if (!duplicate) finalImages.push(image);
    }

    renderGallery(finalImages);
  }

  function addText(parent, tag, text, className) {
    const el = document.createElement(tag);
    el.textContent = text == null ? "" : String(text);

    if (className) el.className = className;

    parent.appendChild(el);
    return el;
  }

  function normalizedUrl(raw) {
    try {
      const u = new URL(raw);

      if (!["http:", "https:"].includes(u.protocol)) return null;

      u.hash = "";
      u.hostname = u.hostname.toLowerCase().replace(/^www\./, "");

      if (u.pathname.length > 1) {
        u.pathname = u.pathname.replace(/\/+$/, "");
      }

      [...u.searchParams.keys()].forEach(k => {
        if (/^utm_/i.test(k) ||
            ["gclid", "fbclid"].includes(k.toLowerCase())) {
          u.searchParams.delete(k);
        }
      });

      u.searchParams.sort();
      return u.href;
    } catch {
      return null;
    }
  }

  function hostOf(raw) {
    try {
      return new URL(raw).hostname.toLowerCase().replace(/^www\./, "");
    } catch {
      return "";
    }
  }

  function createSiteIcon(url) {
    const host = hostOf(url);
    if (!host) return null;

    const icon = document.createElement("img");
    icon.className = "result-site-icon";
    icon.alt = "";
    icon.setAttribute("aria-hidden", "true");
    icon.loading = "lazy";
    icon.referrerPolicy = "no-referrer";
    icon.src = "https://www.google.com/s2/favicons?domain=" +
      encodeURIComponent(host) + "&sz=64";

    icon.onerror = function () {
      if (this.dataset.fallbackTried !== "yes") {
        this.dataset.fallbackTried = "yes";
        this.src = "https://icons.duckduckgo.com/ip3/" +
          encodeURIComponent(host) + ".ico";
      } else {
        this.style.display = "none";
      }
    };

    return icon;
  }

  function detectTarget(input) {
    let remaining = input.trim();
    let directUrl = null;
    let domain = null;

    const urlMatch = remaining.match(
      /(?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?/i
    );

    if (urlMatch) {
      const candidate = urlMatch[0].replace(/[),؛،.!?]+$/, "");
      const normalizedCandidate = /^https?:\/\//i.test(candidate)
        ? candidate : "https://" + candidate;

      try {
        const parsed = new URL(normalizedCandidate);

        if (parsed.hostname.includes(".")) {
          directUrl = parsed.href;
          domain = parsed.hostname.toLowerCase().replace(/^www\./, "");
          remaining = remaining.replace(urlMatch[0], " ").trim();
        }
      } catch {}
    }

    if (!domain) {
      for (const site of SITE_ALIASES) {
        const aliases = [...site.names].sort((a, b) => b.length - a.length);

        for (const alias of aliases) {
          const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const pattern = new RegExp(
            `(^|\\s)${escaped}(?=$|\\s|[.,،؛])`, "i"
          );

          if (pattern.test(remaining)) {
            domain = site.domain;
            remaining = remaining.replace(pattern, " ").trim();
            break;
          }
        }

        if (domain) break;
      }
    }

    remaining = remaining.replace(/\s+/g, " ")
      .replace(/^[\s،,؛:]+|[\s،,؛:]+$/g, "").trim();

    if (!remaining && directUrl) {
      try {
        const path = new URL(directUrl).pathname.split("/").filter(Boolean).pop();

        if (path) {
          remaining = decodeURIComponent(path).replace(/[-_]/g, " ");
        }
      } catch {}
    }

    return { domain, query: remaining || input.trim(), directUrl };
  }

  /*
   * شناسایی مکان:
   * عبارت‌های آب‌وهوا و نام دقیق مکان پشتیبانی می‌شوند.
   * عبارت‌های عادی مانند «تاریخ ایران» نباید کارت هواشناسی بسازند.
   */
  function getWeatherPlaceQuery(query) {
    let value = normalizePlaceName(query);

    const prefixes = [
      /^وضعیت\s+آب\s+و\s+هوای\s+/,
      /^وضعیت\s+هوای\s+/,
      /^پیش\s+بینی\s+آب\s+و\s+هوای\s+/,
      /^پیش\s+بینی\s+هوای\s+/,
      /^آب\s+و\s+هوای\s+/,
      /^آب\s+و\s+هوا\s+/,
      /^هواشناسی\s+/,
      /^هوای\s+/,
      /^weather\s+forecast\s+for\s+/i,
      /^weather\s+in\s+/i,
      /^weather\s+for\s+/i,
      /^forecast\s+for\s+/i,
      /^forecast\s+in\s+/i,
      /^weather\s+/i
    ];

    for (const prefix of prefixes) {
      if (prefix.test(value)) {
        value = value.replace(prefix, "").trim();
        break;
      }
    }

    value = value
      .replace(/\s+(آب\s+و\s+هوا|هواشناسی|weather|forecast)$/i, "")
      .replace(/\s+(امروز|فردا|اکنون|الان|today|tomorrow|now)$/i, "")
      .trim();

    return value;
  }

  async function findWeatherPlace(query) {
    const placeQuery = getWeatherPlaceQuery(query);
    if (!placeQuery) return null;

    /* مکان‌های شناخته‌شده فقط با تطبیق کامل پذیرفته می‌شوند. */
    if (KNOWN_PLACES[placeQuery]) return KNOWN_PLACES[placeQuery];

    if (
      placeQuery.length > 45 ||
      placeQuery.split(" ").length > 4 ||
      /https?:|www\.|site:|twitter|youtube|instagram|telegram|تلگرام|توییتر|اینستاگرام/i.test(placeQuery)
    ) {
      return null;
    }

    for (const language of ["fa", "en"]) {
      try {
        const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
        url.searchParams.set("name", placeQuery);
        url.searchParams.set("count", "10");
        url.searchParams.set("language", language);
        url.searchParams.set("format", "json");

        const response = await fetch(url.toString());
        if (!response.ok) continue;

        const data = await response.json();
        const places = data.results || [];
        const queryNorm = normalizePlaceName(placeQuery);

        /* نام مکان باید دقیقاً با عبارت جست‌وجوشده برابر باشد. */
        const place = places.find(item =>
          normalizePlaceName(item.name || "") === queryNorm
        );

        if (!place) continue;

        if (!Number.isFinite(place.latitude) ||
            !Number.isFinite(place.longitude)) {
          continue;
        }

        return {
          name: place.name,
          latitude: place.latitude,
          longitude: place.longitude,
          country: place.country || "",
          countryCode: place.country_code || "",
          admin1: place.admin1 || "",
          timezone: place.timezone || ""
        };
      } catch (error) {
        console.warn("Weather location lookup failed:", error);
      }
    }

    return null;
  }

  async function fetchWeather(place) {
    const url = new URL("https://api.open-meteo.com/v1/forecast");

    url.searchParams.set("latitude", place.latitude);
    url.searchParams.set("longitude", place.longitude);

    url.searchParams.set("current", [
      "temperature_2m", "relative_humidity_2m", "apparent_temperature",
      "is_day", "precipitation", "rain", "showers", "snowfall",
      "weather_code", "cloud_cover", "wind_speed_10m", "wind_direction_10m"
    ].join(","));

    url.searchParams.set("daily", [
      "weather_code", "temperature_2m_max", "temperature_2m_min",
      "precipitation_probability_max", "sunrise", "sunset"
    ].join(","));

    url.searchParams.set("forecast_days", "1");
    url.searchParams.set("timezone", "auto");

    const response = await fetch(url.toString());

    if (!response.ok) {
      throw new Error("سرویس هواشناسی پاسخ نداد.");
    }

    const data = await response.json();

    if (!data.current) {
      throw new Error("اطلاعات فعلی هوا در دسترس نیست.");
    }

    return { ...data, place };
  }

  function weatherCodeInfo(code, isDay = true) {
    if (code === 0) return { text: "آسمان صاف", icon: isDay ? "☀️" : "🌙" };
    if ([1, 2].includes(code)) return { text: "کمی تا نیمه‌ابری", icon: isDay ? "🌤️" : "☁️" };
    if (code === 3) return { text: "ابری", icon: "☁️" };
    if ([45, 48].includes(code)) return { text: "مه‌آلود", icon: "🌫️" };
    if ([51, 53, 55, 56, 57].includes(code)) return { text: "نم‌نم باران یا باران ریز", icon: "🌦️" };
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: "بارانی", icon: "🌧️" };
    if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: "برفی", icon: "🌨️" };
    if ([95, 96, 99].includes(code)) return { text: "رعدوبرق و احتمال طوفان", icon: "⛈️" };

    return { text: "وضعیت هوا نامشخص", icon: "🌍" };
  }

  function formatNumber(value, suffix = "") {
    if (value === null || value === undefined ||
        !Number.isFinite(Number(value))) {
      return "اطلاعات موجود نیست";
    }

    return `${value}${suffix}`;
  }

  function weatherMetric(label, value) {
    const item = document.createElement("div");
    item.className = "weather-metric";

    addText(item, "div", label, "weather-metric-label");
    addText(item, "div", value, "weather-metric-value");

    return item;
  }

  /* کادر آب‌وهوا مستقل است تا کارت ساعت/تقویم در جایگاه دوم بماند. */
  function renderWeatherImage(data) {
    if (!data?.current) return;

    const current = data.current;
    const place = data.place;
    const info = weatherCodeInfo(current.weather_code, current.is_day === 1);
    let panel = document.getElementById("weatherImagePanel");
    if (!panel) {
      panel = document.createElement("div");
      panel.id = "weatherImagePanel";
      panel.className = "weather-image-panel";
      panel.setAttribute("role", "img");
      panel.setAttribute("aria-label", "تصویر وضعیت آب‌وهوا");
      weatherImageWrap.replaceChildren(panel);
    }
    panel.replaceChildren();
    panel.hidden = false;
    addText(panel, "div", info.icon, "weather-image-icon");
    addText(panel, "div", `${place.name}${place.country ? "، " + place.country : ""}`, "weather-image-place");
    addText(panel, "div", `${Math.round(current.temperature_2m)}°C`, "weather-image-temperature");
    addText(panel, "div", info.text, "weather-image-description");
    weatherImageWrap.hidden = false;
  }

  function clearPlaceCards() {
    placeTimeCard.hidden = true;
    placeTimeCard.replaceChildren();
    placeTimeCard.classList.remove("holiday");
    weatherImageWrap.hidden = true;
    weatherImageWrap.replaceChildren();
    placeClockData = null;
    if (placeClockTimer) clearInterval(placeClockTimer);
    placeClockTimer = null;
  }

  async function resolveClockPlace(query, weatherPlace) {
    const raw = getWeatherPlaceQuery(query);
    const normalized = normalizePlaceName(raw);
    let capitalName = "";
    let countryCode = weatherPlace?.countryCode || "";
    let countryName = weatherPlace?.country || "";
    if (!countryCode) {
      const countryCodes = { "ایران": "IR", "iran": "IR", "بریتانیا": "GB", "united kingdom": "GB", "ژاپن": "JP", "japan": "JP", "آمریکا": "US", "united states": "US", "فرانسه": "FR", "france": "FR" };
      countryCode = countryCodes[normalizePlaceName(countryName)] || "";
    }

    /* برای نام کشور، ساعت از پایتخت گرفته می‌شود. */
    try {
      const countryUrl = new URL(`https://restcountries.com/v3.1/name/${encodeURIComponent(raw)}`);
      countryUrl.searchParams.set("fields", "name,capital,cca2,translations");
      const response = await fetch(countryUrl.toString());
      if (response.ok) {
        const countries = await response.json();
        const country = countries.find(item => {
          const names = [item.name?.common, item.name?.official, item.translations?.fas?.common, item.translations?.ara?.common];
          return names.some(name => normalizePlaceName(name || "") === normalized);
        });
        if (country?.capital?.[0]) {
          capitalName = country.capital[0];
          countryCode = country.cca2 || countryCode;
          countryName = country.name?.common || countryName;
        }
      }
    } catch (error) { console.warn("Country/capital lookup failed:", error); }

    let clockPlace = weatherPlace;
    if (capitalName) {
      try {
        const geo = new URL("https://geocoding-api.open-meteo.com/v1/search");
        geo.searchParams.set("name", capitalName);
        geo.searchParams.set("count", "10");
        geo.searchParams.set("language", "en");
        geo.searchParams.set("format", "json");
        const response = await fetch(geo.toString());
        const data = response.ok ? await response.json() : {};
        const capital = (data.results || []).find(item =>
          normalizePlaceName(item.name || "") === normalizePlaceName(capitalName) &&
          (!countryCode || item.country_code === countryCode)
        ) || (data.results || [])[0];
        if (capital) clockPlace = { ...capital, name: capital.name, country: countryName, countryCode, latitude: capital.latitude, longitude: capital.longitude };
      } catch (error) { console.warn("Capital timezone lookup failed:", error); }
    }

    if (!clockPlace?.latitude || !clockPlace?.longitude) return null;
    try {
      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude", clockPlace.latitude);
      url.searchParams.set("longitude", clockPlace.longitude);
      url.searchParams.set("current", "temperature_2m");
      url.searchParams.set("timezone", "auto");
      const response = await fetch(url.toString());
      const data = response.ok ? await response.json() : {};
      return {
        timezone: data.timezone || clockPlace.timezone || weatherData?.timezone || "UTC",
        countryCode, countryName, admin1: clockPlace.admin1 || weatherPlace?.admin1 || "",
        latitude: clockPlace.latitude, longitude: clockPlace.longitude
      };
    } catch (error) {
      console.warn("Local clock lookup failed:", error);
      return null;
    }
  }

  async function getLocalHolidayNames(clockData) {
    if (!clockData?.countryCode) return [];
    try {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-CA", { timeZone: clockData.timezone, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(now);
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      const year = values.year;
      const date = `${values.year}-${values.month}-${values.day}`;
      const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${encodeURIComponent(clockData.countryCode)}`);
      if (!response.ok) return [];
      const holidays = await response.json();
      return holidays.filter(item => item.date === date && (!item.counties || !item.counties.length || !clockData.admin1 || item.counties.some(region => normalizePlaceName(region).includes(normalizePlaceName(clockData.admin1)) || normalizePlaceName(clockData.admin1).includes(normalizePlaceName(region.split("-").pop())))))
        .map(item => item.localName || item.name).filter(Boolean);
    } catch (error) {
      console.warn("Holiday lookup failed:", error);
      return [];
    }
  }

  async function renderPlaceTimeCard(query, weatherPlace, sequence) {
    clearPlaceCards();
    if (!weatherPlace) return;
    const clockData = await resolveClockPlace(query, weatherPlace);
    if (sequence !== searchSequence || !clockData) return;
    placeClockData = clockData;
    const eventNames = await getLocalHolidayNames(clockData);
    if (sequence !== searchSequence) return;

    const nowInPlace = () => new Date(new Date().toLocaleString("en-US", { timeZone: clockData.timezone }));
    const updateClock = () => {
      const now = nowInPlace();
      const timeText = new Intl.DateTimeFormat("en-GB", { timeZone: clockData.timezone, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(new Date());
      const dateText = new Intl.DateTimeFormat("fa-IR-u-ca-persian", { timeZone: clockData.timezone, weekday: "long", year: "numeric", month: "long", day: "numeric" }).format(new Date());
      const weekend = [0, 6].includes(now.getDay());
      placeTimeCard.classList.toggle("holiday", weekend || eventNames.length > 0);
      placeTimeCard.replaceChildren();
      addText(placeTimeCard, "div", timeText, "place-clock");
      addText(placeTimeCard, "div", dateText, "place-date");
      if (eventNames.length) addText(placeTimeCard, "div", [...new Set(eventNames)].join("، "), "place-events");
      placeTimeCard.hidden = false;
    };
    updateClock();
    placeClockTimer = setInterval(updateClock, 1000);
  }

  function renderWeatherCards(data) {
    if (!data?.current) return;

    const current = data.current;
    const daily = data.daily || {};
    const place = data.place;
    const high = daily.temperature_2m_max?.[0];
    const low = daily.temperature_2m_min?.[0];
    const sunrise = daily.sunrise?.[0];
    const sunset = daily.sunset?.[0];
    const rainChance = daily.precipitation_probability_max?.[0];

    const card = document.createElement("article");
    card.className = "weather-card";

    addText(
      card,
      "h2",
      `جزئیات وضعیت آب‌وهوا در ${place.name}`,
      "weather-details-title"
    );

    const grid = document.createElement("div");
    grid.className = "weather-grid";

    grid.appendChild(weatherMetric("🌡️ دمای فعلی", formatNumber(Math.round(current.temperature_2m), "°C")));
    grid.appendChild(weatherMetric("🤔 دمای احساس‌شده", formatNumber(Math.round(current.apparent_temperature), "°C")));
    grid.appendChild(weatherMetric("💧 رطوبت نسبی", formatNumber(current.relative_humidity_2m, "%")));
    grid.appendChild(weatherMetric("💨 سرعت باد", formatNumber(current.wind_speed_10m, " کیلومتر بر ساعت")));
    grid.appendChild(weatherMetric("☁️ پوشش ابر", formatNumber(current.cloud_cover, "%")));
    grid.appendChild(weatherMetric("🌧️ بارش فعلی", formatNumber(current.precipitation, " میلی‌متر")));
    grid.appendChild(weatherMetric(
      "🌂 احتمال بارش امروز",
      rainChance == null ? "اطلاعات موجود نیست" : `${rainChance}%`
    ));
    grid.appendChild(weatherMetric("🧭 جهت باد", formatNumber(current.wind_direction_10m, " درجه")));
    grid.appendChild(weatherMetric("🌅 طلوع خورشید", sunrise ? sunrise.split("T").pop() : "اطلاعات موجود نیست"));
    grid.appendChild(weatherMetric("🌇 غروب خورشید", sunset ? sunset.split("T").pop() : "اطلاعات موجود نیست"));
    grid.appendChild(weatherMetric("🌡️ بیشینه دمای امروز", formatNumber(high, "°C")));
    grid.appendChild(weatherMetric("🌡️ کمینه دمای امروز", formatNumber(low, "°C")));

    card.appendChild(grid);

    const source = document.createElement("span");
    source.className = "weather-source";
    source.append("منبع داده‌های هواشناسی: ");

    const sourceLink = document.createElement("a");
    sourceLink.href = "https://open-meteo.com/";
    sourceLink.target = "_blank";
    sourceLink.rel = "noopener noreferrer";
    sourceLink.textContent = "Open-Meteo";

    source.appendChild(sourceLink);
    card.appendChild(source);
    resultsBox.appendChild(card);
  }

  async function searchEngine(query, engine, category = null) {
    const u = new URL(API);

    u.searchParams.set("q", query);
    u.searchParams.set("engines", engine);
    u.searchParams.set("format", "json");

    if (category) {
      u.searchParams.set("categories", category);
    }

    const res = await fetch(u.toString(), {
      headers: { Accept: "application/json" }
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    return res.json();
  }

  function mergeAndRank(groups, directUrl) {
    const merged = new Map();
    let stable = 0;

    for (const group of groups) {
      if (!group.data) continue;

      const list = Array.isArray(group.data.results)
        ? group.data.results
        : [];

      list.forEach((r, index) => {
        const url = normalizedUrl(r.url);
        if (!url) return;

        let item = merged.get(url);

        if (!item) {
          item = {
            ...r,
            url,
            title: typeof r.title === "string" ? r.title.trim() : "",
            content: r.content || "",
            score: 0,
            engines: [],
            ranks: {},
            priority: group.priority,
            _stable: stable++
          };

          merged.set(url, item);
        } else {
          item.priority = Math.max(item.priority, group.priority);
        }

        if (!item.engines.includes(group.engine)) {
          item.engines.push(group.engine);
          item.ranks[group.engine] = index + 1;

          const rank = index + 1;
          if (rank <= 5) {
            item.score += WEIGHTS[group.engine][rank - 1];
          }
        }

        if (!item.title && r.title) {
          item.title = String(r.title).trim();
        }

        if (!item.content && r.content) {
          item.content = r.content;
        }
      });
    }

    if (directUrl) {
      const url = normalizedUrl(directUrl);

      if (url && !merged.has(url)) {
        merged.set(url, {
          url,
          title: "",
          content: "",
          score: 0,
          engines: ["آدرس مستقیم"],
          ranks: {},
          priority: 3,
          _stable: -1
        });
      } else if (url && merged.has(url)) {
        merged.get(url).priority = 3;
      }
    }

    return [...merged.values()]
      .sort((a, b) =>
        b.priority - a.priority ||
        b.score - a.score ||
        (a.ranks.duckduckgo || Infinity) - (b.ranks.duckduckgo || Infinity) ||
        (a.ranks.bing || Infinity) - (b.ranks.bing || Infinity) ||
        (a.ranks.yandex || Infinity) - (b.ranks.yandex || Infinity) ||
        a._stable - b._stable
      )
      .slice(0, MAX_RESULTS);
  }

  function renderOneResult(r) {
    const card = document.createElement("article");
    card.className = "result";

    const siteIcon = createSiteIcon(r.url);
    if (siteIcon) card.appendChild(siteIcon);

    const heading = document.createElement("h2");
    const link = document.createElement("a");

    link.href = r.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.textContent =
      (typeof r.title === "string" ? r.title.trim() : "") || r.url;

    heading.appendChild(link);
    card.appendChild(heading);

    if (r.content) {
      addText(card, "p", r.content);
    }

    addText(
      card,
      "span",
      `امتیاز: ${r.score} | منابع: ${r.engines.join(", ")}`,
      "result-engine"
    );

    resultsBox.appendChild(card);
  }

  function renderVisible() {
    resultsBox.replaceChildren();

    /*
     * گالری در HTML بالاتر از این بخش قرار دارد.
     * کارت هواشناسی در ابتدای نتایج و پیش از نتایج متنی نمایش داده می‌شود.
     */
    if (weatherData) {
      renderWeatherImage(weatherData);
      renderWeatherCards(weatherData);
    }

    preparedResults.slice(0, visibleCount).forEach(renderOneResult);

    if (currentWarnings.length) {
      const messages = currentWarnings.map(
        item => `${item.engine}: ${item.reason}`
      );

      addText(
        resultsBox,
        "div",
        "برخی جست‌وجوها پاسخ نداده‌اند: " + messages.join("؛ "),
        "warning"
      );
    }

    showMoreButton.hidden =
      visibleCount >= preparedResults.length ||
      visibleCount >= MAX_RESULTS;
  }

  showMoreButton.addEventListener("click", () => {
    visibleCount = Math.min(
      visibleCount + 6,
      MAX_RESULTS,
      preparedResults.length
    );

    renderVisible();
    statusBox.textContent = "";
  });

  /*
   * اجرای ترتیبی کل جست‌وجو:
   *
   * ۱. تصویر ویکی‌پدیا
   * ۲. شناسایی مکان و دریافت هواشناسی
   * ۳. نمایش کارت هواشناسی و جزئیات آن
   * ۴. دریافت و نمایش نتایج متنی
   * ۵. دریافت تصاویر سه موتور و تکمیل گالری
   *
   * هیچ مرحله‌ای قبل از پایان مرحلهٔ قبلی آغاز نمی‌شود.
   */
  searchForm.addEventListener("submit", async event => {
    event.preventDefault();

    const originalQuery = queryInput.value.trim();
    if (!originalQuery) return;

    const thisSearch = ++searchSequence;
    const target = detectTarget(originalQuery);
    const searchQuery = target.query;
    const domain = target.domain;

    submitButton.disabled = true;
    showMoreButton.hidden = true;
    resultsBox.replaceChildren();

    preparedResults = [];
    visibleCount = 0;
    currentWarnings = [];
    weatherData = null;
    clearPlaceCards();

    resetGallery();

    try {
      /*
       * مرحلهٔ اول: فقط ویکی‌پدیا.
       * تا پایان این مرحله، هیچ درخواست هواشناسی،
       * متنی یا تصویری از موتورهای دیگر آغاز نمی‌شود.
       */
      statusBox.textContent = "مرحلهٔ ۱ از ۵: در حال جست‌وجوی تصویر ویکی‌پدیا...";

      const wikiImageResult = await loadWikipediaImage(
        searchQuery,
        thisSearch
      );

      if (thisSearch !== searchSequence) return;

      if (wikiImageResult?.src) {
        renderGallery([wikiImageResult]);
      }

      /*
       * مرحلهٔ دوم: شناسایی مکان و دریافت داده‌های هواشناسی.
       * این مرحله فقط برای جست‌وجوهای مرتبط با مکان اجرا می‌شود.
       */
      statusBox.textContent = "مرحلهٔ ۲ از ۵: در حال بررسی ارتباط عبارت با مکان...";

      if (!domain && !target.directUrl) {
        try {
          const weatherPlace = await findWeatherPlace(originalQuery);

          if (thisSearch !== searchSequence) return;

          if (weatherPlace) {
            statusBox.textContent =
              `مرحلهٔ ۲ از ۵: در حال دریافت آب‌وهوای ${weatherPlace.name}...`;

            const data = await fetchWeather(weatherPlace);

            if (thisSearch !== searchSequence) return;

            weatherData = data;
            await renderPlaceTimeCard(originalQuery, weatherPlace, thisSearch);
          }
        } catch (error) {
          console.warn("Weather request failed:", error);
          weatherData = null;
        }
      }

      if (thisSearch !== searchSequence) return;

      /*
       * مرحلهٔ سوم: نمایش کارت هواشناسی و جزئیات آن.
       * اگر مکان شناسایی نشود، این بخش بدون کارت ادامه می‌یابد.
       */
      statusBox.textContent = "مرحلهٔ ۳ از ۵: در حال آماده‌سازی اطلاعات هواشناسی...";

      renderVisible();

      /*
       * مرحلهٔ چهارم: دریافت نتایج متنی.
       * موتورهای متنی در مرحلهٔ خودشان به‌صورت موازی اجرا می‌شوند.
       * جست‌وجوی تصاویر هنوز آغاز نشده است.
       */
      const groups = [];

      if (domain) {
        statusBox.textContent =
          `مرحلهٔ ۴ از ۵: در حال جست‌وجو در ${domain}...`;

        const siteQuery = `site:${domain} ${searchQuery}`.trim();

        const siteSettled = await Promise.all(
          ENGINES.map(async engine => {
            try {
              return {
                engine,
                data: await searchEngine(siteQuery, engine)
              };
            } catch (error) {
              return { engine, error };
            }
          })
        );

        if (thisSearch !== searchSequence) return;

        for (const item of siteSettled) {
          if (!item.data) {
            currentWarnings.push({
              engine: `${item.engine} (جست‌وجوی سایت)`,
              reason: item.error?.message || "پاسخ دریافت نشد"
            });

            continue;
          }

          groups.push({
            engine: item.engine,
            data: item.data,
            priority: 2
          });

          for (const warning of item.data.unresponsive_engines || []) {
            currentWarnings.push({
              engine: item.engine,
              reason: Array.isArray(warning)
                ? warning.join(": ")
                : String(warning)
            });
          }
        }
      }

      statusBox.textContent = "مرحلهٔ ۴ از ۵: در حال دریافت نتایج متنی...";

      const generalSettled = await Promise.all(
        ENGINES.map(async engine => {
          try {
            return {
              engine,
              data: await searchEngine(searchQuery, engine)
            };
          } catch (error) {
            return { engine, error };
          }
        })
      );

      if (thisSearch !== searchSequence) return;

      for (const item of generalSettled) {
        if (!item.data) {
          currentWarnings.push({
            engine: item.engine,
            reason: item.error?.message || "پاسخ دریافت نشد"
          });

          continue;
        }

        groups.push({
          engine: item.engine,
          data: item.data,
          priority: 1
        });

        for (const warning of item.data.unresponsive_engines || []) {
          currentWarnings.push({
            engine: item.engine,
            reason: Array.isArray(warning)
              ? warning.join(": ")
              : String(warning)
          });
        }
      }

      if (thisSearch !== searchSequence) return;

      preparedResults = mergeAndRank(groups, target.directUrl);
      visibleCount = Math.min(INITIAL_LIMIT, preparedResults.length);

      /* نتایج متنی پیش از شروع جست‌وجوی تصاویر نمایش داده می‌شوند. */
      renderVisible();

      /*
       * مرحلهٔ پنجم: اکنون که مراحل قبلی پایان یافته‌اند،
       * جست‌وجوی تصاویر DuckDuckGo، Bing و Yandex آغاز می‌شود.
       */
      statusBox.textContent = "مرحلهٔ ۵ از ۵: در حال دریافت و رتبه‌بندی تصاویر...";

      try {
        await collectImageResults(
          searchQuery,
          thisSearch,
          wikiImageResult
        );
      } catch (error) {
        console.warn("Image collection failed:", error);
      }

      if (thisSearch !== searchSequence) return;

      /*
       * پایان جست‌وجو:
       * تصویر ویکی‌پدیا، در صورت وجود، تصویر اول باقی می‌ماند.
       * اگر ویکی‌پدیا تصویری نداشته باشد، گالری از تصاویر رتبه‌بندی‌شده
       * موتورهای دیگر تشکیل می‌شود.
       */
      if (preparedResults.length) {
        statusBox.textContent = "";
      } else if (weatherData) {
        statusBox.textContent =
          "اطلاعات هواشناسی نمایش داده شد؛ نتیجهٔ متنی دیگری پیدا نشد.";
      } else if (currentWarnings.length) {
        statusBox.textContent =
          "موتورهای جست‌وجو پاسخ ندادند. چند لحظه صبر کن و دوباره امتحان کن.";
      } else {
        statusBox.textContent =
          "نتیجه‌ای پیدا نشد. عبارت دیگری را امتحان کن.";
      }

      /*
       * اگر هم نتیجهٔ متنی و هم هواشناسی موجود نباشند،
       * پیام خطا یا نبود نتیجه نمایش داده می‌شود؛
       * گالری نیز مطابق تصاویر قابل دریافت تکمیل شده است.
       */
    } catch (error) {
      console.error("Shiraali Search error:", error);

      if (thisSearch === searchSequence) {
        statusBox.textContent = weatherData
          ? "اطلاعات هواشناسی نمایش داده شد، اما جست‌وجو با خطا مواجه شد."
          : "دریافت نتایج ناموفق بود. چند لحظه صبر کن و دوباره امتحان کن.";

        renderVisible();
      }
    } finally {
      if (thisSearch === searchSequence) {
        submitButton.disabled = false;
      }
    }
  });
</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Shiraali.ir">

    <title>Shiraali.ir</title>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">


    <style>

        /* =================================================
           RESET
        ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =================================================
           LIGHT MODE
        ================================================= */

        :root {

            /* آبی بسیار کم‌رنگ و یکدست */
            --background: #dff2ff;

            /* رنگ نوشته اصلی */
            --text: #062d5c;

            /* رنگ نوشته فرعی */
            --text-soft: #285d8c;

            /* رنگ نقطه وسط */
            --accent: #2188d1;

            /* کنترل‌های بالای صفحه */
            --control-bg:
                rgba(255, 255, 255, 0.48);

            --control-border:
                rgba(40, 130, 200, 0.28);

            /* سایه */
            --shadow:
                rgba(0, 60, 120, 0.10);
        }


        /* =================================================
           DARK MODE
        ================================================= */

        body.dark {

            /*
               سرمه‌ای / آبی خیلی تیره
               کاملاً یکدست
            */

            --background: #0b3157;

            --text: #ffffff;

            --text-soft: #d8e9f8;

            --accent: #76b9e8;

            --control-bg:
                rgba(255, 255, 255, 0.09);

            --control-border:
                rgba(255, 255, 255, 0.20);

            --shadow:
                rgba(0, 20, 45, 0.30);
        }


        /* =================================================
           BODY
        ================================================= */

        body {

            font-family:
                Tahoma,
                "Segoe UI",
                Arial,
                sans-serif;

            overflow-x: hidden;

            color: var(--text);

            /*
               مهم:
               هیچ گرادیان یا تغییر رنگی وجود ندارد.
               کل صفحه دقیقاً یک رنگ است.
            */

            background:
                var(--background);

            transition:
                background 0.5s ease,
                color 0.5s ease;
        }


        /* =================================================
           MAIN PAGE
        ================================================= */

        .page {

            position: relative;

            width: 100vw;
            min-height: 100vh;
            height: auto;

            display: flex;
            flex-direction: column;

            justify-content: flex-start;
            align-items: center;

            padding: 30px;

            overflow: visible;
        }


        /* =================================================
           TOP BAR

           همیشه LTR است تا تغییر زبان
           جای کنترل‌ها را تغییر ندهد.
        ================================================= */

        .top-bar {

            position: absolute;

            top: 30px;

            left: 0;
            right: 0;

            width: 100%;

            padding-left: 42px;
            padding-right: 42px;

            display: flex;

            flex-direction: row;

            justify-content: space-between;
            align-items: center;

            direction: ltr;

            z-index: 10;
        }


        /* =================================================
           DAY / NIGHT SWITCH
        ================================================= */

        .theme-switch {

            direction: ltr;

            flex-shrink: 0;

            width: 92px;
            height: 46px;

            border-radius: 30px;

            border:
                1px solid var(--control-border);

            background:
                var(--control-bg);

            backdrop-filter: blur(12px);

            display: flex;

            align-items: center;

            padding: 4px;

            cursor: pointer;

            box-shadow:
                0 8px 30px var(--shadow);
        }


        .theme-slider {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.97);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 19px;

            transition:
                transform 0.4s ease;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.12);
        }


        /* حرکت دایره فقط داخل کنترل */

        body.dark
        .theme-slider {

            transform:
                translateX(46px);
        }


        /* =================================================
           CENTER CONTENT
        ================================================= */

        .content {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 1000px;
            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            transform:
                translateY(-15px);
        }


        /* =================================================
           LOGO
        ================================================= */

        .logo {

            width: 260px;
            height: 260px;

            object-fit: contain;

            display: block;

            margin-bottom: 28px;

            transition:
                transform 0.4s ease;
        }


        .logo:hover {

            transform:
                scale(1.02);
        }


        /* =================================================
           MAIN TITLE
        ================================================= */

        h1 {

            color: var(--text);

            font-size:
                clamp(30px, 4.2vw, 55px);

            font-weight: 700;

            line-height: 1.5;

            margin-bottom: 8px;
        }


        /* =================================================
           ENGLISH TITLE
        ================================================= */

        .english-title {

            direction: ltr;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            font-size:
                clamp(20px, 2.3vw, 30px);

            font-weight: 500;

            line-height: 1.5;

            margin-bottom: 20px;
        }


        /* =================================================
           DESCRIPTION
        ================================================= */

        .description {

            color: var(--text-soft);

            font-size:
                clamp(15px, 1.5vw, 19px);

            line-height: 2;

            margin-bottom: 30px;
        }


        /* =================================================
           DIVIDER
        ================================================= */

        .divider {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            margin-bottom: 50px;
        }


        .divider-line {

            width: 125px;

            height: 1px;

            background:
                var(--text-soft);

            opacity: 0.55;
        }


        .divider-dot {

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background:
                var(--accent);
        }


        /* =================================================
           DOWN ARROW
        ================================================= */

        .arrow {

            width: 22px;
            height: 22px;

            border-right:
                3px solid var(--text);

            border-bottom:
                3px solid var(--text);

            transform:
                rotate(45deg);

            opacity: 0.9;

            animation:
                arrowMove 2s infinite;
        }


        @keyframes arrowMove {

            0%,
            100% {

                transform:
                    rotate(45deg)
                    translate(0, 0);
            }

            50% {

                transform:
                    rotate(45deg)
                    translate(5px, 5px);
            }
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .page {

                min-height: 100svh;

                padding: 20px;
            }


            .top-bar {

                top: 18px;

                padding-left: 18px;
                padding-right: 18px;
            }


            .theme-switch {

                width: 78px;
                height: 40px;
            }


            .theme-slider {

                width: 32px;
                height: 32px;

                font-size: 17px;
            }


            body.dark
            .theme-slider {

                transform:
                    translateX(38px);
            }


            .content {
                min-height: 100svh;
                transform: translateY(-5px);
            }


            .logo {

                width: 190px;
                height: 190px;

                margin-bottom: 20px;
            }


            h1 {

                font-size: 28px;

                line-height: 1.65;
            }


            .english-title {

                font-size: 19px;
            }


            .description {

                font-size: 14px;

                max-width: 330px;

                margin-bottom: 25px;
            }


            .divider {

                margin-bottom: 38px;
            }


            .divider-line {

                width: 75px;
            }
        }


        /* =================================================
           SMALL HEIGHT
        ================================================= */

        @media (max-height: 700px) {

            .logo {

                width: 155px;
                height: 155px;

                margin-bottom: 12px;
            }


            h1 {

                font-size: 25px;
            }


            .description {

                margin-bottom: 18px;
            }


            .divider {

                margin-bottom: 25px;
            }
        }


        /* =================================================
           30-HOUR CLOCK
        ================================================= */
        .clock-section {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 800px;
            margin: 10px auto 50px;
            padding: 30px 15px 45px;
            text-align: center;
        }

        .clock-title {
            color: var(--text);
            font-size: clamp(20px, 2.5vw, 28px);
            margin-bottom: 18px;
        }

        .clock-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            direction: rtl;
            margin-bottom: 12px;
        }

        .clock-toggle {
            padding: 9px 18px;
            font-size: 14px;
            font-family: Tahoma, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: var(--control-bg);
            border: 1px solid var(--control-border);
            border-radius: 24px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px var(--shadow);
            transition: background .3s ease, color .3s ease;
        }

        .clock-toggle:hover { opacity: .85; }

        .clock-canvas {
            width: 320px;
            height: 320px;
            max-width: 90vw;
            display: block;
            margin: 15px auto;
            background: transparent;
        }

        .clock-digital {
            direction: ltr;
            font-size: clamp(28px, 5vw, 38px);
            font-weight: bold;
            letter-spacing: 4px;
            white-space: nowrap;
            margin-top: 8px;
        }

        @media (max-width: 700px) {
            .clock-section { padding-top: 20px; }
            .clock-canvas { width: 290px; height: 290px; }
        }

    </style>

</head>


<body>


<main class="page">


    <!-- ================================================
         TOP CONTROLS
    ================================================= -->

    <header class="top-bar"><!-- DAY / NIGHT -->

        <button
            class="theme-switch"
            type="button"
            onclick="toggleTheme()"
            aria-label="تغییر حالت روز و شب">

            <span
                id="themeIcon"
                class="theme-slider">

                ☀️

            </span>

        </button>

    </header>



    <!-- ================================================
         CENTER CONTENT
    ================================================= -->

    <section class="content">


        <!-- LOGO -->

        <img
            src="/logo.png"
            alt="Shiraali Logo"
            class="logo">

        <h1>
                سایت بزودی راه‌اندازی می‌شود
            </h1>


            <div class="english-title">

                The website will be launching soon

            </div>


            <p class="description">

                به زودی با محتوای بهتر و امکانات بیشتر
                در خدمت شما خواهیم بود.

            </p>
<!-- DIVIDER -->

        <div class="divider">

            <span class="divider-line"></span>

            <span class="divider-dot"></span>

            <span class="divider-line"></span>

        </div>


        <!-- ARROW -->

        <div class="arrow"></div>


    </section>




<!-- =====================================================
     30-HOUR CLOCK AT BOTTOM OF SITE
===================================================== -->
<section class="clock-section" aria-label="ساعت ۳۰ ساعته">
    <h2 class="clock-title">ساعت ۳۰ ساعته</h2>
    <div class="clock-controls">
        <button class="clock-toggle" id="clockModeBtn" type="button">سوییچ به حالت ۳۰ ساعته</button>
    </div>
    <canvas id="clockCanvas" class="clock-canvas" width="320" height="320"></canvas>
    <div class="clock-digital">
        <span id="clockHour">00</span> : <span id="clockMin">00</span> : <span id="clockSec">00</span>
    </div>
</section>

</main>



<script>


/* =====================================================
   THEME
===================================================== */

function toggleTheme() {

    document.body.classList.toggle("dark");


    const isDark =
        document.body.classList.contains("dark");


    localStorage.setItem(
        "theme",
        isDark ? "dark" : "light"
    );


    updateThemeIcon();
}


function updateThemeIcon() {

    const icon =
        document.getElementById("themeIcon");


    const isDark =
        document.body.classList.contains("dark");


    icon.textContent =
        isDark ? "🌙" : "☀️";
}



/* =====================================================
   LOAD SAVED SETTINGS
===================================================== */

const savedTheme =
    localStorage.getItem("theme");

if (savedTheme === "dark") {
    document.body.classList.add("dark");
}

updateThemeIcon();



/* =====================================================
   30-HOUR CLOCK
===================================================== */
let clockTenHourMode = true;
const clockCanvas = document.getElementById("clockCanvas");
const clockCtx = clockCanvas.getContext("2d");

function get30HourTime() {
    const now = new Date();
    const seconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
    const total = seconds * (300000 / 86400);
    return {
        hour: Math.floor(total / 10000) % 30,
        minute: Math.floor((total % 10000) / 100),
        second: Math.floor(total % 100)
    };
}

function draw30HourClock(hour, min, sec) {
    const ctx = clockCtx, cx = 160, cy = 160, r = 145;
    ctx.clearRect(0, 0, 320, 320);
    const dark = document.body.classList.contains("dark");
    const divisions = clockTenHourMode ? 10 : 30;
    const ringColor = dark ? "#333" : "#c7d7e5";
    const tickColor = dark ? "#ddd" : "#284b68";
    const labelColor = dark ? "#fff" : "#062d5c";
    const minorColor = dark ? "#666" : "#8aa4b8";

    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 19; ctx.strokeStyle = ringColor; ctx.stroke();

    for (let i = 0; i < divisions; i++) {
        const ang = Math.PI * 2 * i / divisions - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + (r - 27) * Math.cos(ang), cy + (r - 27) * Math.sin(ang));
        ctx.lineTo(cx + (r - 8) * Math.cos(ang), cy + (r - 8) * Math.sin(ang));
        ctx.lineWidth = 4; ctx.strokeStyle = tickColor; ctx.stroke();
        const tx = cx + (r - 50) * Math.cos(ang);
        const ty = cy + (r - 50) * Math.sin(ang);
        ctx.fillStyle = labelColor; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(String(i), tx, ty);
    }

    if (clockTenHourMode) {
        for (let i = 0; i < divisions; i++) {
            const a1 = Math.PI * 2 * i / divisions - Math.PI / 2;
            const a2 = Math.PI * 2 * (i + 1) / divisions - Math.PI / 2;
            for (let k = 1; k <= 10; k++) {
                const ang = a1 + (a2 - a1) * (k / 11);
                ctx.beginPath();
                ctx.moveTo(cx + (r - 19) * Math.cos(ang), cy + (r - 19) * Math.sin(ang));
                ctx.lineTo(cx + (r - 12) * Math.cos(ang), cy + (r - 12) * Math.sin(ang));
                ctx.lineWidth = 1.2; ctx.strokeStyle = minorColor; ctx.stroke();
            }
        }
    }

    let hourColor = "#00ccff";
    if (clockTenHourMode) {
        if (hour >= 10 && hour <= 19) hourColor = "#ffcc00";
        else if (hour >= 20) hourColor = "#cc66ff";
    }

    const hDisplay = clockTenHourMode ? hour % 10 : hour;
    const hAng = Math.PI * 2 * (hDisplay % divisions) / divisions + Math.PI * 2 * min / (divisions * 100) - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 65 * Math.cos(hAng), cy + 65 * Math.sin(hAng));
    ctx.lineWidth = 8; ctx.strokeStyle = hourColor; ctx.lineCap = "round"; ctx.stroke();

    const mAng = Math.PI * 2 * min / 100 - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 99 * Math.cos(mAng), cy + 99 * Math.sin(mAng));
    ctx.lineWidth = 5; ctx.strokeStyle = "#00ff88"; ctx.stroke();

    const sAng = Math.PI * 2 * sec / 100 - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 114 * Math.cos(sAng), cy + 114 * Math.sin(sAng));
    ctx.lineWidth = 2.5; ctx.strokeStyle = "#ff4444"; ctx.stroke();

    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2);
    ctx.fillStyle = hourColor; ctx.fill();
}

function update30HourClock() {
    const t = get30HourTime();
    const displayHour = clockTenHourMode ? t.hour % 10 : t.hour;
    document.getElementById("clockHour").textContent = String(displayHour).padStart(2, "0");
    document.getElementById("clockMin").textContent = String(t.minute).padStart(2, "0");
    document.getElementById("clockSec").textContent = String(t.second).padStart(2, "0");
    draw30HourClock(t.hour, t.minute, t.second);
}

document.getElementById("clockModeBtn").addEventListener("click", () => {
    clockTenHourMode = !clockTenHourMode;
    document.getElementById("clockModeBtn").textContent = clockTenHourMode ? "سوییچ به حالت ۳۰ ساعته" : "سوییچ به حالت ۱۰ ساعته";
    update30HourClock();
});

setInterval(update30HourClock, 50);
update30HourClock();

</script>


</body>

</html>
